const button = document.getElementById("spotifyButton");
const statusBox = document.getElementById("status");
const detailsBox = document.getElementById("details");
const trackList = document.getElementById("trackList");

let activeToken = null;

function renderTrackList() {
  trackList.innerHTML = "";

  W35_TRACKS.forEach(track => {
    const li = document.createElement("li");
    li.textContent =
      track.artist +
      " — " +
      track.title +
      (track.year ? " (" + track.year + ")" : "");
    trackList.appendChild(li);
  });
}

function setStatus(text) {
  statusBox.textContent = text;
}

function setDetails(html) {
  detailsBox.innerHTML = html;

  if (html) {
    detailsBox.classList.add("visible");
  } else {
    detailsBox.classList.remove("visible");
  }
}

function randomString(length) {
  const possible =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  const values =
    crypto.getRandomValues(new Uint8Array(length));

  return values.reduce(
    (acc, x) => acc + possible[x % possible.length],
    ""
  );
}

async function sha256(text) {
  const data = new TextEncoder().encode(text);
  return crypto.subtle.digest("SHA-256", data);
}

function base64urlencode(buffer) {
  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function normalizeText(text) {
  return text
    .normalize("NFD")
    .replace(/\p{Diacritic}/gu, "")
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, "");
}

async function startSpotifyLogin() {
  const verifier = randomString(64);
  const challenge =
    base64urlencode(await sha256(verifier));

  sessionStorage.setItem(
    "spotify_code_verifier",
    verifier
  );

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  window.location =
    "https://accounts.spotify.com/authorize?" +
    params.toString();
}

async function getAccessToken(code) {
  const verifier =
    sessionStorage.getItem("spotify_code_verifier");

  if (!verifier) {
    throw new Error(
      "De Spotify-beveiligingscode ontbreekt. Start de koppeling opnieuw."
    );
  }

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code: code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: body
    }
  );

  if (!response.ok) {
    const text = await response.text();
    throw new Error(
      "Spotify-login kon niet worden afgerond: " +
      text
    );
  }

  return response.json();
}

async function spotifyFetch(
  url,
  token,
  options = {},
  retryCount = 0
) {
  const response = await fetch(url, {
    ...options,
    headers: {
      Authorization: "Bearer " + token,
      ...(options.body
        ? { "Content-Type": "application/json" }
        : {}),
      ...(options.headers || {})
    }
  });

  if (response.status === 429 && retryCount < 2) {
    const retryAfter =
      Number(response.headers.get("Retry-After")) || 2;

    setStatus(
      "Spotify vraagt even rust. Over " +
      retryAfter +
      " seconden gaan we automatisch verder…"
    );

    await delay(retryAfter * 1000);

    return spotifyFetch(
      url,
      token,
      options,
      retryCount + 1
    );
  }

  if (!response.ok) {
    const text = await response.text();

    throw new Error(
      "Spotify API-fout " +
      response.status +
      ": " +
      text
    );
  }

  if (response.status === 204) return null;

  return response.json();
}

function isExactTrackMatch(candidate, requested) {
  const titleMatches =
    normalizeText(candidate.name) ===
    normalizeText(requested.title);

  const artistMatches =
    candidate.artists.some(
      artist =>
        normalizeText(artist.name) ===
        normalizeText(requested.artist)
    );

  return titleMatches && artistMatches;
}

function chooseBestCandidate(items, requested) {
  const exactMatches =
    items.filter(item =>
      isExactTrackMatch(item, requested)
    );

  if (exactMatches.length === 0) {
    return null;
  }

  exactMatches.sort((a, b) => {
    const albumScoreA =
      a.album?.album_type === "album"
        ? 20
        : a.album?.album_type === "single"
        ? 10
        : 0;

    const albumScoreB =
      b.album?.album_type === "album"
        ? 20
        : b.album?.album_type === "single"
        ? 10
        : 0;

    return albumScoreB - albumScoreA;
  });

  return exactMatches[0];
}

async function searchSpotifyTrack(token, requested) {
  const strictQuery =
    `track:"${requested.title}" ` +
    `artist:"${requested.artist}"`;

  const params =
    new URLSearchParams({
      q: strictQuery,
      type: "track",
      limit: "10"
    });

  let data = await spotifyFetch(
    "https://api.spotify.com/v1/search?" +
      params.toString(),
    token
  );

  let candidate =
    chooseBestCandidate(
      data.tracks?.items || [],
      requested
    );

  if (candidate) return candidate;

  const fallbackParams =
    new URLSearchParams({
      q: requested.title + " " + requested.artist,
      type: "track",
      limit: "10"
    });

  data = await spotifyFetch(
    "https://api.spotify.com/v1/search?" +
      fallbackParams.toString(),
    token
  );

  return chooseBestCandidate(
    data.tracks?.items || [],
    requested
  );
}

async function resolveAllTracks(token) {
  const resolved = [];
  const unresolved = [];

  setDetails("");

  for (let i = 0; i < W35_TRACKS.length; i++) {
    const requested = W35_TRACKS[i];

    setStatus(
      `Spotify-controle ${i + 1} van ${W35_TRACKS.length}\n` +
      requested.artist +
      " — " +
      requested.title
    );

    try {
      const found =
        await searchSpotifyTrack(
          token,
          requested
        );

      if (found) {
        resolved.push({
          requested,
          spotify: found
        });
      } else {
        unresolved.push(requested);
      }
    } catch (error) {
      console.error(
        "Zoekfout:",
        requested,
        error
      );

      unresolved.push(requested);
    }

    await delay(120);
  }

  return { resolved, unresolved };
}

function showResolvedSummary(resolved, unresolved) {
  let html =
    `<strong class="ok">${resolved.length} tracks exact gevonden.</strong>`;

  if (unresolved.length > 0) {
    html +=
      `<br><br><strong class="warning">` +
      `${unresolved.length} track(s) vragen controle:</strong><br>`;

    unresolved.forEach(track => {
      html +=
        "• " +
        track.artist +
        " — " +
        track.title +
        "<br>";
    });
  }

  setDetails(html);
}

async function createW35Playlist(token) {
  button.disabled = true;
  button.textContent = "W35 wordt gecontroleerd…";

  try {
    const result =
      await resolveAllTracks(token);

    showResolvedSummary(
      result.resolved,
      result.unresolved
    );

    if (
      result.unresolved.length > 0 ||
      result.resolved.length !== W35_TRACKS.length
    ) {
      setStatus(
        "VEILIGHEIDSSTOP\n" +
        "Er is nog geen playlist gemaakt. " +
        "Eerst moeten alle 30 tracks exact zijn gevonden."
      );

      button.disabled = false;
      button.textContent =
        "Controleer W35 opnieuw";

      button.onclick = () =>
        createW35Playlist(token);

      return;
    }

    setStatus(
      "Alle 30 tracks zijn exact gevonden.\n" +
      "Ontdek-DNA — 2026 W35 wordt nu gemaakt…"
    );

    const playlist =
      await spotifyFetch(
        "https://api.spotify.com/v1/me/playlists",
        token,
        {
          method: "POST",
          body: JSON.stringify({
            name: PLAYLIST_NAME,
            public: false,
            description:
              "Ontdek-DNA 2026 W35 — 30 ontdekkingen vanuit Ben's Music DNA."
          })
        }
      );

    const uris =
      result.resolved.map(
        item => item.spotify.uri
      );

    await spotifyFetch(
      "https://api.spotify.com/v1/playlists/" +
        playlist.id +
        "/items",
      token,
      {
        method: "POST",
        body: JSON.stringify({
          uris: uris
        })
      }
    );

    setStatus(
      "GELUKT! 🎉\n" +
      "Ontdek-DNA — 2026 W35 staat met 30 tracks in Spotify."
    );

    button.disabled = false;
    button.textContent = "Open W35 in Spotify";

    button.onclick = () => {
      window.location.href =
        playlist.external_urls.spotify;
    };

  } catch (error) {
    console.error(error);

    setStatus(
      "Er ging iets mis.\n" +
      error.message
    );

    button.disabled = false;
    button.textContent =
      "Probeer W35 opnieuw";

    button.onclick = () =>
      createW35Playlist(token);
  }
}

async function handleSpotifyReturn() {
  const params =
    new URLSearchParams(
      window.location.search
    );

  const code = params.get("code");

  if (!code) return;

  history.replaceState(
    {},
    document.title,
    REDIRECT_URI
  );

  try {
    setStatus(
      "Spotify-login wordt afgerond…"
    );

    const tokenData =
      await getAccessToken(code);

    activeToken =
      tokenData.access_token;

    await createW35Playlist(activeToken);

  } catch (error) {
    console.error(error);

    setStatus(
      "Er ging iets mis: " +
      error.message
    );

    button.disabled = false;
    button.textContent =
      "Koppel opnieuw met Spotify";
  }
}
