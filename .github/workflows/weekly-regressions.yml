name: Weekly Music DNA regressions

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline weekly regression checks
        run: node scripts/run-weekly-regressions.cjs
      - name: Master and Depot consistency
        run: python3 scripts/audit-master-depot.py
