name: Depot and Music Meter offline checks
on:
  pull_request:
    paths:
      - 'scripts/analyze-depot-meter.py'
      - 'scripts/export-meter-candidates.cjs'
      - 'scripts/depot-review-policy.py'
      - 'test/depot-meter-policy.py'
      - 'docs/DEPOT-REVIEW-POLICY.md'
      - 'docs/depot-meter-2026-10-09/**'
      - '.github/workflows/depot-meter.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 test/depot-meter-policy.py
      - run: python3 scripts/audit-master-depot.py
      - run: python3 scripts/analyze-depot-meter.py --output-dir /tmp/music-dna-meter
