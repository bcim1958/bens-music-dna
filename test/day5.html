<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ben's Music DNA — W35 Dag 5</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 20px 48px}.top{text-align:center;margin-bottom:25px}.mark{width:50px;height:50px;border:1.5px solid var(--g);border-radius:50%;display:grid;place-items:center;font-size:24px;margin:0 auto 8px}.eye,.status{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.muted{color:var(--m)}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h3{font-size:20px;margin:0 0 7px}.intro{font-size:17px;line-height:1.45}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.meta{font-size:15px;color:#bbc7c1;margin-top:8px;line-height:1.45}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:13px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px;color:#d1f7dc}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b;cursor:pointer}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 14px;cursor:pointer}.why{font-size:17px;line-height:1.52}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700}.trackbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:8px 0 16px}.trackbar div{height:100%;background:var(--g)}.summary-row{padding:13px 0;border-bottom:1px solid var(--l)}.summary-row:last-child{border:0}.complete{text-align:center;padding-top:24px}.complete .mark{width:64px;height:64px;font-size:30px}.learn{border-color:rgba(30,215,96,.28)}</style></head><body><main class="app"><div class="top"><div class="mark">♫</div><div class="eye">Ben's Music DNA</div><div class="muted">Ontdek-DNA · W35 · Dag 5</div></div><div id="screen"></div></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-learning-v1.js"></script><script src="music-dna-selector-v1.js"></script><script>(function(){var screen=document.getElementById('screen'),labels={raak:'❤️ Raak',goed:'👍 Goed',twijfel:'😐 Twijfel',nee:'👎 Nee'},key='bmd-day5-v13';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function track(id){return MUSIC_DNA_W35_CANDIDATES.tracks[id]}function n(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function country(c){var m={'United States':'Verenigde Staten','United Kingdom':'Verenigd Koninkrijk','Sweden':'Zweden','Norway':'Noorwegen','Australia':'Australië'};return m[c]||c||'Onbekend'}function previousIds(){var a=[];for(var d=1;d<=4;d++){var s=read('bmd-day'+d+'-v13',{});for(var id in s)if(s[id]&&s[id].rating)a.push(id)}['bmd-day3-selection-v1','bmd-day4-selection-v1'].forEach(function(k){var x=read(k,null);if(x&&x.ids)a=a.concat(x.ids)});return a}var sel=read('bmd-day5-selection-v1',null);if(!sel||!sel.ids||sel.ids.length!==3){var chosen=MUSIC_DNA_SELECTOR.chooseBatch(MUSIC_DNA_W35_CANDIDATES.tracks,{size:3,excludeIds:previousIds()});sel={ids:chosen.map(function(x){return x.id}),scores:{},createdAt:new Date().toISOString(),signalCount:MUSIC_DNA_SELECTOR.buildProfile().count};chosen.forEach(function(x){sel.scores[x.id]=x.score});write('bmd-day5-selection-v1',sel)}var ids=sel.ids;function state(){return read(key,{})}function done(s){return ids.filter(function(id){return s[id]&&s[id].rating}).length}function list(){screen.innerHTML='';screen.appendChild(n('div','eye','Vandaag · geleerd uit Dag 1–4'));screen.appendChild(n('h1','','Jouw 3 ontdekkingen'));screen.appendChild(n('div','intro','Gekozen met twaalf eerdere beoordelingen als leerhistorie.'));var p=n('section','panel learn');p.appendChild(n('div','eye','Waarom juist deze drie?'));p.appendChild(n('div','why','De selector heeft Dag 4 nu als drie extra sterke Raak-signalen meegenomen en zoekt opnieuw naar de beste nog niet beluisterde routes, met spreiding tussen artiesten en landen.'));screen.appendChild(p);var s=state(),d=done(s);screen.appendChild(n('div','muted',d+' van 3 beoordeeld'));var bar=n('div','trackbar'),fill=n('div');fill.style.width=(d/3*100)+'%';bar.appendChild(fill);screen.appendChild(bar);ids.forEach(function(id,i){var t=track(id),c=n('section','card'),r=s[id]&&s[id].rating;c.appendChild(n('div','status',r?'✓ BEOORDEELD':(i+1)+' VAN 3 · NOG TE ONTDEKKEN'));c.appendChild(n('h3','',t.identity.title));c.appendChild(n('div','muted',t.identity.artist));c.appendChild(n('div','meta',country(t.identity.country)+' · '+t.identity.releaseYear+' · '+t.identity.albumOrRelease));var tags=n('div','tags'),st=(t.taxonomy&&t.taxonomy.allMusicStyles)||[];(st.length?st:t.discoverDNA.dnaRoute.slice(0,2)).slice(0,2).forEach(function(x){tags.appendChild(n('span','tag',x))});c.appendChild(tags);if(r)c.appendChild(n('div','meta',labels[r]));c.onclick=function(){detail(id)};screen.appendChild(c)});if(d===3){var b=n('button','btn','Bekijk dagafsluiting →');b.onclick=complete;screen.appendChild(b)}}function detail(id){var t=track(id);screen.innerHTML='';var b=n('button','back','‹ Vandaag');b.onclick=list;screen.appendChild(b);screen.appendChild(n('div','eye',country(t.identity.country)+' · '+t.identity.releaseYear));screen.appendChild(n('h1
