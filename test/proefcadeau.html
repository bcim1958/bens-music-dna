<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><title>Music DNA · Proefcadeau</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 54px) 20px 48px}.top{text-align:center;margin-bottom:30px}.logo{width:76px;height:76px;border-radius:17px;display:block;margin:0 auto 14px}.brand,.eye{color:var(--g);font-size:12px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.brand{font-size:15px}.muted{color:var(--m)}h1{font-size:31px;line-height:1.08;margin:8px 0 10px}.intro{font-size:17px;line-height:1.5}.gift{font-size:76px;margin:24px 0 12px;filter:drop-shadow(0 0 20px rgba(30,215,96,.16))}.panel,.track{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.btn{width:100%;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:850;margin:14px 0;background:var(--g);color:#07100b}.track h3{font-size:19px;margin:4px 0}.meta{font-size:14px;line-height:1.45;color:#bbc7c1}.tag{display:inline-block;font-size:12px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:6px 9px;border-radius:999px;color:#d1f7dc;margin-top:9px}.footer{text-align:center;color:#718078;font-size:12px;margin-top:28px}.notice{text-align:center}.count{width:104px;height:104px;border:2px solid var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:22px auto;color:var(--g);font-size:38px;font-weight:850}</style></head><body><main class="app"><div class="top"><img class="logo" src="apple-touch-icon.png?v=3" alt="Music DNA"><div class="brand">Ben's Music DNA</div><div class="muted">Ontdek DNA · Proefcadeau</div></div><div id="screen"></div><div class="footer">Technische proef · geen learning · geen weekoogst</div></main><script src="music-dna-proefcadeau-v1.js"></script><script>(function(){var s=document.getElementById('screen');function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function sealed(){s.innerHTML='';var w=el('section','notice');w.appendChild(el('div','eye','Speciaal voor deze proef'));w.appendChild(el('div','gift','🎁'));w.appendChild(el('h1','','Er staat een cadeau voor je klaar'));w.appendChild(el('div','intro muted','21 nummers uit je oorspronkelijke Music DNA-database. De inhoud blijft dicht tot jij hem uitpakt.'));var b=el('button','btn','Bekijk mijn cadeau');b.onclick=unwrap;w.appendChild(b);s.appendChild(w)}function unwrap(){s.innerHTML='';s.appendChild(el('div','eye','Proefcadeau uitgepakt'));s.appendChild(el('h1','','Jouw 21 nummers'));s.appendChild(el('div','intro muted','Een gevarieerde proefselectie uit je oorspronkelijke database. Deze beoordeling telt nergens mee; vandaag ervaren we alleen het cadeau.'));var c=el('div','count','21');s.appendChild(c);MUSIC_DNA_PROEFCADEAU_V1.tracks.forEach(function(t,i){var x=el('section','track');x.appendChild(el('div','eye',String(i+1).padStart(2,'0')+' · '+t.country+' · '+t.year));x.appendChild(el('h3','',t.title));x.appendChild(el('div','muted',t.artist));x.appendChild(el('span','tag',t.route));s.appendChild(x)});var p=el('section','panel');p.appendChild(el('div','eye','Volgende stap'));p.appendChild(el('div','intro','Als dit cadeau goed voelt, bouwen we hierna de expliciete knop “Zet mijn cadeau in Spotify”.'));s.appendChild(p)}sealed()})();</script></body></html>
