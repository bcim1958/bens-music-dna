<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · iPhone UI integrity gate</title><style>body{font:15px -apple-system,sans-serif;background:#090a15;color:#eee;padding:24px}iframe{width:390px;height:844px;border:1px solid #444;border-radius:28px;background:#050611}.pass{color:#55df98}.fail{color:#ff7777}pre{white-space:pre-wrap}</style></head><body><h1>iPhone UI integrity gate</h1><p>Read-only structure check. This gate does not create selections or ratings.</p><iframe id="app" src="music-dna-iphone-shell-v1.html?preview=1"></iframe><pre id="out">Laden…</pre><script>
(function(){
 var frame=document.getElementById('app'),out=document.getElementById('out'),tries=0,maxTries=50;
 function finish(r){
   out.className=r.ok?'pass':'fail';
   out.textContent=(r.ok?'PASS':'FAIL')+'\n\n'+r.checks.map(function(x){return (x.ok?'✓ ':'✗ ')+x.name}).join('\n');
 }
 function poll(){
   tries++;
   try{
     var w=frame.contentWindow;
     if(w&&typeof w.MUSIC_DNA_IPHONE_UI_GATE==='function'){
       var r=w.MUSIC_DNA_IPHONE_UI_GATE();
       r.checks.push({name:'preview mode isolated from production display',ok:w.document.documentElement.getAttribute('data-preview')==='1'});
       r.ok=r.checks.every(function(x){return x.ok});
       finish(r);return;
     }
   }catch(e){}
   if(tries>=maxTries){finish({ok:false,checks:[{name:'UI gate became ready within 5 seconds',ok:false}]});return}
   setTimeout(poll,100);
 }
 frame.onload=function(){tries=0;poll()};
})();
</script></body></html>
