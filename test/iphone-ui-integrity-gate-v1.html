<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · iPhone UI integrity gate</title><style>body{font:15px -apple-system,sans-serif;background:#090a15;color:#eee;padding:24px}iframe{width:390px;height:844px;border:1px solid #444;border-radius:28px;background:#050611}.pass{color:#55df98}.fail{color:#ff7777}pre{white-space:pre-wrap}</style></head><body><h1>iPhone UI integrity gate</h1><p>Read-only structure check. This gate does not create selections or ratings.</p><div id="frames"></div><pre id="out">Laden…</pre><script>
(function(){
 var screens=['discover','detail','world','museum'],expectedText={discover:['Ontdek-DNA','Eclipse'],detail:['Viva La Victoria','Beoordelen'],world:['Mijn Muziekwereld','uitsluitend actuele Music-DNA-waarden'],museum:['Edelsteenmuseum','Nog verzegeld']},host=document.getElementById('frames'),out=document.getElementById('out'),results={},done=0;
 function finish(){
  var checks=[];
  screens.forEach(function(screen){
   var r=results[screen];
   if(!r){checks.push({name:screen+' preview completed',ok:false});return}
   checks.push({name:screen+' preview gate passes',ok:r.ok===true});
   checks.push({name:screen+' declares zero production-data access',ok:r.productionDataAccess===false});
   checks.push({name:screen+' reports correct route',ok:r.screen===screen});
   var doc=results[screen]._doc,txt=doc&&doc.body?doc.body.textContent:'';
   checks.push({name:screen+' DOM contains route-specific content',ok:expectedText[screen].every(function(x){return txt.indexOf(x)>=0})});
   var docEl=doc&&doc.documentElement,body=doc&&doc.body;
   checks.push({name:screen+' viewport is iPhone-safe',ok:!!docEl&&docEl.scrollWidth<=430&&!!body&&body.scrollWidth<=430});
   var controls=doc?Array.prototype.slice.call(doc.querySelectorAll('button,a')):[];
   checks.push({name:screen+' interactive controls have usable height',ok:controls.length>0&&controls.every(function(el){return el.getBoundingClientRect().height>=40})});
   var clipped=doc?Array.prototype.slice.call(doc.querySelectorAll('button,a,h1,h2,.panel,.track,.gem')).filter(function(el){var r=el.getBoundingClientRect(),cs=doc.defaultView.getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&(r.right>430.5||r.left<-.5)}):[];
   checks.push({name:screen+' key content is not horizontally clipped',ok:clipped.length===0});
   var nav=doc?doc.querySelector('.nav'):null,nr=nav&&nav.getBoundingClientRect();
   checks.push({name:screen+' bottom navigation remains on-screen',ok:!!nr&&nr.left>=0&&nr.right<=430.5&&nr.height>0});
  });
  var ok=checks.every(function(x){return x.ok});
  out.className=ok?'pass':'fail';
  out.textContent=(ok?'PASS':'FAIL')+'\n\n'+checks.map(function(x){return (x.ok?'✓ ':'✗ ')+x.name}).join('\n');
 }
 screens.forEach(function(screen){
  var frame=document.createElement('iframe');frame.title='Music DNA '+screen;frame.src='music-dna-iphone-visual-preview-v1.html?screen='+screen;host.appendChild(frame);
  var tries=0,maxTries=50,settled=false;
  function settle(r){if(settled)return;settled=true;try{r._doc=frame.contentDocument}catch(e){r._doc=null}results[screen]=r;if(++done===screens.length)finish()}
  function poll(){
   tries++;
   try{var w=frame.contentWindow;if(w&&typeof w.MUSIC_DNA_VISUAL_PREVIEW_GATE==='function'){settle(w.MUSIC_DNA_VISUAL_PREVIEW_GATE());return}}catch(e){}
   if(tries>=maxTries){settle({ok:false,productionDataAccess:null,screen:screen});return}
   setTimeout(poll,100);
  }
  frame.onload=function(){tries=0;poll()};
 });
})();
</script></body></html>
