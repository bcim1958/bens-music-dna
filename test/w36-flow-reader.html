<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07130f"><title>Music DNA · W36 flow-uitlezer</title><style>*{box-sizing:border-box}body{margin:0;background:#07130f;color:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:620px;margin:auto;padding:28px 18px}.eye{color:#20df68;font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:13px}h1{font-size:28px}.card{background:#102019;border:1px solid #284137;border-radius:18px;padding:18px;margin:16px 0}.btn{width:100%;border:0;border-radius:999px;background:#20df68;color:#031009;padding:15px;font-size:16px;font-weight:850}.muted{color:#a9b5af;line-height:1.5}.list{padding-left:25px;line-height:1.55}.ok{color:#20df68}.warn{color:#ffd166}</style></head><body><main class="app"><div class="eye">Alleen-lezen · Flow-DNA</div><h1>W36 · exacte Spotify-volgorde</h1><div class="card"><p class="muted">Deze controle zoekt alleen in je eigen Spotify-playlists naar W36 en leest daarna de playlistvolgorde. Er wordt niets gemaakt, verwijderd of herschikt.</p><button class="btn" id="go">Lees W36 uit Spotify</button><p id="status" class="muted"></p></div><div class="card" id="result" hidden></div></main><script>
(async()=>{const CLIENT='97d634a60b824ecabfcc63790c0af5dd',REDIRECT='https://bcim1958.github.io/bens-music-dna/test/spotify-callback.html',go=document.getElementById('go'),status=document.getElementById('status'),result=document.getElementById('result');
function random(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>(x%36).toString(36)).join('')}async function sha256(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function token(){let t=sessionStorage.getItem('bmd_spotify_access'),e=Number(sessionStorage.getItem('bmd_spotify_expires')||0);if(t&&Date.now()<e-30000)return t;const r=localStorage.getItem('bmd_spotify_refresh');if(r){const q=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT,grant_type:'refresh_token',refresh_token:r})});if(q.ok){const x=await q.json();sessionStorage.setItem('bmd_spotify_access',x.access_token);sessionStorage.setItem('bmd_spotify_expires',String(Date.now()+(x.expires_in||3600)*1000));if(x.refresh_token)localStorage.setItem('bmd_spotify_refresh',x.refresh_token);return x.access_token}}return null}
async function auth(){const v=random(64),c=await sha256(v),s=random(24);sessionStorage.setItem('bmd_spotify_verifier',v);sessionStorage.setItem('bmd_spotify_state',s);sessionStorage.setItem('bmd_spotify_return','w36-flow-reader.html');location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT,response_type:'code',redirect_uri:REDIRECT,scope:'playlist-read-private',code_challenge_method:'S256',code_challenge:c,state:s})}
async function api(url,t){const r=await fetch(url,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('Spotify '+r.status);return r.json()}
async function playlists(t){let url='https://api.spotify.com/v1/me/playlists?limit=50',out=[];while(url){const d=await api(url,t);out=out.concat(d.items||[]);url=d.next}return out}
async function items(t,id){let url='https://api.spotify.com/v1/playlists/'+encodeURIComponent(id)+'/items?limit=50',out=[];while(url){const d=await api(url,t);out=out.concat(d.items||[]);url=d.next}return out}
function candidate(p){const n=(p.name||'').toLowerCase();return /w36|2026\s*w36|2026\s*·\s*w36|2026\s*[-–—]\s*w36/.test(n)}
async function run(){go.disabled=true;status.textContent='Spotify wordt veilig gelezen…';try{const t=await token();if(!t){await auth();return}const ps=await playlists(t),ranked=ps.map(p=>({p,s:score(p)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);let exact=[];for(const x of ranked){const rows=await items(t,x.p.id),tracks=rows.map(y=>y&&y.item).filter(y=>y&&y.type==='track');if(tracks.length===21)exact.push({p:x.p,tracks,s:x.s})}if(exact.length!==1){result.hidden=false;result.innerHTML='<div class="eye">Diagnose</div><p class="muted">Gevonden playlists: '+ps.length+'. W36-achtige namen: '+ranked.length+'. Daarvan exact 21 tracks: '+exact.length+'.</p>'+ (ranked.length?'<ol class="list">'+ranked.slice(0,10).map(x=>'<li>'+x.p.name+'</li>').join('')+'</ol>':'<p class="muted">Geen playlistnaam bevat W36, week 36 of 2026/36.</p>');status.innerHTML='<span class="warn">Nog geen unieke bron. De diagnose hierboven verandert niets.</span>';go.disabled=false;return}const p=exact[0].p,tracks=exact[0].tracks;const ref={week:'2026-W36',playlistId:p.id,playlistName:p.name,snapshotId:p.snapshot_id,ids:tracks.map(x=>x.id),uris:tracks.map(x=>x.uri),tracks:tracks.map(x=>({spotifyId:x.id,uri:x.uri,artist:(x.artists||[]).map(a=>a.name).join(', '),title:x.name})),label:'perfecte-flow',strength:1,source:'spotify-readonly',recordedAt:new Date().toISOString()};localStorage.setItem('bmd-flow-reference-2026-W36-v1',JSON.stringify(ref));status.innerHTML='<span class="ok">W36 exact gelezen: 21/21. Referentie lokaal vastgelegd.</span>';result.hidden=false;result.innerHTML='<div class="eye">Flow-DNA Reference 001</div><h2>'+p.name+'</h2><ol class="list">'+ref.tracks.map(x=>'<li>'+x.artist+' — '+x.title+'</li>').join('')+'</ol><p class="muted">Spotify-playlist-ID en snapshot zijn mee opgeslagen zodat de bron controleerbaar blijft.</p>'}catch(e){status.textContent='Veilige stop: '+e.message;go.disabled=false}}
go.onclick=run;if(new URLSearchParams(location.search).get('spotify')==='ready')run()})();
</script></body></html>
