<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · rustige pan naar aarde</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.frame{position:fixed;inset:0;overflow:hidden;background:#000}.scene{position:absolute;left:0;top:0;width:200vw;height:100vh;will-change:transform;animation:pan 18s cubic-bezier(.42,0,.18,1) forwards}.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 35% 50%,#08100e 0,#020403 48%,#000 82%)}.stars{position:absolute;inset:0;opacity:.38;background-image:radial-gradient(circle at 15% 22%,#fff 0 1px,transparent 1.4px),radial-gradient(circle at 72% 63%,#a8b7ae 0 1px,transparent 1.4px),radial-gradient(circle at 44% 77%,#fff 0 1px,transparent 1.4px);background-size:103px 91px,137px 119px,167px 143px}.album{position:absolute;width:var(--s);aspect-ratio:1;object-fit:cover;border-radius:4px;opacity:var(--o);filter:brightness(.58) saturate(.72);box-shadow:0 12px 38px #000}.near{filter:brightness(.78) saturate(.85)}.earth{position:absolute;left:139vw;top:13vh;width:42vw;max-width:720px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 62% 34%,#75825b 0 4%,transparent 4.5%),radial-gradient(circle at 57% 39%,#657852 0 10%,transparent 10.5%),radial-gradient(circle at 66% 52%,#8a774a 0 13%,transparent 13.5%),radial-gradient(circle at 44% 27%,#5d7355 0 8%,transparent 8.5%),radial-gradient(circle at 43% 46%,#174c70 0 49%,#071e2e 66%,#010609 80%);box-shadow:inset -105px -38px 135px #000,inset 28px 0 48px rgba(120,205,245,.2),0 0 7px #8ed4f4,0 0 42px rgba(69,160,213,.28)}.earth:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(ellipse at 58% 39%,rgba(255,255,255,.075) 0 1px,transparent 2px 20px);opacity:.27}.lights{position:absolute;left:51%;top:27%;width:26%;height:26%;background:radial-gradient(circle,#ffe5a1
