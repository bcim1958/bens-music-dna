<!doctype html><html lang="nl"><meta charset="utf-8"><title>Music DNA — gerichte opslagproef</title>
<style>body{font:16px system-ui;background:#07130f;color:#eef8f0;padding:30px}button{padding:15px;border-radius:10px;background:#1ed760}iframe{width:540px;height:500px;border:1px solid #466}pre{white-space:pre-wrap}</style>
<h1>Music DNA — gerichte opslagproef</h1><p>Uitsluitend fictieve gegevens op een nieuwe lokale oorsprong.</p>
<button id="run">Start gerichte test</button><pre id="report">Nog niet uitgevoerd.</pre><div id="frames"></div>
<script>
function assert(ok,msg){if(!ok)throw Error(msg);}
function equal(a,b,msg){assert(JSON.stringify(a)===JSON.stringify(b),msg);}
function maps(a,b,msg){equal(Object.keys(a).sort().map(k=>[k,a[k]]),Object.keys(b).sort().map(k=>[k,b[k]]),msg);}
function source(){return Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)]));}
async function durable(){return new Promise((resolve,reject)=>{let q=indexedDB.open('music-dna-daily-v1',1);q.onsuccess=()=>{let db=q.result;if(!db.objectStoreNames.contains('state')){db.close();resolve(null);return;}let t=db.transaction('state'),r=t.objectStore('state').get('daily');r.onsuccess=()=>{db.close();resolve(r.result||null);};r.onerror=()=>reject(r.error);};q.onerror=()=>reject(q.error);});}
async function wait(fn){let until=Date.now()+10000;while(!fn()){if(Date.now()>until)throw Error('Test timeout');await new Promise(r=>setTimeout(r,30));}}
async function frame(){let f=document.createElement('iframe');f.src='daily.html'+location.search;document.getElementById('frames').append(f);await new Promise(r=>f.onload=r);await wait(()=>{let s=f.contentDocument.getElementById('screen');return s&&!s.inert&&(s.querySelector('.card')||s.querySelector('h1')?.textContent==='Beoordeling niet bevestigd');});return f;}
async function remove(f){f.remove();await new Promise(r=>setTimeout(r,50));}
async function rate(f,index=0){let d=f.contentDocument;d.querySelectorAll('.card:not(.reserve)')[index].click();let b=[...d.querySelectorAll('.rate')].find(b=>b.textContent==='👍 GOED');await b.onclick();}
document.getElementById('run').onclick=async function(){
 this.disabled=true;let checks=[],frames=[];const output=document.getElementById('report');
 function pass(msg){checks.push(msg);output.textContent=checks.join('\n');}
 try{
  assert(location.hostname==='127.0.0.1','Local synthetic origin required');assert(localStorage.length===0,'Existing origin: refusing all writes');assert((await indexedDB.databases()).length===0,'Existing database: refusing all writes');
  let raw=await(await fetch('/synthetic-fixture')).json();const scenario=new URLSearchParams(location.search).get('syntheticFailure');if(scenario==='empty')raw={};if(scenario==='pending')raw['bmd-rating-transaction-v1']='{\"pending\":\"synthetic\"}';for(const[k,v]of Object.entries(raw))localStorage.setItem(k,v);
  let main=await frame();frames.push(main);if(scenario){assert(/Beoordeling niet bevestigd/.test(main.contentDocument.getElementById('screen').innerText),'Startup failure was accepted');maps(source(),raw,'Startup failure wrote source');assert((await durable())===null,'Startup failure committed daily record');let report={pass:true,syntheticOnly:true,realBrowser:true,scenario,checks:['PASS: '+scenario+' blocks cutover, preserves all source bytes and does not fall back'],iphoneWrites:0,spotifyWrites:0,productionWrites:0};output.textContent=JSON.stringify(report,null,2);await fetch('/synthetic-report',{method:'POST',body:JSON.stringify(report,null,2)});return;}assert(main.contentDocument.querySelector('.card'),'Daily failed: '+main.contentDocument.getElementById('screen').innerText);
  let initial=await durable();maps(initial.original,raw,'Original bytes changed');maps(source(),raw,'Source was written');
  for(let k of Object.keys(raw).filter(k=>/day1-|W40|history|unknown/.test(k)))assert(initial.current[k]===raw[k],'Historical bytes changed: '+k);
  const bank=JSON.parse(initial.current['bmd-positive-bank-v1']),oldBank=JSON.parse(raw['bmd-positive-bank-v1']);for(let id of ['fixture-fresh','fixture-used'])for(let field of ['firstPositiveAt','playlistUses','lastPlaylistWeek'])equal(bank.items[id][field],oldBank.items[id][field],'FIFO changed');
  pass('PASS: alle oorspronkelijke bytes, historische beoordelingen, reserves en FIFO behouden; nul writes aan bron');
  let second=await frame();frames.push(second);assert(/ander tabblad/.test(second.contentDocument.getElementById('screen').innerText),'Second document not blocked');equal(await durable(),initial,'Second document wrote');await remove(second);pass('PASS: tweede echt browserdocument geblokkeerd vóór writes');
  window.MUSIC_DNA_LEARNING={read:()=>({signals:{}})};let script=document.createElement('script');script.src='fixtures/compat-bank-85ad816.js';document.head.append(script);await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;});MUSIC_DNA_POSITIVE_BANK.sync();
  assert(!JSON.parse(localStorage.getItem('bmd-positive-bank-v1')).items['fixture-fresh'],'Legacy bug not reproduced');equal(await durable(),initial,'Legacy writer damaged isolated store');localStorage.clear();equal(await durable(),initial,'Legacy clear damaged store');pass('PASS: werkelijke oude bankcode verwijdert bronreserve; beschermde reserve en volledige oorspronkelijke kopie blijven behouden, ook na clear');
  await rate(main);assert(!/Beoordeling niet bevestigd/.test(main.contentDocument.getElementById('screen').innerText),'Rating failed');let rated=await durable(),day='bmd-week-2026-W42-day2-v1';assert(Object.values(JSON.parse(rated.current[day]))[0].rating==='goed','Rating not durable');maps(rated.original,raw,'Original changed');
  await remove(main);main=await frame();frames.push(main);assert(main.contentDocument.querySelector('.card'),'Reopen failed');assert((await durable()).current[day]===rated.current[day],'Reopened rating changed');pass('PASS: dag 2 beoordeling samen opgeslagen en behouden na heropenen met lege oude opslag');
  let before=await durable(),proto=main.contentWindow.IDBObjectStore.prototype,put=proto.put;proto.put=function(...args){let r=put.apply(this,args);this.transaction.abort();return r;};await rate(main,1);assert(/Beoordeling niet bevestigd/.test(main.contentDocument.getElementById('screen').innerText),'Abort falsely acknowledged');equal(await durable(),before,'Partial IDB commit');await remove(main);main=await frame();frames.push(main);assert(main.contentDocument.querySelector('.card'),'Reopen after abort failed');assert((await durable()).current[day]===before.current[day],'Failed rating survived');pass('PASS: fout ná opslagverzoek geeft geen bevestiging en geen gedeeltelijke opslag; heropenen werkt');
  // Keep cached historical code in a scope that cannot control daily.html.
  let old=document.createElement('iframe');old.src='/legacy/page';document.getElementById('frames').append(old);frames.push(old);await new Promise(r=>old.onload=r);let w=old.contentWindow;await w.navigator.serviceWorker.register('/legacy/worker.js');await w.navigator.serviceWorker.ready;await wait(()=>w.navigator.serviceWorker.controller);
  let response=await w.fetch('/legacy/cached-bank.js');assert(response.headers.get('X-Fixture-Cache')==='historical','No real cached response');
  w.localStorage.setItem('bmd-positive-bank-v1',raw['bmd-positive-bank-v1']);w.MUSIC_DNA_LEARNING={read:()=>({signals:{}})};let cs=w.document.createElement('script');cs.src='/legacy/cached-bank.js';w.document.head.append(cs);await new Promise((resolve,reject)=>{cs.onload=resolve;cs.onerror=reject;});let protectedState=await durable();w.MUSIC_DNA_POSITIVE_BANK.sync();assert(!JSON.parse(w.localStorage.getItem('bmd-positive-bank-v1')).items['fixture-fresh'],'Cached legacy bug not reproduced');equal(await durable(),protectedState,'Cached writer damaged store');pass('PASS: daadwerkelijk worker-gecachete oude bankcode kan beschermde opslag niet wijzigen');
  let report={pass:true,browser:navigator.userAgent,syntheticOnly:true,realBrowser:true,documents:'same-origin iframes (no top-level tab or iPhone claim)',productionWrites:0,iphoneWrites:0,spotifyWrites:0,checks};output.textContent=JSON.stringify(report,null,2);await fetch('/synthetic-report',{method:'POST',body:JSON.stringify(report,null,2)});
 }catch(e){let report={pass:false,error:String(e.stack||e),checks};output.textContent=JSON.stringify(report,null,2);await fetch('/synthetic-report',{method:'POST',body:JSON.stringify(report,null,2)});}
 finally{for(let f of frames)if(f.isConnected)await remove(f);}
};
</script></html>
