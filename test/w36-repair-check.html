r learning=MUSIC_DNA_LEARNING.read(),sig=learning.signals||{},ratings=0,pos=0,deliverable=0,missing=[];for(var id in sig){var s=sig[id];if(/^2026-W36-/.test(id))ratings++;if(s.rating==='raak'||s.rating==='goed'){pos++;var u=exactUrlForSignal(s);if(u)deliverable++;else missing.push({id:id,artist:s.artist,title:s.title,rating:s.rating})}}var selected=[];for(var d=1;d<=7;d++){var sel=read('bmd-week-2026-W36-day'+d+'-selection-v1',null),st=read('bmd-week-2026-W36-day'+d+'-v1',{});if(sel&&Array.isArray(sel.ids)&&sel.ids.length===3){for(var i=0;i<sel.ids.length;i++){var x=sel.ids[i];if(st[x]&&st[x].rating)selected.push(x)}}}var bank=MUSIC_DNA_POSITIVE_BANK.sync(),gift=MUSIC_DNA_POSITIVE_BANK.buildSaturdayPlaylist('2026-W36',selected),o=document.getElementById('out');var cls=(selected.length===21?'ok':'warn');var txt='<b class="'+cls+'">W36: '+selected.length+'/21 beoordelingen gevonden</b><p>Positieve signalen totaal: '+pos+' · direct bezorgbaar volgens huidige gegevens: '+deliverable+'.</p><p>De veilige cadeaubouw komt nu tot <b>'+gift.size+'/21</b> bezorgbare positieve nummers.</p>';if(gift.complete){txt+='<p class="ok"><b>De reserve is voldoende. W36 kan veilig opnieuw worden opgebouwd.</b></p><button class="btn" onclick="location.href=\'zaterdagcadeau-v2.html?week=2026-W36\'">Open mijn W36-cadeau</button>'}else{txt+='<p class="warn"><b>Nog '+(21-gift.size)+' bezorgbare positieve nummers nodig.</b></p><p>Dit is de informatie die voor herstel nodig is. Maak van dit scherm één screenshot; je hoeft niets technisch te doen.</p><pre>'+missing.map(function(x){return x.id+' · '+x.artist+' — '+x.title+' · '+x.rating}).join('\n')+'</pre>'}o.innerHTML=txt})();</script></body></html>
