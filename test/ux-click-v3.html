<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>Music DNA · UX v3</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 76%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(88px + env(safe-area-inset-bottom,0px))}.top{text-align:center;position:relative;margin-bottom:20px}.logo{width:58px;height:58px}.brand{font-size:12px;font-weight:850;letter-spacing:1.2px;color:var(--g);text-transform:uppercase}.gear{position:absolute;right:0;top:2px;border:0;background:none;color:#9eaaa4;font-size:21px}.eye{color:var(--g);font-size:11px;font-weight:850;letter-spacing:1px;text-transform:uppercase}.muted{color:var(--m)}h1{font-size:29px;line-height:1.08;margin:5px 0 8px}h2{font-size:21px;margin:4px 0 7px}h3{font-size:18px;margin:0 0 5px}.lead{font-size:16px;line-height:1.45}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin:11px 0}.card{cursor:pointer}.search{display:flex;align-items:center;gap:10px;background:#f5f8f6;color:#19211d;border-radius:999px;padding:14px 17px;margin:16px 0 20px;font-weight:650}.search span{color:#69746e;font-weight:500}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:15px;min-height:116px}.tile .ico{font-size:23px;margin-bottom:8px}.tile p{font-size:13px;color:var(--m);margin:5px 0;line-height:1.35}.pill{display:inline-block;font-size:11px;color:#d2f8dd;background:rgba(30,215,96,.10);border:1px solid rgba(30,215,96,.24);padding:5px 8px;border-radius:999px;margin-top:7px}.btn{width:100%;border:0;border-radius:999px;padding:14px;font-size:15px;font-weight:800;margin:8px 0;background:var(--g);color:#07100b}.secondary{background:rgba(30,215,96,.10);color:#d1f7dc;border:1px solid rgba(30,215,96,.25)}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 12px}.link{color:var(--g);font-weight:750}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:white;border-radius:16px;padding:14px 6px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:70px;background:#09100d;border-top:1px solid var(--l);display:flex;justify-content:space-around;padding-top:8px;padding-bottom:env(safe-area-inset-bottom,0)}.nav button{border:0;background:none;color:#84928b;font-size:11px;min-width:88px}.nav b{display:block;font-size:19px;margin-bottom:3px}.nav .on{color:var(--g)}.done{display:flex;gap:11px;align-items:center}.check{font-size:25px;color:var(--g)}.cover{height:170px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#625027,#25170e 47%,#090b0a 76%);display:grid;place-items:center;font-size:38px;font-weight:900;letter-spacing:2px;margin-bottom:14px}.review{padding:12px 0;border-bottom:1px solid var(--l)}.review:last-child{border:0}.searchbox{width:100%;padding:15px;border-radius:14px;border:1px solid #506158;background:#101914;color:white;font-size:16px}.result{padding:14px 0;border-bottom:1px solid var(--l)}</style></head><body><main class="app"><div class="top"><button class="gear" onclick="go('settings')">⚙︎</button><img class="logo" src="icon.svg" alt="Music DNA"><div class="brand">Music DNA · kennisbankproef</div></div><div id="screen"></div></main><nav class="nav"><button id="homeN" class="on" onclick="root('home',this)"><b>⌂</b>Music DNA</button><button onclick="root('mine',this)"><b>♫</b>Mijn Muziek</button><button onclick="root('news',this)"><b>▤</b>Nieuws</button></nav><script>const S=document.getElementById('screen');let stack=[],page='home',todayDone=true;function el(t,c,x){let e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function go(p){stack.push(page);render(p)}function back(){render(stack.pop()||'home')}function root(p,b){stack=[];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(p)}function head(txt){S.innerHTML='';if(txt){let b=el('button','back','‹ '+txt);b.onclick=back;S.appendChild(b)}}function render(p){page=p;({home,today,listen,search,ghost,reviews,mine,news,settings}[p]||home)();scrollTo(0,0)}function home(){head();S.appendChild(el('div','eye','Jouw muziekwereld'));S.appendChild(el('h1','','Waar ben je muzikaal nieuwsgierig naar?'));let q=el('div','search');q.innerHTML='⌕ <span>Zoek artiest, album, nummer, concert…</span>';q.onclick=()=>go('search');S.appendChild(q);let d=el('section','card');d.onclick=()=>go('today');let row=el('div','done');row.appendChild(el('div','check',todayDone?'✓':'●'));let tx=el('div');tx.appendChild(el('div','eye',todayDone?'Vandaag voltooid':'3 nieuwe ontdekkingen'));tx.appendChild(el('h3','',todayDone?'Je keuzes zijn gemaakt':'Je dagelijkse muziek ligt klaar'));tx.appendChild(el('div','muted',todayDone?'Morgen staat er weer iets nieuws voor je klaar.':'Luister en laat Music DNA leren.'));row.appendChild(tx);d.appendChild(row);S.appendChild(d);S.appendChild(el('h2','','In jouw muziekwereld'));let g=el('div','grid');[['📰','Ghost','Nieuw interview met Tobias Forge','Actueel'],['⭐','KISS · Alive!','Waarom 100,000 Years een anker is','Jouw verhaal'],['🎸','Iron Maiden','Nieuwe tourdata en recente setlists','Live'],['📝','Cirice','Recensies over track en Meliora','Recensies']].forEach((x,i)=>{let t=el('div','tile');t.onclick=()=>i===0?go('ghost'):i===3?go('reviews'):null;t.appendChild(el('div','ico',x[0]));t.appendChild(el('h3','',x[1]));t.appendChild(el('p','',x[2]));t.appendChild(el('span','pill',x[3]));g.appendChild(t)});S.appendChild(g);S.appendChild(el('h2','','Even verder kijken'));let c=el('section','card');c.appendChild(el('div','eye','Verband in jouw DNA'));c.appendChild(el('h3','','Van KISS naar Ghost'));c.appendChild(el('div','muted','Theatraliteit, hardrock en podiumpersona verbinden muziek uit verschillende generaties.'));S.appendChild(c)}function today(){head('Music DNA');S.appendChild(el('div','eye',todayDone?'Vandaag · voltooid':'Vandaag'));S.appendChild(el('h1','',todayDone?'Je bent klaar voor vandaag':'Jouw 3 ontdekkingen'));if(todayDone){S.appendChild(el('div','lead muted','Je dagelijkse keuzes hoeven niet de rest van de dag je startpagina te beheersen. Ze blijven hier wel terug te vinden.'));let b=el('button','btn secondary','Bekijk keuzes van vandaag');b.onclick=()=>{todayDone=false;today()};S.appendChild(b);return}['Cirice · Ghost','Evolve · The Warning','Highway Tune · Greta Van Fleet'].forEach((x,i)=>{let c=el('section','card');c.appendChild(el('div','eye',(i+1)+' VAN 3'));c.appendChild(el('h3','',x));if(i===0)c.onclick=()=>go('listen');S.appendChild(c)});let b=el('button','btn','Simuleer: keuzes afgerond');b.onclick=()=>{todayDone=true;render('home')};S.appendChild(b)}function listen(){head('Vandaag');S.appendChild(el('div','cover','GHOST'));S.appendChild(el('h1','','Cirice'));let a=el('div','link','Ghost');a.onclick=()=>go('ghost');S.appendChild(a);let p=el('section','panel');p.appendChild(el('div','eye','Jouw oordeel'));let r=el('div','ratings');['❤️ Raak','👍 Goed','😐 Twijfel','👎 Nee'].forEach(v=>r.appendChild(el('button','rate',v)));p.appendChild(r);S.appendChild(p);let c=el('section','card');c.onclick=()=>go('reviews');c.appendChild(el('h3','','📝 Recensies · 3 ›'));c.appendChild(el('div','muted','Wat schreven muziekschrijvers over Cirice?'));S.appendChild(c)}function search(){head('Music DNA');S.appendChild(el('div','eye','Kennisbank'));S.appendChild(el('h1','','Zoeken'));let i=el('input','searchbox');i.placeholder='Bijv. Ghost, Alive!, The Trooper…';S.appendChild(i);let p=el('section','panel');[['Ghost','Artiest · muziek, verhaal, nieuws, live, recensies'],['Cirice','Nummer · Ghost · 2015 · recensies beschikbaar'],['KISS · Alive!','Album · 1975 · anker in jouw muziekgeschiedenis']].forEach(x=>{let r=el('div','result');r.appendChild(el('h3','',x[0]));r.appendChild(el('div','muted',x[1]));r.onclick=()=>x[0]==='Ghost'?go('ghost'):x[0]==='Cirice'?go('reviews'):null;p.appendChild(r)});S.appendChild(p)}function ghost(){head('Terug');S.appendChild(el('div','eye','Artiest'));S.appendChild(el('h1','','Ghost'));S.appendChild(el('div','muted','Alles rond Ghost komt hier samen, ongeacht via welke route je binnenkwam.'));[['Muziek','Albums en nummers'],['Verhaal','Biografie, leden en ontwikkeling'],['Actueel','Nieuws, interviews en aankondigingen'],['Live','Tourdata en setlists'],['Recensies','Track- en albumkritiek']].forEach((x,i)=>{let c=el('section','card');c.appendChild(el('h3','',x[0]+' ›'));c.appendChild(el('div','muted',x[1]));if(i===4)c.onclick=()=>go('reviews');S.appendChild(c)})}function reviews(){head('Terug');S.appendChild(el('div','eye','Cirice · Ghost'));S.appendChild(el('h1','','Recensies'));S.appendChild(el('div','muted','Een blijvend onderdeel van de kennisbank, gekoppeld aan nummer, album én artiest.'));let p=el('section','panel');[['Pitchfork','Positief · opbouw, dynamiek en riff'],['OOR','Positief · melodramatische hardrockwereld'],['Andere bronnen','Gemengd · verschillende waardering van theatrale elementen']].forEach(x=>{let r=el('div','review');r.appendChild(el('h3','',x[0]));r.appendChild(el('div','muted',x[1]));p.appendChild(r)});S.appendChild(p)}function mine(){head();S.appendChild(el('div','eye','Wat Music DNA voor jou opbouwt'));S.appendChild(el('h1','','Mijn Muziek'));[['🧬','Mijn profiel','Smaak, ankers en ontwikkeling als één doorlopend verhaal.'],['❤️','Mijn verzameling','Nummers, albums en artiesten die bij je blijven.']].forEach(x=>{let c=el('section','card');c.appendChild(el('div','eye',x[0]));c.appendChild(el('h2','',x[1]));c.appendChild(el('div','muted',x[2]));S.appendChild(c)})}function news(){head();S.appendChild(el('div','eye','Actueel in jouw muziekwereld'));S.appendChild(el('h1','','Nieuws'));[['Ghost','Nieuw interview · vandaag'],['Iron Maiden','Tourdata aangekondigd · gisteren'],['Rush','Archiefinterview opnieuw relevant · deze week']].forEach(x=>{let c=el('section','card');c.appendChild(el('h3','',x[0]));c.appendChild(el('div','muted',x[1]));c.appendChild(el('div','pill','Wordt bewaard bij artiest'));S.appendChild(c)});let p=el('section','panel');p.appendChild(el('h3','','Nieuws verdwijnt niet'));p.appendChild(el('div','muted','Relevante publicaties worden onderdeel van het artiesten- en muziekarchief, zodat je ze later logisch terugvindt.'));S.appendChild(p)}function settings(){head('Terug');S.appendChild(el('h1','','Instellingen'));S.appendChild(el('section','panel','Account, Spotify, bronnen en voorkeuren. Beheer blijft buiten de primaire muziekroute.'))}render('home');</script></body></html>
