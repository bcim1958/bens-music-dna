<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · geboorte van jouw DNA v1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#08110d 0,#020403 52%,#000 88%);perspective:1300px;overflow:hidden}.stars{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle at 12% 22%,#8a9c91 0 1px,transparent 1.5px),radial-gradient(circle at 72% 17%,#78867d 0 1px,transparent 1.5px),radial-gradient(circle at 34% 73%,#718178 0 1px,transparent 1.5px),radial-gradient(circle at 86% 69%,#78867d 0 1px,transparent 1.5px);background-size:190px 170px,240px 210px,210px 230px,260px 180px}.cover{position:absolute;width:var(--s);aspect-ratio:1;object-fit:cover;border-radius:4px;box-shadow:0 15px 42px #000;opacity:0;filter:brightness(.68) saturate(.78);transition:3.6s cubic-bezier(.2,.72,.2,1)}.cover.arrive{opacity:var(--o);transform:translate3d(var(--x),var(--y),var(--z)) rotate(var(--r))}.thread{position:absolute;inset:0;opacity:0;transition:2.4s}.thread.show{opacity:1}.strand{position:absolute;left:50%;top:50%;width:72vw;height:2px;transform-origin:left center;background:linear-gradient(90deg,transparent,rgba(61,186,109,.1),rgba(82,217,137,.5),rgba(119,225,158,.12),transparent);filter:blur(.2px);box-shadow:0 0 22px rgba(75,211,128,.16)}.strand:nth-child(1){transform:translate(-50%,-50%) rotate(-18deg)}.strand:nth-child(2){transform:translate(-50%,-50%) rotate(17deg)}.strand:nth-child(3){transform:translate(-50%,-50%) rotate(0deg);opacity:.55}.core{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;background:#a4f1c2;box-shadow:0 0 40px #5ee09a,0 0 110px rgba(60,207,127,.32);transition:2.4s}.core.show{opacity:.85;transform:translate(-50%,-50%) scale(1)}.dna{position:absolu  680" stroke="url(#b)"/><g class="rungs" stroke="#b7e9ca"><line x1="148" y1="55" x2="252" y2="55"/><line x1="103" y1="115" x2="297" y2="115"/><line x1="110" y1="178" x2="290" y2="178"/><line x1="154" y1="242" x2="246" y2="242"/><line x1="112" y1="305" x2="288" y2="305"/><line x1="105" y1="370" x2="295" y2="370"/><line x1="148" y1="438" x2="252" y2="438"/><line x1="105" y1="505" x2="295" y2="505"/><line x1="112" y1="570" x2="288" y2="570"/><line x1="150" y1="638" x2="250" y2="638"/></g></svg><div id="particles"></div></div><button class="restart" onclick="location.reload()">↻ opnieuw</button><script>const imgs=['https://classicalbumsundays.com/wp-content/uploads/2018/12/71eu02SZK1L._SL1058_.jpg','https://www.ironmaiden.com/files/2024/08/09_FearOfTheDark.jpg','https://upload.wikimedia.org/wikipedia/en/3/3d/Meliora.JPG','https://npr.brightspotcdn.com/legacy/sites/radiowest/files/201405/5-6_Kiss_Destroyer1.jpg','https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/f4/69/61/f469613d-a7ef-e89f-007a-a7590458462b/603497826254.jpg/1200x630bb.jpg','https://uk.rarevinyl.com/cdn/shop/files/pink-floyd-wish-you-were-here-1st-plus-postcard-uk-vinyl-lp-album-record-shvl814-230146_1000x1006.jpg?v=1714490549'];const spots=[[-38,-29,-120,-8,.7],[-13,-31,20,4,.92],[14,-30,-20,-3,.86],[38,-25,-150,7,.62],[-40,14,-90,6,.55],[-18,28,10,-4,.82],[17,29,-10,5,.88],[40,12,-130,-7,.58],[-32,-4,-180,4,.48],[32,-2,-170,-5,.5],[-5,3,90,2,.9],[7,-10,60,-3,.82]];const wrap=document.getElementById('covers');spots.forEach((s,i)=>{let im=document.createElement('img');im.className='cover';im.src=imgs[i%imgs.length];im.style.cssText=`left:50%;top:50%;--s:${i===10?'10vw':'7.4vw'};--o:${s[4]};--x:${s[0]}vw;--y:${s[1]}vh;--z:${s[2]}px;--r:${s[3]}deg;transform:translate3d(0,0,-500px) scale(.15)`;wrap.appendChild(im);setTimeout(()=>im.classList.add('arrive'),350+i*180)});const thread=document.getElementById('thread'),core=document.getElementById('core'),dna=document.getElementById('dna'),pulse=document.getEl
