<!doctype html>
<html lang="nl" data-preview="standalone"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music DNA · iPhone visuele preview</title>
<style>
:root{--ink:#f7f3e8;--muted:#aaa9b8;--gold:#d8b96b;--violet:#9b7cff;--green:#55df98;--line:rgba(216,185,107,.18)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#050611;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh}
.app{max-width:430px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 112px;background:radial-gradient(circle at 72% 3%,rgba(94,63,173,.34),transparent 31%),radial-gradient(circle at 12% 38%,rgba(24,74,93,.2),transparent 32%),linear-gradient(180deg,#09091b,#05060d)}
.badge{font-size:9px;letter-spacing:.12em;color:var(--gold);opacity:.72;text-transform:uppercase}.hero{padding:22px 2px 12px}.hero:before{content:"BEN'S MUSIC DNA";display:block;color:var(--gold);font-size:11px;font-weight:850;letter-spacing:1.7px;margin-bottom:18px}.hero h1{font-size:38px;line-height:.96;margin:8px 0 12px;letter-spacing:-1.4px}.muted,.meta{color:var(--muted);font-size:13px;line-height:1.4}
.card,.panel,.gem{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(28,25,54,.88),rgba(12,13,28,.9));border:1px solid var(--line);border-radius:24px;padding:19px;margin:12px 0;box-shadow:0 18px 42px rgba(0,0,0,.18)}
.card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-45px;top:-55px;background:rgba(155,124,255,.1)}h2{font-size:23px;line-height:1.04;margin:7px 0}.artist{font-size:15px;color:var(--gold);font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.pill{min-height:46px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:10px;font-size:12px;font-weight:750;background:rgba(255,255,255,.04)}.spotify{width:100%;min-height:50px;border:0;border-radius:999px;margin-top:15px;font-weight:800;background:#1ed760;color:#07120b}.journey{border-left:2px solid #4a4564;padding-left:14px;margin:12px 0}.locked{opacity:.58}.previewNote{font-size:11px;color:var(--muted);margin-top:8px}.nav{position:fixed;z-index:20;left:50%;bottom:max(12px,env(safe-area-inset-bottom,12px));transform:translateX(-50%);width:min(394px,calc(100% - 24px));display:flex;justify-content:space-around;background:rgba(8,9,22,.94);backdrop-filter:blur(18px);border:1px solid rgba(216,185,107,.16);border-radius:19px;padding:8px;box-shadow:0 14px 35px rgba(0,0,0,.3)}.nav button{background:none;border:0;color:#c9c7d1;font-size:11px;min-height:44px;min-width:82px;font-weight:750}.nav button:first-child{color:var(--gold)}.panel h2:first-child,.gem h2{letter-spacing:-.3px}.gem{min-height:94px}.gem .artist{font-size:11px;letter-spacing:1px}.previewNote{max-width:350px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style></head><body><main class="app"><div class="badge">VISUELE PREVIEW · VOLLEDIG LOS VAN PRODUCTIEDATA</div><div id="root"></div></main>
<nav class="nav"><button data-go="discover">Ontdek</button><button data-go="world">Wereld</button><button data-go="museum">Museum</button></nav>
<script>
(function(){
var fixtures={tracks:[
 {artist:"Eclipse",title:"Viva La Victoria",week:"W38"},
 {artist:"Collateral",title:"Mr Big Shot",week:"W38"},
 {artist:"Crashdïet",title:"Riot In Everyone",week:"W38"}
],journeys:[
 {week:"W36",title:"Flow-DNA Reference 001"},
 {week:"W37",title:"Ontdek-DNA #2026-37"},
 {week:"W38",title:"Flow-DNA Reference 002"}
]};
var root=document.getElementById("root");
function esc(s){return String(s).replace(/[&<>"]/g,function(x){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[x]})}
function discover(){root.innerHTML='<section class="hero"><div class="muted">Ontdek-DNA · '+fixtures.tracks[0].week+' · schermproef'</div><h1>Jouw ontdekkingen</h1><div class="previewNote">Veilige schermproef met historische tracks · geen actuele Music-DNA-data.</div></section>'+fixtures.tracks.map(function(t,i){return '<article class="card" data-detail="'+i+'"><div class="artist">'+esc(t.artist)+'</div><h2>'+esc(t.title)+'</h2><div class="meta">Muziekmeter · historische schermproef</div></article>'}).join("")}
function detail(i){var t=fixtures.tracks[i||0];root.innerHTML='<section class="hero"><div class="muted">Historische preview · '+t.week+'</div><h1>'+esc(t.title)+'</h1><div class="artist">'+esc(t.artist)+'</div></section><section class="panel"><h2>Luister & voel</h2><p class="meta">Deze schermproef toont alleen vaste voorbeeldgegevens. Er wordt niets beoordeeld of opgeslagen.</p><h2>Beoordelen</h2><div class="row"><span class="pill">RAAK</span><span class="pill">GOED</span><span class="pill">TERUGKOMEN</span></div></section>'}
function world(){root.innerHTML='<section class="hero"><div class="muted">Mijn Muziekwereld</div><h1>Jouw cockpit</h1></section><section class="panel"><h2>Music DNA</h2><p class="meta">In de echte app verschijnen hier uitsluitend actuele Music-DNA-waarden.</p></section><section class="panel"><h2>Ontdekken</h2><p class="meta">Week-, jaar- en totaalmeters zijn in deze visuele preview bewust leeg.</p></section>'}
function museum(){root.innerHTML='<section class="hero"><div class="muted">Edelsteenmuseum</div><h1>Bewaar je reizen</h1></section>'+fixtures.journeys.map(function(j){return '<section class="gem"><div class="artist">'+j.week+'</div><h2>'+esc(j.title)+'</h2><div class="meta">Historische 21-track reis</div></section>'}).join("")+'<section class="gem locked"><div class="artist">W39</div><h2>Nog verzegeld</h2><div class="meta">Wordt pas zichtbaar na een echte vrijgave.</div></section>'}
function render(name){if(name==="detail")detail(0);else if(name==="world")world();else if(name==="museum")museum();else discover()}
document.addEventListener("click",function(e){var d=e.target.closest("[data-detail]"),g=e.target.closest("[data-go]");if(d)detail(Number(d.getAttribute("data-detail")));if(g)render(g.getAttribute("data-go"))});
var screen=new URLSearchParams(location.search).get("screen")||"discover";render(screen);
window.MUSIC_DNA_VISUAL_PREVIEW_GATE=function(){var checks=[];function push(n,o){checks.push({name:n,ok:!!o})}var expected={discover:["Ontdek-DNA","Eclipse"],detail:["Viva La Victoria","Beoordelen"],world:["Mijn Muziekwereld","uitsluitend actuele Music-DNA-waarden"],museum:["Edelsteenmuseum","Nog verzegeld"]};push("standalone preview marker",document.documentElement.getAttribute("data-preview")==="standalone");push("root rendered",!!root&&root.children.length>0);push("bottom navigation present",document.querySelectorAll(".nav button").length===3);push("known preview route",Object.prototype.hasOwnProperty.call(expected,screen));var body=root?root.textContent:"";push("route-specific content rendered",!!expected[screen]&&expected[screen].every(function(x){return body.indexOf(x)>=0}));return{ok:checks.every(function(x){return x.ok}),checks:checks,productionDataAccess:false,screen:screen}}
})();
</script></body></html>
