<style>

.card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-45px;top:-55px;background:rgba(155,124,255,.1)}.card{cursor:pointer}.card:last-child{margin-bottom:8px}.card .cue{margin-top:12px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.08em}.trackFoot{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#d4d1dd;font-weight:750}.trackFoot .pulse{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(216,185,107,.12);color:var(--gold)}.trackFoot b{color:var(--gold);font-size:18px}.backBtn{appearance:none;border:0;background:transparent;color:var(--gold);min-height:44px;padding:0 2px;margin:0 0 6px;font:inherit;font-size:24px;font-weight:800;display:inline-flex;align-items:center;gap:7px}.backBtn span{font-size:12px;letter-spacing:.04em;color:#d8d4df}h2{font-size:23px;line-height:1.04;margin:7px 0}.artist{font-size:15px;color:var(--gold);font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.pill{min-height:46px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:10px;font-size:12px;font-weight:750;background:rgba(255,255,255,.04)}.spotify{width:100%;min-height:50px;border:0;border-radius:999px;margin-top:15px;font-weight:800;background:#1ed760;color:#07120b}.journey{border-left:2px solid #4a4564;padding-left:14px;margin:12px 0}.locked{opacity:.58}.previewNote{font-size:11px;color:var(--muted);margin-top:8px}.nav{position:relative;z-index:20;width:100%;display:flex;justify-content:space-around;background:rgba(8,9,22,.96);backdrop-filter:blur(18px);border:1px solid rgba(216,185,107,.16);border-radius:19px;padding:6px;margin-top:16px;box-shadow:0 14px 35px rgba(0,0,0,.3)}.nav button{background:none;border:0;color:#c9c7d1;font-size:17px;min-height:44px;min-width:82px;font-weight:750;display:grid;place-items:center;gap:2px}.nav button span{font-size:10px}.nav button:first-child{color:var(--gold)}.panel h2:first-child,.gem h2{letter-spacing:-.3px}.gem{min-height:104px}.museumCard{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:14px}.gem .artist{font-size:11px;letter-spacing:1px}.museumHero{padding-bottom:16px}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:17px}.collection span{padding:9px 7px;border:1px solid rgba(216,185,107,.12);border-radius:13px;background:rgba(255,255,255,.025);font-size:8px;color:var(--muted)}.collection b{display:block;color:var(--gold);font-size:13px;margin-bottom:2px}.archiveCue{margin-top:10px;font-size:8px;letter-spacing:.09em;color:var(--gold);font-weight:850}.archiveCue b{font-size:13px}.stone{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:28px;color:var(--gold);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.2),rgba(155,124,255,.16) 36%,rgba(216,185,107,.08) 70%);border:1px solid rgba(216,185,107,.22);box-shadow:inset 0 0 18px rgba(155,124,255,.1)}.gemcopy{min-width:0}.gemcopy h2{font-size:19px}.previewNote{max-width:350px}.listening{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;margin-bottom:20px}.ratingHead{display:flex;align-items:end;justify-content:space-between;gap:12px}.ratingHead span{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}.disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:25px;color:var(--gold);border:1px solid rgba(216,185,107,.25);background:radial-gradient(circle at 50% 50%,#111326 0 12%,#27203f 13% 18%,#0c0e1c 19% 28%,#282143 29% 31%,#0b0c18 32% 100%);box-shadow:0 0 24px rgba(155,124,255,.12)}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.dash div{padding:13px 8px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.03)}.dash b{display:block;font-size:24px;color:var(--ink)}.dash span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.timeline b{font-size:20px}.fuelHead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.fuelHead>b{font-size:30px;color:var(--gold)}.fuelHead>b span{font-size:13px;color:var(--muted)}.fuel{height:9px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin:16px 0 10px}.fuel i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--green))}.signal{font-size:9px;font-weight:850;letter-spacing:.08em}.signal.ok{color:var(--green)}.compact{padding-top:15px;padding-bottom:15px}.signalRow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--muted)}.signalRow:last-child{border-bottom:0}.signalRow b{color:var(--ink)}.meter{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px;margin:13px 0;font-size:10px;font-weight:800;color:var(--muted)}.meter:after{content:"";grid-column:2;height:6px;border-radius:9px;background:rgba(255,255,255,.06);grid-row:1}.meter i{grid-column:2;grid-row:1;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--violet));z-index:1}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style></head><body><main class="app"><div class="badge">SCHERMPROEF</div><div id="root"></div></main>

<script>
(function(){

 {week:"W38",title:"Flow-DNA Reference 002"}

var root=document.getElementById("root");
function esc(s){return String(s).replace(/[&<>"]/g,function(x){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[x]})}
function discover(){root.innerHTML='<section class="hero"><div class="muted">Ontdek-DNA · '+fixtures.tracks[0].week+' · schermproef</div><h1>Jouw ontdekkingen</h1><div class="previewNote">Drie historische tracks om de iPhone-beleving veilig te controleren.</div></section>'+fixtures.tracks.map(function(t,i){return '<article class="card" data-detail="'+i+'"><div class="artist">'+esc(t.artist)+'</div><h2>'+esc(t.title)+'</h2><div class="meta">Historische previewtrack</div></article>'}).join("")}
function detail(i){var t=fixtures.tracks[i||0];root.innerHTML='<button class="backBtn" data-go="discover" aria-label="Terug naar Ontdek">‹ <span>Ontdek</span></button><section class="hero"><div class="muted">Historische preview · '+t.week+'</div><h1>'+esc(t.title)+'</h1><div class="artist">'+esc(t.artist)+'</div></section><section class="panel"><div class="listening"><div class="disc">♪</div><div><div class="artist">LUISTERRUIMTE</div><h2>Luister & voel</h2><p class="meta">Eerst luisteren. Daarna pas de Muziekmeter.</p></div></div><div class="ratingHead"><h2>Muziekmeter</h2><span>1 keuze</span></div><div class="row"><span class="pill">RAAK</span><span class="pill">GOED</span><span class="pill">NOG EENS</span><span class="pill">NEE</span></div></section>'}
function world(){root.innerHTML='<section class="hero"><div class="muted">Mijn Muziekwereld</div><h1>Jouw cockpit</h1><div class="previewNote">Voorbeeldweergave van de cockpit; productie gebruikt uitsluitend actuele Music-DNA-waarden.</div></section><section class="panel"><div class="artist">MUZIEKMETER</div><h2>Deze week</h2><div class="dash"><div><b>21</b><span>ontdekkingen</span></div><div><b>7</b><span>dagen</span></div><div><b>100%</b><span>ritme</span></div></div></section><section class="panel"><div class="artist">SMAAKSIGNALEN</div><h2>Wat blijft hangen</h2><div class="meter"><span>RAAK</span><i style="width:72%"></i></div><div class="meter"><span>GOED</span><i style="width:56%"></i></div><div class="meter"><span>NOG EENS</span><i style="width:31%"></i></div></section><section class="panel"><div class="artist">TIJDLIJN</div><h2>Week · jaar · totaal</h2><div class="dash timeline"><div><b>21</b><span>deze week</span></div><div><b>247</b><span>dit jaar</span></div><div><b>4892</b><span>Music DNA</span></div></div></section><section class="panel"><div class="artist">RESERVE</div><div class="fuelHead"><div><h2>Brandstof voor zaterdag</h2><p class="meta">Voorraadmeter voor een veilige 21-track reis.</p></div><b>34<span>/42</span></b></div><div class="fuel"><i style="width:81%"></i></div><div class="signal ok">● VOORRAAD OP PEIL</div></section><section class="panel compact"><div class="artist">SIGNALEN</div><div class="signalRow"><span>Spotify</span><b>● gereed</b></div><div class="signalRow"><span>Flow-DNA</span><b>● actief</b></div><div class="signalRow"><span>Volgende mijlpaal</span><b>5.000</b></div></section>'}
function museum(){var stones=["◆","◇","◈"];root.innerHTML='<section class="hero museumHero"><div class="muted">Edelsteenmuseum</div><h1>Jouw muzikale reizen</h1><div class="previewNote">Vrijgegeven zaterdagreizen worden hier bewaard als onderdeel van jouw Music DNA.</div><div class="collection"><span><b>3</b> bewaard</span><span><b>63</b> tracks</span><span><b>W36–W38</b> archief</span></div></section>'+fixtures.journeys.map(function(j,i){return '<section class="gem museumCard"><div class="stone">'+stones[i]+'</div><div class="gemcopy"><div class="artist">'+j.week+' · VRIJGEGEVEN</div><h2>'+esc(j.title)+'</h2><div class="meta">21-track reis · historische collectie</div><div class="archiveCue">BEKIJK REIS <b>→</b></div></div></section>'}).join("")+'<section class="gem museumCard locked"><div class="stone">?</div><div class="gemcopy"><div class="artist">W39 · VERZEGELD</div><h2>Nog niet zichtbaar</h2><div class="meta">Deze plek opent uitsluitend na een echte vrijgave.</div></div></section>'}
function render(name){if(name==="detail")detail(0);else if(name==="world")world();else if(name==="museum")museum();else discover()}
document.addEventListener("click",function(e){var d=e.target.closest("[data-detail]"),g=e.target.closest("[data-go]");if(d){screen="detail";detail(Number(d.getAttribute("data-detail")));if(history&&history.replaceState)history.replaceState(null,"","?screen=detail")}if(g)setScreen(g.getAttribute("data-go"),true)});
var screen=new URLSearchParams(location.search).get("screen")||"discover";
function setScreen(name,push){
  screen=name;
  render(name);
  if(push&&history&&history.replaceState)history.replaceState(null,"","?screen="+encodeURIComponent(name));
}
setScreen(screen,false);
if(!root.children.length){setScreen("discover",false)}
window.MUSIC_DNA_VISUAL_PREVIEW_GATE=function(){var checks=[];function push(n,o){checks.push({name:n,ok:!!o})}var expected={discover:["Ontdek-DNA","Eclipse"],detail:["Viva La Victoria","Beoordelen"],world:["Mijn Muziekwereld","uitsluitend actuele Music-DNA-waarden"],museum:["Edelsteenmuseum","Nog verzegeld"]};push("standalone preview marker",document.documentElement.getAttribute("data-preview")==="standalone");push("root rendered",!!root&&root.children.length>0);push("bottom navigation present",document.querySelectorAll(".nav button").length===3);push("known preview route",Object.prototype.hasOwnProperty.call(expected,screen));var body=root?root.textContent:"";push("route-specific content rendered",!!expected[screen]&&expected[screen].every(function(x){return body.indexOf(x)>=0}));return{ok:checks.every(function(x){return x.ok}),checks:checks,productionDataAccess:false,screen:screen}}
})();
