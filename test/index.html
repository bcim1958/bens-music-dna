<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ben's Music DNA — Ontdek-DNA W35</title>
<style>
:root{--green:#1ed760;--text:#f5f8f6;--muted:#aebbb5;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 20px 48px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:50px;height:50px;border:1.5px solid var(--green);border-radius:50%;display:grid;place-items:center;font-size:24px}.muted{color:var(--muted)}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h2{font-size:25px;margin:6px 0 8px}h3{font-size:20px;margin:0 0 7px}.intro{font-size:17px;line-height:1.45;color:#d4ddd8}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.status{font-size:12px;color:var(--green);font-weight:800}.meta{font-size:15px;color:#bbc7c1;margin-top:8px;line-height:1.45}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:13px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px;color:#d1f7dc}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--green);color:#07100b;cursor:pointer}.back,.quiet-link{background:none;border:0;color:var(--green);font-size:17px;cursor:pointer}.back{padding:4px 0 14px}.quiet-link{display:inline-block;padding:12px 8px 5px;margin-top:8px}.why{font-size:17px;line-height:1.52;color:#dce5e0}.story{font-size:18px;line-height:1.58}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700;cursor:pointer}.small{font-size:13px;color:#8f9d96}.progress{margin:16px 0}.trackbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}.trackbar div{height:100%;background:var(--green)}.complete{text-align:center;padding-top:24px}.complete .mark{margin:0 auto 18px;width:64px;height:64px;font-size:30px}.summary{text-align:left;margin-top:22px}.summary-row{padding:13px 0;border-bottom:1px solid var(--line)}.summary-row:last-child{border-bottom:0}.spotify-note{font-size:13px;color:var(--muted);text-align:center;line-height:1.4;margin:-2px 8px 14px}.closing{font-size:14px;color:var(--muted);line-height:1.45;margin:8px 18px 0}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="mark">♫</div><div><div class="eyebrow">Ben's Music DNA</div><div class="muted">Ontdek-DNA · W35 · Dag 1</div></div></div>
  <div id="screen"></div>
</main>
<script src="music-dna-data-v1.3.js"></script>
<script>
(function () {
  var ids=["2026-W35-01","2026-W35-02","2026-W35-03"],screen=document.getElementById("screen"),storageKey="bmd-day1-v13";
  var labels={raak:"❤️ Raak",goed:"👍 Goed",twijfel:"😐 Twijfel",nee:"👎 Nee"};
  function readState(){try{var raw=localStorage.getItem(storageKey);return raw?JSON.parse(raw):{};}catch(e){return {};}}
  function writeState(value){try{localStorage.setItem(storageKey,JSON.stringify(value));}catch(e){}}
  function node(tag,className,text){var el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el;}
  function doneCount(state){var n=0;for(var i=0;i<ids.length;i++)if(state[ids[i]]&&state[ids[i]].rating)n++;return n;}
  function renderList(){
    screen.innerHTML="";screen.appendChild(node("div","eyebrow","Vandaag"));screen.appendChild(node("h1","","Jouw 3 ontdekkingen"));screen.appendChild(node("div","intro","Drie nieuwe nummers, gekozen vanuit jouw muzikale DNA."));
    var state=readState(),done=doneCount(state),progress=node("div","progress");progress.appendChild(node("div","small",done+" van 3 beoordeeld"));var bar=node("div","trackbar"),fill=node("div");fill.style.width=String((done/3)*100)+"%";bar.appendChild(fill);progress.appendChild(bar);screen.appendChild(progress);
    for(var j=0;j<ids.length;j++)(function(id,index){var t=MUSIC_DNA_DB.tracks[id],card=node("section","card"),rating=state[id]&&state[id].rating;card.appendChild(node("div","status",rating?"✓ BEOORDEELD":String(index+1)+" VAN 3 · NOG TE ONTDEKKEN"));card.appendChild(node("h3","",t.identity.title));card.appendChild(node("div","muted",t.identity.artist));card.appendChild(node("div","meta",t.identity.country+" · "+t.identity.releaseYear+" · "+t.identity.albumOrRelease));var tags=node("div","tags");for(var s=0;s<Math.min(2,t.taxonomy.allMusicStyles.length);s++)tags.appendChild(node("span","tag",t.taxonomy.allMusicStyles[s]));card.appendChild(tags);if(rating)card.appendChild(node("div","meta",labels[rating]));card.onclick=function(){renderTrack(id);};screen.appendChild(card);})(ids[j],j);
    if(done===ids.length){var finish=node("button","btn","Bekijk dagafsluiting →");finish.onclick=renderComplete;screen.appendChild(finish);}
  }
  function renderComplete(){
    var state=readState();screen.innerHTML="";var wrap=node("section","complete");wrap.appendChild(node("div","mark","✓"));wrap.appendChild(node("div","eyebrow","Dag 1 voltooid"));wrap.appendChild(node("h1","","3 nieuwe nummers ontdekt"));wrap.appendChild(node("div","intro","Mooi. Jouw beoordelingen zijn opgeslagen en vormen nieuwe informatie voor je Ontdek-DNA."));
    var summary=node("section","panel summary");for(var i=0;i<ids.length;i++){var t=MUSIC_DNA_DB.tracks[ids[i]],row=node("div","summary-row");row.appendChild(node("h3","",t.identity.title));row.appendChild(node("div","muted",t.identity.artist));row.appendChild(node("div","meta",labels[state[ids[i]].rating]));summary.appendChild(row);}wrap.appendChild(summary);
    var back=node("button","quiet-link","‹ Terug naar vandaag");back.onclick=renderList;wrap.appendChild(back);wrap.appendChild(node("div","closing","Dag 1 is afgerond. Je beoordelingen zijn meegenomen in je Ontdek-DNA."));screen.appendChild(wrap);
  }
  function renderTrack(id){
    var t=MUSIC_DNA_DB.tracks[id],state=readState();screen.innerHTML="";var back=node("button","back","‹ Vandaag");back.onclick=renderList;screen.appendChild(back);screen.appendChild(node("div","eyebrow",t.identity.country+" · "+t.identity.releaseYear));screen.appendChild(node("h1","",t.identity.title));screen.appendChild(node("h3","muted",t.identity.artist));
    var spotify=node("button","btn","▶ Open in Spotify");spotify.onclick=function(){window.open("https://open.spotify.com/search/"+encodeURIComponent(t.identity.artist+" "+t.identity.title),"_blank","noopener");};screen.appendChild(spotify);screen.appendChild(node("div","spotify-note","Spotify opent apart. Deze Ontdek-DNA-pagina blijft open zodat je daarna hier je oordeel kunt geven."));
    var why=node("section","panel");why.appendChild(node("div","eyebrow","Waarom voor jou?"));why.appendChild(node("div","why",t.editorial.whyForYou));screen.appendChild(why);screen.appendChild(node("div","eyebrow","Over dit nummer"));screen.appendChild(node("h2","",t.editorial.storyTitle));screen.appendChild(node("p","story",t.editorial.storySummary));
    var hooks=t.editorial.surpriseHooks||[];for(var h=0;h<hooks.length;h++){var panel=node("section","panel");panel.appendChild(node("div","eyebrow",hooks[h].label));panel.appendChild(node("h3","",hooks[h].title));panel.appendChild(node("div","why",hooks[h].text));screen.appendChild(panel);}var dna=node("section","panel");dna.appendChild(node("div","eyebrow","Muzikaal DNA"));dna.appendChild(node("div","why",t.discoverDNA.dnaRoute.join(" → ")));screen.appendChild(dna);
    var ratingPanel=node("section","panel");ratingPanel.appendChild(node("div","eyebrow","Jouw oordeel"));ratingPanel.appendChild(node("h3","","Wat vond je ervan?"));var grid=node("div","ratings"),values=["raak","goed","twijfel","nee"];for(var r=0;r<values.length;r++)(function(value){var button=node("button","rate",labels[value]);button.onclick=function(){var s=readState();s[id]={rating:value,ratedAt:new Date().toISOString()};writeState(s);if(doneCount(s)===ids.length)renderComplete();else renderList();};grid.appendChild(button);})(values[r]);ratingPanel.appendChild(grid);if(state[id]&&state[id].rating)ratingPanel.appendChild(node("div","meta","Huidige beoordeling: "+labels[state[id].rating]));screen.appendChild(ratingPanel);
  }
  if(typeof MUSIC_DNA_DB==="undefined"){screen.appendChild(node("section","panel","De W35-data kon niet worden geladen."));return;}renderList();
})();
</script>
</body>
</html>
