<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ben's Music DNA — Ontdek-DNA W35</title>
<style>
:root{--green:#1ed760;--text:#f5f8f6;--muted:#aebbb5;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 20px 48px}.top{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;text-align:center}.mark{width:50px;height:50px;border:1.5px solid var(--green);border-radius:50%;display:grid;place-items:center;font-size:24px}.muted{color:var(--muted)}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h2{font-size:25px;margin:6px 0 8px}h3{font-size:20px;margin:0 0 7px}.intro{font-size:17px;line-height:1.45;color:#d4ddd8}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.status{font-size:12px;color:var(--green);font-weight:800}.meta{font-size:15px;color:#bbc7c1;margin-top:8px;line-height:1.45}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:13px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px;color:#d1f7dc}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--green);color:#07100b;cursor:pointer}.back,.quiet-link{background:none;border:0;color:var(--green);font-size:17px;cursor:pointer}.back{padding:4px 0 14px}.quiet-link{display:inline-block;padding:12px 8px 5px;margin-top:8px}.why{font-size:17px;line-height:1.52;color:#dce5e0}.story{font-size:18px;line-height:1.58}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700;cursor:pointer}.small{font-size:13px;color:#8f9d96}.progress{margin:16px 0}.trackbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}.trackbar div{height:100%;background:var(--green)}.complete{text-align:center;padding-top:24px}.complete .mark{margin:0 auto 18px;width:64px;height:64px;font-size:30px}.summary{text-align:left;margin-top:22px}.summary-row{padding:13px 0;border-bottom:1px solid var(--line)}.summary-row:last-child{border-bottom:0}.spotify-note{font-size:13px;color:var(--muted);text-align:center;line-height:1.4;margin:-2px 8px 14px}.closing{font-size:14px;color:var(--muted);line-height:1.45;margin:8px 18px 0}.source-link{display:block;color:#bfeecf;text-decoration:none;padding:7px 0;font-size:14px;line-height:1.35}.day-nav{margin-bottom:10px}.learn-note{border-color:rgba(30,215,96,.28)}.learn-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}.learn-row:last-child{border-bottom:0}.score{color:var(--green);font-weight:800}
</style>
</head>
<body><main class="app"><div class="top"><div class="mark">♫</div><div><div class="eyebrow">Ben's Music DNA</div><div id="subhead" class="muted">Ontdek-DNA · W35</div></div></div><div id="screen"></div></main>
<script src="music-dna-data-v1.3.js"></script>
<script src="music-dna-candidates-w35-v1.js"></script>
<script src="music-dna-learning-v1.js"></script>
<script src="music-dna-selector-v1.js"></script>
<script>
(function(){
var FIXED={1:['2026-W35-01','2026-W35-02','2026-W35-03'],2:['2026-W35-04','2026-W35-05','2026-W35-06']};
var params=new URLSearchParams(location.search),day=parseInt(params.get('day')||'1',10);if(day<1||day>3)day=1;
var screen=document.getElementById('screen'),subhead=document.getElementById('subhead'),labels={raak:'❤️ Raak',goed:'👍 Goed',twijfel:'😐 Twijfel',nee:'👎 Nee'};
subhead.textContent='Ontdek-DNA · W35 · Dag '+day;
function readJSON(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function getTrack(id){return (MUSIC_DNA_DB.tracks&&MUSIC_DNA_DB.tracks[id])||(MUSIC_DNA_W35_CANDIDATES.tracks&&MUSIC_DNA_W35_CANDIDATES.tracks[id])||null}
function getSource(id){return (MUSIC_DNA_DB.sources&&MUSIC_DNA_DB.sources[id])||(MUSIC_DNA_W35_CANDIDATES.sources&&MUSIC_DNA_W35_CANDIDATES.sources[id])||null}
function makeDay3(){var saved=readJSON('bmd-day3-selection-v1',null);if(saved&&saved.ids&&saved.ids.length===3)return saved;var chosen=MUSIC_DNA_SELECTOR.chooseBatch(MUSIC_DNA_W35_CANDIDATES.tracks,{size:3});var result={ids:chosen.map(function(x){return x.id}),scores:{},createdAt:new Date().toISOString(),signalCount:MUSIC_DNA_SELECTOR.buildProfile().count};for(var i=0;i<chosen.length;i++)result.scores[chosen[i].id]=chosen[i].score;writeJSON('bmd-day3-selection-v1',result);return result}
var selection=day===3?makeDay3():null,ids=day===3?selection.ids:FIXED[day],storageKey='bmd-day'+day+'-v13';
function state(){return readJSON(storageKey,{})}function save(v){writeJSON(storageKey,v)}
function node(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function doneCount(s){var n=0;for(var i=0;i<ids.length;i++)if(s[ids[i]]&&s[ids[i]].rating)n++;return n}
function country(c){var m={'United States':'Verenigde Staten','United Kingdom':'Verenigd Koninkrijk','Sweden':'Zweden','Norway':'Noorwegen'};return m[c]||c||'Onbekend'}
function goDay(n){location.href=location.pathname+'?day='+n}
function addSources(t){var a=t.sourceIds||[];if(!a.length)return;var p=node('section','panel');p.appendChild(node('div','eyebrow','Bronnen'));for(var i=0;i<a.length;i++){var s=getSource(a[i]);if(!s)continue;var l=node('a','source-link',s.publisher+' — '+s.title+' ↗');l.href=s.url;l.target='_blank';l.rel='noopener';p.appendChild(l)}screen.appendChild(p)}
function topStyles(){var p=MUSIC_DNA_SELECTOR.buildProfile(),arr=[];for(var k in p.styles)arr.push([k,p.styles[k]]);arr.sort(function(a,b){return b[1]-a[1]});return arr.slice(0,3)}
function addLearningPanel(){if(day!==3)return;var p=node('section','panel learn-note');p.appendChild(node('div','eyebrow','Geleerd uit jouw beoordelingen'));p.appendChild(node('h3','','Deze 3 kwamen nu bovenaan'));var sig=selection.signalCount||0;p.appendChild(node('div','why','De selector heeft de resterende W35-kandidaten gerangschikt op basis van '+sig+' eerdere beoordelingen.'));var styles=topStyles();if(styles.length){p.appendChild(node('div','meta','Sterkste signalen: '+styles.map(function(x){return x[0]}).join(' · ')))}for(var i=0;i<ids.length;i++){var t=getTrack(ids[i]),r=node('div','learn-row');r.appendChild(node('span','',t.identity.artist+' — '+t.identity.title));r.appendChild(node('span','score','score '+selection.scores[ids[i]]));p.appendChild(r)}screen.appendChild(p)}
function renderList(){screen.innerHTML='';if(day>1){var prev=node('button','back day-nav','‹ Dag '+(day-1));prev.onclick=function(){goDay(day-1)};screen.appendChild(prev)}screen.appendChild(node('div','eyebrow','Vandaag'));screen.appendChild(node('h1','','Jouw 3 ontdekkingen'));screen.appendChild(node('div','intro',day===3?'Drie nummers, gekozen uit de resterende W35-proeftuin met jouw eerdere beoordelingen als extra signaal.':'Drie nieuwe nummers, gekozen vanuit jouw muzikale DNA.'));addLearningPanel();var s=state(),done=doneCount(s),pr=node('div','progress');pr.appendChild(node('div','small',done+' van 3 beoordeeld'));var bar=node('div','trackbar'),fill=node('div');fill.style.width=(done/3*100)+'%';bar.appendChild(fill);pr.appendChild(bar);screen.appendChild(pr);for(var j=0;j<ids.length;j++)(function(id,index){var t=getTrack(id),card=node('section','card'),rating=s[id]&&s[id].rating;card.appendChild(node('div','status',rating?'✓ BEOORDEELD':(index+1)+' VAN 3 · NOG TE ONTDEKKEN'));card.appendChild(node('h3','',t.identity.title));card.appendChild(node('div','muted',t.identity.artist));card.appendChild(node('div','meta',country(t.identity.country)+' · '+t.identity.releaseYear+' · '+t.identity.albumOrRelease));var tags=node('div','tags'),st=(t.taxonomy&&t.taxonomy.allMusicStyles)||[];for(var q=0;q<Math.min(2,st.length);q++)tags.appendChild(node('span','tag',st[q]));if(st.length)card.appendChild(tags);if(rating)card.appendChild(node('div','meta',labels[rating]));card.onclick=function(){renderTrack(id)};screen.appendChild(card)})(ids[j],j);if(done===3){var f=node('button','btn','Bekijk dagafsluiting →');f.onclick=renderComplete;screen.appendChild(f)}}
function renderComplete(){var s=state();screen.innerHTML='';var w=node('section','complete');w.appendChild(node('div','mark','✓'));w.appendChild(node('div','eyebrow','Dag '+day+' voltooid'));w.appendChild(node('h1','','3 nieuwe nummers ontdekt'));w.appendChild(node('div','intro','Mooi. Jouw beoordelingen zijn opgeslagen en vormen nieuwe informatie voor je Ontdek-DNA.'));var sum=node('section','panel summary');for(var i=0;i<ids.length;i++){var t=getTrack(ids[i]),r=node('div','summary-row');r.appendChild(node('h3','',t.identity.title));r.appendChild(node('div','muted',t.identity.artist));r.appendChild(node('div','meta',labels[s[ids[i]].rating]));sum.appendChild(r)}w.appendChild(sum);if(day<3){var next=node('button','btn','Ga naar Dag '+(day+1)+' →');next.onclick=function(){goDay(day+1)};w.appendChild(next)}var b=node('button','quiet-link','‹ Terug naar vandaag');b.onclick=renderList;w.appendChild(b);w.appendChild(node('div','closing','Dag '+day+' is afgerond. Je beoordelingen zijn meegenomen in je Ontdek-DNA.'));screen.appendChild(w)}
function renderTrack(id){var t=getTrack(id),s=state();screen.innerHTML='';var b=node('button','back','‹ Vandaag');b.onclick=renderList;screen.appendChild(b);screen.appendChild(node('div','eyebrow',country(t.identity.country)+' · '+t.identity.releaseYear));screen.appendChild(node('h1','',t.identity.title));screen.appendChild(node('h3','muted',t.identity.artist));var sp=node('button','btn','▶ Open in Spotify');sp.onclick=function(){window.open('https://open.spotify.com/search/'+encodeURIComponent(t.identity.artist+' '+t.identity.title),'_blank','noopener')};screen.appendChild(sp);screen.appendChild(node('div','spotify-note','Spotify opent apart. Deze Ontdek-DNA-pagina blijft open zodat je daarna hier je oordeel kunt geven.'));var why=node('section','panel');why.appendChild(node('div','eyebrow','Waarom voor jou?'));why.appendChild(node('div','why',(t.editorial&&t.editorial.whyForYou)||''));screen.appendChild(why);if(t.editorial&&t.editorial.storySummary){screen.appendChild(node('div','eyebrow','Over dit nummer'));screen.appendChild(node('h2','',t.editorial.storyTitle||'Over dit nummer'));screen.appendChild(node('p','story',t.editorial.storySummary))}var listens=(t.editorial&&t.editorial.listenHooks)||[];for(var l=0;l<listens.length;l++){var lp=node('section','panel');lp.appendChild(node('div','eyebrow','Luister hier eens naar'));lp.appendChild(node('h3','',listens[l].title));lp.appendChild(node('div','why',listens[l].text));screen.appendChild(lp)}var hooks=(t.editorial&&t.editorial.surpriseHooks)||[];for(var h=0;h<hooks.length;h++){var p=node('section','panel');p.appendChild(node('div','eyebrow',hooks[h].label||'Dat wist ik niet!'));p.appendChild(node('h3','',hooks[h].title||'De verbinding'));p.appendChild(node('div','why',hooks[h].text));screen.appendChild(p)}var dna=node('section','panel');dna.appendChild(node('div','eyebrow','Muzikaal DNA'));dna.appendChild(node('div','why',(t.discoverDNA.dnaRoute||[]).join(' → ')));screen.appendChild(dna);addSources(t);var rp=node('section','panel');rp.appendChild(node('div','eyebrow','Jouw oordeel'));rp.appendChild(node('h3','','Wat vond je ervan?'));var grid=node('div','ratings'),vals=['raak','goed','twijfel','nee'];for(var r=0;r<vals.length;r++)(function(v){var x=node('button','rate',labels[v]);x.onclick=function(){var z=state();z[id]={rating:v,ratedAt:new Date().toISOString()};save(z);if(doneCount(z)===3)renderComplete();else renderList()};grid.appendChild(x)})(vals[r]);rp.appendChild(grid);if(s[id]&&s[id].rating)rp.appendChild(node('div','meta','Huidige beoordeling: '+labels[s[id].rating]));screen.appendChild(rp)}
renderList();
})();
</script></body></html>
