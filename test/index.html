<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ben's Music DNA — Ontdek-DNA W35</title>
<style>
:root{--green:#1ed760;--text:#f5f8f6;--muted:#aebbb5;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 20px 48px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:50px;height:50px;border:1.5px solid var(--green);border-radius:50%;display:grid;place-items:center;font-size:24px}.muted{color:var(--muted)}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h2{font-size:25px;margin:6px 0 8px}h3{font-size:20px;margin:0 0 7px}.intro{font-size:17px;line-height:1.45;color:#d4ddd8}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px}.status{font-size:12px;color:var(--green);font-weight:800}.meta{font-size:15px;color:#bbc7c1;margin-top:8px;line-height:1.45}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:13px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px;color:#d1f7dc}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--green);color:#07100b;cursor:pointer}.back{background:none;border:0;color:var(--green);font-size:17px;padding:4px 0 14px;cursor:pointer}.why{font-size:17px;line-height:1.52;color:#dce5e0}.story{font-size:18px;line-height:1.58}.hidden{display:none}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700;cursor:pointer}.small{font-size:13px;color:#8f9d96}.progress{margin:16px 0}.trackbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}.trackbar div{height:100%;background:var(--green)}
</style>
</head>
<body>
<main class="app"><div id="today"></div><div id="detail" class="hidden"></div></main>
<script src="music-dna-data-v1.3.js"></script>
<script>
(function(){
var ids=["2026-W35-01","2026-W35-02","2026-W35-03"];
var labels={raak:"❤️ Raak",goed:"👍 Goed",twijfel:"😐 Twijfel",nee:"👎 Nee"};
var key="bmd-day1-v13";
var todayEl=document.getElementById("today");
var detailEl=document.getElementById("detail");
function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}
function state(){try{return JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){return {}}}
function save(x){localStorage.setItem(key,JSON.stringify(x))}
function top(){return '<div class="top"><div class="mark">♫</div><div><div class="eyebrow">Ben\'s Music DNA</div><div class="muted">Ontdek-DNA · W35 · Dag 1</div></div></div>'}
function renderToday(){
 var r=state(),done=0,html=top()+'<div class="eyebrow">Vandaag</div><h1>Jouw 3 ontdekkingen</h1><div class="intro">Drie nieuwe nummers, gekozen vanuit jouw muzikale DNA.</div>';
 for(var i=0;i<ids.length;i++){if(r[ids[i]]&&r[ids[i]].rating)done++}
 html+='<div class="progress"><div class="small">'+done+' van 3 beoordeeld</div><div class="trackbar"><div style="width:'+(done/3*100)+'%"></div></div></div>';
 for(var j=0;j<ids.length;j++){
  var id=ids[j],t=MUSIC_DNA_DB.tracks[id],rating=r[id]&&r[id].rating;
  html+='<section class="card" data-id="'+id+'"><div class="row"><div><div class="status">'+(rating?'✓ BEOORDEELD':(j+1)+' VAN 3 · NOG TE ONTDEKKEN')+'</div><h3>'+esc(t.identity.title)+'</h3><div class="muted">'+esc(t.identity.artist)+'</div></div><div>'+(rating?labels[rating]:'›')+'</div></div><div class="meta">'+esc(t.identity.country)+' · '+esc(t.identity.releaseYear)+' · '+esc(t.identity.albumOrRelease)+'</div><div class="tags">'+t.taxonomy.allMusicStyles.slice(0,2).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</div></section>';
 }
 if(done===3)html+='<section class="panel"><div class="eyebrow">✓ Vandaag klaar</div><h2>Drie ontdekkingen opgeslagen</h2></section>';
 todayEl.innerHTML=html;detailEl.className="hidden";todayEl.className="";
 var cards=todayEl.querySelectorAll(".card");for(var k=0;k<cards.length;k++){cards[k].onclick=function(){openTrack(this.getAttribute("data-id"))}}
}
function openTrack(id){
 var t=MUSIC_DNA_DB.tracks[id],r=state(),cur=r[id]&&r[id].rating;
 todayEl.className="hidden";detailEl.className="";
 var hooks=t.editorial.surpriseHooks||[];
 var html=top()+'<button class="back" id="back">‹ Vandaag</button><div class="eyebrow">'+esc(t.identity.country)+' · '+esc(t.identity.releaseYear)+'</div><h1>'+esc(t.identity.title)+'</h1><h3 class="muted">'+esc(t.identity.artist)+'</h3><button class="btn" id="spotify">▶ Zoek in Spotify</button><section class="panel"><div class="eyebrow">Waarom voor jou?</div><div class="why">'+esc(t.editorial.whyForYou)+'</div></section><div class="eyebrow">Over dit nummer</div><h2>'+esc(t.editorial.storyTitle)+'</h2><p class="story">'+esc(t.editorial.storySummary)+'</p>';
 for(var i=0;i<hooks.length;i++)html+='<section class="panel"><div class="eyebrow">'+esc(hooks[i].label)+'</div><h3>'+esc(hooks[i].title)+'</h3><div class="why">'+esc(hooks[i].text)+'</div></section>';
 html+='<section class="panel"><div class="eyebrow">Muzikaal DNA</div><div class="why">'+t.discoverDNA.dnaRoute.map(esc).join(' → ')+'</div></section><section class="panel"><div class="eyebrow">Jouw oordeel</div><h3>Wat vond je ervan?</h3><div class="ratings"><button class="rate" data-rate="raak">❤️ Raak</button><button class="rate" data-rate="goed">👍 Goed</button><button class="rate" data-rate="twijfel">😐 Twijfel</button><button class="rate" data-rate="nee">👎 Nee</button></div>'+(cur?'<div class="meta">Huidige beoordeling: '+labels[cur]+'</div>':'')+'</section>';
 detailEl.innerHTML=html;document.getElementById("back").onclick=renderToday;document.getElementById("spotify").onclick=function(){window.location.href='https://open.spotify.com/search/'+encodeURIComponent(t.identity.artist+' '+t.identity.title)};
 var buttons=detailEl.querySelectorAll(".rate");for(var b=0;b<buttons.length;b++){buttons[b].onclick=function(){var s=state();s[id]={rating:this.getAttribute("data-rate"),ratedAt:new Date().toISOString()};save(s);renderToday()}}
}
try{renderToday()}catch(e){todayEl.innerHTML='<section class="panel"><div class="eyebrow">Technische melding</div><h2>De W35-pagina kon niet starten.</h2><div class="intro">'+esc(e.name+': '+e.message)+'</div></section>'}
})();
</script>
</body>
</html>
