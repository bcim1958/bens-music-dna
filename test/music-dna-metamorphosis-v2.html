<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · metamorphosis v2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000}.stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,#07110d 0,#020504 48%,#000 84%)}canvas{position:absolute;inset:0;width:100%;height:100%}.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 0,transparent 42%,rgba(0,0,0,.28) 70%,rgba(0,0,0,.88) 100%)}.controls{position:fixed;right:18px;bottom:16px;z-index:10}.controls button{background:#07100c;color:#fff;border:1px solid #41584b;border-radius:999px;padding:9px 14px}</style></head><body><div class="stage"><canvas id="c"></canvas><div class="veil"></div></div><div class="controls"><button onclick="location.reload()">↻ opnieuw</button></div><script src="music-dna-candidates-w36-v1.js"></script><script>(async()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,D;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);const tracks=Object.values(MUSIC_DNA_W36_CANDIDATES.tracks),imgs=[];async function art(x){try{let r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(x.spotifyUrl)),j=await r.json(),im=new Image();im.crossOrigin='anonymous';im.src=j.thumbnail_url;await im.decode();return im}catch(e){return null}}for(const t of tracks){let im=await art(t);if(im)imgs.push(im)}if(!imgs.length)return;const N=620,P=[];function helix(i){let side=i%2,step=Math.floor(i/2),n=Math.ceil(N/2),u=step/(n-1),turn=u*Math.PI*6.2;return{x:.5+(side?1:-1)*(.165*Math.sin(turn)),y:.08+.84*u,z:.18+.82*(.5+.5*Math.cos(turn+(side?Math.PI:0)))}}for(let i=0;i<N;i++){let h=helix(i),ang=Math.random()*Math.PI*2,rad=Math.pow(Math.random(),.58)*.61;P.push({sx:.5+Math.cos(ang)*rad,sy:.5+Math.sin(ang)*rad*.72,sz:.03+Math.random()*.18,tx:h.x,ty:h.y,tz:h.z,img:imgs[i%imgs.length],rot:(Math.random()-.5)*.65,delay:Math.random()*.18,drift:(Math.random()-.5)*.025})}const start=performance.now(),DUR=42000;const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>x*x*(3-2*x);function draw(now){let t=clamp((now-start)/DUR),arrival=smooth(clamp(t/.34)),organize=smooth(clamp((t-.27)/.48)),light=smooth(clamp((t-.69)/.25));ctx.clearRect(0,0,W,H);let order=P.map((p,i)=>({p,i,z:p.sz+(p.tz-p.sz)*organize})).sort((a,b)=>a.z-b.z);for(const o of order){let p=o.p,local=smooth(clamp((arrival-p.delay)/(1-p.delay))),org=smooth(clamp((organize-p.delay*.28)/(1-p.delay*.28))),x=(p.sx+(p.tx-p.sx)*org+p.drift*Math.sin(t*7+o.i))*W,y=(p.sy+(p.ty-p.sy)*org)*H;let depth=.28+.72*(p.sz+(p.tz-p.sz)*org);let base=Math.min(W,H)*(.012+.021*depth);let scale=.18+1.2*local;let s=base*scale*(1-.12*org);let alpha=clamp((local-.03)*1.35)*(.18+.82*depth);ctx.save();ctx.globalAlpha=alpha*(1-.22*light);ctx.translate(x,y);ctx.rotate(p.rot*(1-org));let blur=(1-local)*9+(1-depth)*1.8;ctx.filter='blur('+blur+'px) brightness('+(0.35+.75*local)+')';if(light){ctx.shadowBlur=15*light;ctx.shadowColor=o.i%3===0?'#ff7a18':o.i%3===1?'#d936ff':'#36a8ff'}ctx.drawImage(p.img,-s/2,-s/2,s,s);ctx.restore()}if(light>.02){ctx.save();ctx.globalCompositeOperation='screen';ctx.lineCap='round';let g=ctx.createLinearGradient(W*.31,0,W*.69,0);g.addColorStop(0,'#ff8a00');g.addColorStop(.5,'#d72fff');g.addColorStop(1,'#2ea8ff');ctx.strokeStyle=g;ctx.globalAlpha=.05+.42*light;ctx.lineWidth=1+4*light;for(let side of [-1,1]){ctx.beginPath();for(let j=0;j<240;j++){let u=j/239,turn=u*Math.PI*6.2,x=W*(.5+side*.165*Math.sin(turn)),y=H*(.08+.84*u);j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ctx.restore()}if(t<1)requestAnimationFrame(draw)}requestAnimationFrame(draw)})();</script></body></html>
