<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06100c"><title>Music DNA · Proefcadeau v2.1</title><style>:root{--g:#20df68;--t:#f5f8f6;--m:#a9b5af}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030605;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100dvh;max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 10px);background:radial-gradient(circle at 50% 0,#123226,#07110d 38%,#030605 88%);display:flex;flex-direction:column}.head{text-align:center;flex:none}.logo{width:54px;height:54px;border-radius:13px}.brand,.eye{color:var(--g);font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.brand{font-size:13px;margin-top:5px}.sub{color:var(--m);font-size:13px}.screen{flex:1;min-height:0}.sealed{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center}.eye{font-size:13px}.gift{font-size:min(24vw,112px);line-height:1;filter:drop-shadow(0 0 24px rgba(32,223,104,.25))}h1{font-size:clamp(27px,8vw,38px);line-height:1.02;margin:0}.lead{color:var(--m);font-size:clamp(14px,4vw,17px);line-height:1.35;margin:0;max-width:430px}.btn{width:100%;border:0;border-radius:999px;background:var(--g);color:#031009;padding:15px 12px;font-size:17px;font-weight:900}.unwrap{width:100%}.wall{height:100%;display:flex;flex-direction:column;min-height:0}.walltop{text-align:center;flex:none}.walltop h1{font-size:23px;margin:2px 0}.status{color:var(--g);font-size:12px;font-weight:800;height:18px}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(7,1fr);gap:4px;margin:4px 0}.tile{position:relative;min-height:0;opacity:0;transform:scale(.55);transition:opacity .28s ease,transform .42s cubic-bezier(.2,.9,.3,1.35)}.tile.on{opacity:1;transform:scale(1)}.cover,.fallback{width:100%;height:100%;object-fit:cover;border-radius:7px;border:1px solid rgba(255,255,255,.12);display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:#111b17;color:#245f40;font-size:20px}.badge{position:absolute;z-index:3;top:-3px;left:-3px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 8px #000}.heart{background:#c9443d}.thumb{background:#238a48}.done{flex:none;max-height:0;opacity:0;overflow:hidden;transition:.4s ease}.done.on{max-height:64px;opacity:1;margin-top:4px}.done .btn{padding:12px;font-size:15px}.spark{animation:spark .7s ease}@keyframes spark{50%{filter:drop-shadow(0 0 12px var(--g))}}@media(max-height:700px){.logo{width:44px;height:44px}.brand{font-size:11px}.sub{font-size:11px}.gift{font-size:78px}.lead{font-size:13px}.btn{padding:12px}.walltop h1{font-size:19px}}</style></head><body><main class="app"><header class="head"><img class="logo" src="apple-touch-icon.png?v=3"><div class="brand">Ben's Music DNA</div><div class="sub">Ontdek DNA · Proefcadeau v2.1</div></header><div id="screen" class="screen"></div></main><script src="music-dna-proefcadeau-v1.js"></script><script>const S=document.getElementById('screen'),T=MUSIC_DNA_PROEFCADEAU_V1.tracks;function sealed(){S.innerHTML=`<section class="sealed"><div class="eye">Speciaal voor deze proef</div><div class="gift">🎁</div><h1>Er staat een <span style="color:var(--g)">cadeau</span><br>voor je klaar</h1><p class="lead">21 nummers. De inhoud blijft dicht<br>tot jij hem uitpakt.</p><div class="unwrap"><button class="btn" id="unwrap">🎁 &nbsp; Bekijk mijn cadeau</button></div></section>`;unwrap.onclick=unpack}async function art(uri,img,fb){try{const id=uri.split(':').pop(),r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent('https://open.spotify.com/track/'+id)),d=await r.json();if(d.thumbnail_url){img.src=d.thumbnail_url;img.onload=()=>fb.remove();return}}catch(e){}img.remove()}function unpack(){S.innerHTML=`<section class="wall"><div class="walltop"><div class="eye">Proefcadeau uitgepakt</div><h1>Jouw <span style="color:var(--g)">21</span> nummers</h1><div class="status" id="status">Daar komen ze…</div></div><div class="grid" id="grid"></div><div class="done" id="done"><button class="btn">♫ &nbsp; Cadeau klaar voor Spotify</button></div></section>`;const g=document.getElementById('grid');T.forEach((t,i)=>{const d=document.createElement('div');d.className='tile';const heart=i%3===1;d.innerHTML=`<span class="badge ${heart?'heart':'thumb'}">${heart?'♥':'👍'}</span><div class="fallback">⌁</div><img class="cover" alt="${esc(t.artist)} – ${esc(t.title)}">`;g.appendChild(d);art(t.spotifyUri,d.querySelector('img'),d.querySelector('.fallback'))});const a=[...g.children],st=document.getElementById('status');let i=0;function next(){if(i===21){st.textContent='🎉 Je cadeau is compleet';setTimeout(()=>document.getElementById('done').classList.add('on'),650);return}a[i].classList.add('on','spark');st.textContent=`${i+1} van 21`;i++;setTimeout(next,900)}setTimeout(next,550)}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}sealed()</script></body></html>
