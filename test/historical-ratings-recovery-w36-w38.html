<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · historische tellerherstel</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07110d;color:#f5f8f6;max-width:760px;margin:auto;padding:32px 20px}h1{color:#20df68}.card{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:18px;padding:16px;margin:12px 0}.ok{color:#20df68}.warn{color:#ffbf47}button{background:#20df68;border:0;border-radius:999px;padding:13px 18px;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}</style></head><body><h1>Historische tellerherstel · W36–W38</h1><p>Alleen lezen. Deze diagnose verandert geen beoordelingen.</p><div id="out"></div><button id="copy">Kopieer herstelrapport</button><p id="next" class="warn"></p><script>
const weeks=['2026-W36','2026-W37','2026-W38']; const labels={raak:'RAAK',goed:'GOED',twijfel:'TERUGKOMEN',nee:'NIET'};
function read(k,f=null){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function one(w){let ratings=[],seen=new Set();for(let d=1;d<=7;d++){for(const kind of ['','-reserve']){const sk='bmd-week-'+w+'-day'+d+(kind?'-reserve':'')+'-v1';const sel='bmd-week-'+w+'-day'+d+(kind?'-reserve-selection':'-selection')+'-v1';const st=read(sk,{}),q=read(sel,null),ids=q?(q.ids||(q.id?[q.id]:[])):Object.keys(st||{});for(const id of ids){if(seen.has(id))continue;const x=st&&st[id];if(x&&x.rating){seen.add(id);ratings.push({id,rating:labels[x.rating]||x.rating,day:d,reserve:!!kind})}}}}const gift=read('bmd-gift-'+w+'-v1',null),delivery=read('bmd-delivery-'+w+'-v1',null);const deliveredIds=gift&&Array.isArray(gift.ids)?gift.ids:[];ratings.forEach(x=>x.delivered=deliveredIds.includes(x.id));const count=k=>ratings.filter(x=>x.rating===k).length;return{week:w,ratings,counts:{total:ratings.length,raak:count('RAAK'),goed:count('GOED'),terugkomen:count('TERUGKOMEN'),niet:count('NIET'),official:ratings.filter(x=>!x.reserve).length,reserve:ratings.filter(x=>x.reserve).length,delivered:ratings.filter(x=>x.delivered).length},gift:{present:!!gift,ids:deliveredIds},delivery:delivery||null}}
const report={generatedAt:new Date().toISOString(),source:'browser-localStorage-readonly',weeks:weeks.map(one)};window.HISTORICAL_RECOVERY_REPORT=report;const O=document.getElementById('out');report.weeks.forEach(w=>{const d=document.createElement('div');d.className='card';const complete=w.counts.official===21;d.innerHTML='<h2>'+w+'</h2><div class="'+(complete?'ok':'warn')+'">'+(complete?'21/21 officiële beoordelingen gevonden':'Nog niet volledig: '+w.counts.official+'/21 officiële beoordelingen gevonden')+'</div><p>RAAK '+w.counts.raak+' · GOED '+w.counts.goed+' · TERUGKOMEN '+w.counts.terugkomen+' · NIET '+w.counts.niet+' · reservebeoordelingen '+w.counts.reserve+' · cadeau-ID’s '+w.counts.delivered+'</p>';O.appendChild(d)});document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(report,null,2));document.getElementById('copy').textContent='Herstelrapport gekopieerd ✓'};const complete=report.weeks.every(w=>w.counts.official===21);document.getElementById('next').textContent=complete?'Historie compleet gevonden. Kopieer het herstelrapport en plak het in de Music-DNA-chat; daarna kan de tellerlaag exact worden vastgelegd.':'Er ontbreken lokale beoordelingen. Kopieer het herstelrapport toch; daarmee kunnen alleen de ontbrekende posities gericht worden gereconstrueerd.';
</script></body></html>
