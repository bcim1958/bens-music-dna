<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06100c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Music DNA · Proefcadeau v2</title><style>:root{--g:#20df68;--t:#f5f8f6;--m:#a9b5af;--card:#101815;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123226 0,#07110d 32%,#030605 85%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 44px) 14px 44px}.head{text-align:center}.logo{width:72px;height:72px;border-radius:17px}.brand,.eyebrow{color:var(--g);font-weight:900;letter-spacing:1.3px;text-transform:uppercase}.brand{font-size:15px;margin-top:10px}.sub{color:var(--m);font-size:16px;margin-top:3px}.gift{width:220px;height:220px;margin:34px auto 20px;border-radius:34px;display:grid;place-items:center;font-size:126px;background:radial-gradient(circle,rgba(32,223,104,.24),rgba(32,223,104,.04) 54%,transparent 72%);filter:drop-shadow(0 0 28px rgba(32,223,104,.2))}h1{font-size:34px;line-height:1.05;margin:12px 0}.lead{color:var(--m);font-size:17px;line-height:1.5;margin:12px auto;max-width:450px}.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--g);color:#031009;padding:17px 15px;font-size:18px;font-weight:900;margin:26px 0 14px}.foot{text-align:center;color:#68766f;font-size:12px;margin-top:28px}.celebrate{position:relative;overflow:hidden}.confetti{height:26px;text-align:center;color:#d9ae42;letter-spacing:9px;font-size:18px;animation:glow 1s infinite alternate}@keyframes glow{to{filter:brightness(1.8)}}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.tile{position:relative;min-width:0;opacity:0;transform:scale(.72) translateY(10px);transition:opacity .28s ease,transform .38s cubic-bezier(.2,.9,.3,1.35)}.tile.on{opacity:1;transform:scale(1) translateY(0)}.cover{aspect-ratio:1/1;width:100%;border-radius:13px;object-fit:cover;display:block;background:linear-gradient(145deg,#17221d,#080d0b);border:1px solid var(--line)}.fallback{aspect-ratio:1/1;border-radius:13px;border:1px solid var(--line);display:grid;place-items:center;background:linear-gradient(145deg,#17221d,#080d0b);font-size:30px;color:#1b5e3a}.badge{position:absolute;top:-6px;left:-5px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:900;z-index:3;box-shadow:0 0 14px rgba(0,0,0,.6)}.heart{background:#c9443d}.thumb{background:#238a48}.title{font-weight:800;font-size:12px;line-height:1.15;margin:6px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#aeb9b3;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 2px}.year{color:var(--g);font-size:11px;margin:2px}.status{text-align:center;color:var(--g);font-weight:800;font-size:14px;margin:14px 0}.spotify{opacity:0;transform:translateY(8px);transition:.45s ease}.spotify.on{opacity:1;transform:none}.note{text-align:center;color:#849089;font-size:12px;line-height:1.4;margin-top:10px}.pulse{animation:pulse .5s ease}@keyframes pulse{50%{filter:drop-shadow(0 0 15px rgba(32,223,104,.75))}}@media(max-width:360px){.app{padding-left:10px;padding-right:10px}.grid{gap:6px}.title{font-size:11px}}</style></head><body><main class="app"><div class="head"><img class="logo" src="apple-touch-icon.png?v=3" alt="Music DNA"><div class="brand">Ben's Music DNA</div><div class="sub">Ontdek DNA · Proefcadeau v2</div></div><div id="screen"></div><div class="foot">Technische proef · geen learning · geen weekoogst</div></main><script src="music-dna-proefcadeau-v1.js"></script><script>const S=document.getElementById('screen'),T=MUSIC_DNA_PROEFCADEAU_V1.tracks;function sealed(){S.innerHTML=`<section class="head"><div class="eyebrow" style="margin-top:34px">Speciaal voor deze proef</div><div class="gift">🎁</div><h1>Er staat een <span style="color:var(--g)">cadeau</span> voor je klaar</h1><p class="lead">21 nummers uit je oorspronkelijke Music DNA-database.<br>De inhoud blijft dicht tot jij hem uitpakt.</p><button class="btn" id="unwrap">🎁 &nbsp; Bekijk mijn cadeau</button><div class="note">Jouw verrassing wacht op je</div></section>`;document.getElementById('unwrap').onclick=unwrap}async function art(uri,img,fallback){let id=uri.split(':').pop();try{let r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent('https://open.spotify.com/track/'+id));let d=await r.json();if(d.thumbnail_url){img.src=d.thumbnail_url;img.onload=()=>fallback.remove();return}}catch(e){}img.remove()}function unwrap(){S.innerHTML=`<section class="celebrate"><div class="confetti">◆ ✦ ◆ ✧ ◆ ✦</div><div class="head"><div class="eyebrow">Proefcadeau uitgepakt!</div><h1>Jouw <span style="color:var(--g)">21</span> nummers</h1><p class="lead">Daar komen ze… één voor één.</p></div><div class="status" id="status">Uitpakken…</div><div class="grid" id="grid"></div><div class="spotify" id="spotify"><button class="btn" id="sp">♫ &nbsp; Zet mijn cadeau in Spotify &nbsp; ›</button><div class="note">In deze proef is de knop nog de volgende technische stap.</div></div></section>`;let g=document.getElementById('grid');T.forEach((t,i)=>{let d=document.createElement('div');d.className='tile';let simulated=i%3===1;d.innerHTML=`<span class="badge ${simulated?'heart':'thumb'}">${simulated?'♥':'👍'}</span><div class="fallback">⌁</div><img class="cover" alt=""><div class="title">${esc(t.title)}</div><div class="artist">${esc(t.artist)}</div><div class="year">${t.year}</div>`;g.appendChild(d);art(t.spotifyUri,d.querySelector('img'),d.querySelector('.fallback'))});let tiles=[...g.children],i=0,st=document.getElementById('status');function next(){if(i>=tiles.length){st.textContent='🎉 Je cadeau is compleet';document.getElementById('spotify').classList.add('on');return}tiles[i].classList.add('on','pulse');st.textContent=`${i+1} van 21 uitgepakt`;i++;setTimeout(next,700)}setTimeout(next,450)}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}sealed();</script></body></html>
