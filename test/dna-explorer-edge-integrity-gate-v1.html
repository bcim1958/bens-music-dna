<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNA Explorer — Edge Integrity Gate</title><style>body{font:16px/1.5 system-ui;background:#080914;color:#f5f0e8;max-width:760px;margin:auto;padding:24px}.pass{color:#91df8c}.fail{color:#ff8d8d}code{color:#e6b65d}li{margin:8px 0}</style></head><body><h1>DNA Explorer · Edge Integrity Gate</h1><div id="out">Controleren…</div><script src="music-dna-explorer-graph-v3.js"></script><script>
const G=window.MUSIC_DNA_EXPLORER_GRAPH_V1,problems=[],listed=[];
for(const [from,n] of Object.entries(G.nodes)){for(const to of [...(n.primary||[]),...(n.doors||[])]){listed.push(from+">"+to);if(!G.nodes[to])problems.push("Ontbrekend doel: "+from+" > "+to);if(!G.relations[from+">"+to])problems.push("Geen expliciete relatie: "+from+" > "+to)}}
for(const edge of Object.keys(G.relations)){const [from,to]=edge.split(">");if(!G.nodes[from]||!G.nodes[to])problems.push("Relatie met onbekend knooppunt: "+edge)}
document.getElementById("out").innerHTML=problems.length?'<h2 class="fail">FAIL · '+problems.length+' probleem/problemen</h2><ul>'+problems.map(x=>'<li>'+x+'</li>').join("")+'</ul>':'<h2 class="pass">PASS</h2><p><b>'+Object.keys(G.nodes).length+'</b> knooppunten · <b>'+listed.length+'</b> zichtbare deurverwijzingen gecontroleerd.</p><p>Iedere zichtbare deur heeft een bestaand doel én een expliciete relatie. De productieregel blijft: inhoudelijke onderbouwing hoort bij de edge; deze gate controleert de structurele integriteit daarvan.</p>';
</script></body></html>
