<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=6"><title>Music DNA</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:76px 20px 48px}.top,.notice{text-align:center}.brand-logo{width:76px;height:76px;border-radius:17px}.brand-name,.eye{color:var(--g);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.brand-name{margin-top:14px}.muted{color:var(--m);font-size:18px}.day-status{width:104px;height:104px;border:2px solid var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:80px auto 28px;font-size:42px;font-weight:850}h1{font-size:31px;line-height:1.08}.intro{font-size:17px;line-height:1.48}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b}.giftbox{font-size:96px}.giftlist{text-align:left;font-size:14px;line-height:1.55;background:rgba(0,0,0,.24);border-radius:16px;padding:14px}.footer{text-align:center;color:#718078;font-size:12px;margin-top:28px}</style></head><body><main class="app"><div class="top"><img class="brand-logo" src="apple-touch-icon.png?v=6"><div class="brand-name">Ben's Music DNA</div><div class="muted" id="cycleLabel">Ontdek-DNA · 2026 · W36</div></div><div id="screen"></div><div class="footer">3 per dag · 21 per week · alleen +1/+2 naar zaterdag</div></main><script src="music-dna-data-v1.3.js?v=6"></script><script src="music-dna-candidates-w35-v1.js?v=6"></script><script src="music-dna-candidates-w36-v1.js?v=6"></script><script src="music-dna-delivery-registry-v1.js?v=6"></script><script src="music-dna-w35-reserve-v1.js?v=6"></script><script src="music-dna-learning-v1.js?v=7"></script><script src="music-dna-positive-bank-v1.js?v=2"></script><script>(function(){var screen=document.getElementById('screen'),WEEK='2026-W36',DISPLAY='2026 · W36';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function n(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function actualRatings(){var out={};for(var d=1;d<=7;d++){var st=read('bmd-week-'+WEEK+'-day'+d+'-v1',{});for(var id in st)if(st[id]&&st[id].rating&&/^2026-W36-/.test(id))out[id]=st[id]}return out}function showGift(){document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY+' · Cadeau';screen.innerHTML='';var ratings=actualRatings(),ids=Object.keys(ratings),w=n('section','notice');var positive=ids.filter(function(id){return ratings[id].rating==='raak'||ratings[id].rating==='goed'});w.appendChild(n('div','eye','Herstel bevestigd'));w.appendChild(n('div','giftbox','🎁'));w.appendChild(n('h1','',ids.length+'/21 W36-beoordelingen bewezen'));w.appendChild(n('div','intro',positive.length+' positieve W36-nummers zijn gevonden. De beoordelingen blijven ongewijzigd.'));var b=n('button','btn','Verder met mijn W36-cadeau');b.onclick=function(){var restored=MUSIC_DNA_LEARNING.restoreReserve?MUSIC_DNA_LEARNING.restoreReserve():-1;if(MUSIC_DNA_LEARNING.hydrateExistingDelivery)MUSIC_DNA_LEARNING.hydrateExistingDelivery();var gift=MUSIC_DNA_POSITIVE_BANK.buildSaturdayPlaylist(WEEK,ids),inv=MUSIC_DNA_POSITIVE_BANK.inventory();if(!gift.complete){screen.innerHTML='';var z=n('section','notice');z.appendChild(n('div','eye','Herstelbuild 6 actief'));z.appendChild(n('h1','','Cadeauvoorraad nog niet compleet'));z.appendChild(n('div','intro','Herstel toegevoegd: '+restored+' · bezorgbaar: '+gift.size+'/21 · positieve bank: '+inv.total+' · exact bezorgbaar: '+inv.deliverable+' · geblokkeerd: '+inv.blocked+'.'));screen.appendChild(z);return}write('bmd-gift-'+WEEK+'-v1',gift);renderGift(gift)};w.appendChild(b);screen.appendChild(w)}function renderGift(gift){screen.innerHTML='';var w=n('section','notice');w.appendChild(n('div','eye','Herstelbuild 6 actief'));w.appendChild(n('h1','','Jouw 21 nummers'));var list=n('div','giftlist');gift.tracks.forEach(function(x,i){list.appendChild(n('div','',String(i+1)+'. '+x.artist+' — '+x.title+' · '+(x.rating==='raak'?'❤️':'👍')))});w.appendChild(list);screen.appendChild(w)}function render(){var count=Object.keys(actualRatings()).length,w=n('section','notice');w.appendChild(n('div','day-status',count===21?'✓':String(count)));w.appendChild(n('div','eye','Herstelbuild 6 actief'));w.appendChild(n('h1','',count+' beoordelingen bevestigd'));w.appendChild(n('div','intro',DISPLAY+' is aantoonbaar compleet. De positieve oogst is klaar voor het zaterdagcadeau.'));var b=n('button','btn','🎁 Controleer mijn '+DISPLAY+'-cadeau');b.onclick=showGift;w.appendChild(b);screen.appendChild(w)}render()})();</script></body></html>
