<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Music DNA v4 data check</title><style>body{margin:0;background:#070a09;color:#f5f7f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;padding:28px 18px 80px}h1{font-size:34px;margin:0 0 10px}.sub{color:#aab5b1;line-height:1.5}.card{margin-top:18px;padding:16px;border:1px solid #2c3935;border-radius:16px;background:#111615}.ok{color:#54e49e}.bad{color:#f0d98c}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}.big{font-size:22px;font-weight:800}</style></head><body><main class="app"><h1>Verras me! v4 — datacheck</h1><p class="sub">Alleen lezen. Deze pagina verandert niets aan de Master of aan Music DNA.</p><div id="out"></div></main><script>const files=[1,2,3,4].map(n=>`../data/surprise-prod-full-0${n}.txt`);const out=document.getElementById('out');function hex(a){return [...a.slice(0,6)].map(x=>x.toString(16).padStart(2,'0')).join(' ')}async function ungzip(bytes){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}async function check(url,i){let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="big">Deel ${i}</div><div>Controleren…</div>`;out.appendChild(c);try{let r=await fetch(url,{cache:'no-store'});let t=await r.text();let clean=t.replace(/[^A-Za-z0-9+/=]/g,'');let invalid=t.length-clean.length;let decoded=null,atobErr='';try{decoded=Uint8Array.from(atob(clean),x=>x.charCodeAt(0))}catch(e){atobErr=e.message}let gz=false,jsonOk=false,detail='';if(decoded){try{let s=await ungzip(decoded);JSON.parse(s);gz=true;jsonOk=true}catch(e){detail=e.message}}c.innerHTML=`<div class="big">Deel ${i}: <span class="${r.ok&&jsonOk?'ok':'bad'}">${r.ok&&jsonOk?'OK':'PROBLEEM'}</span></div><p>HTTP ${r.status} · tekst ${t.length} tekens · vreemde tekens ${invalid}</p><p class="mono">begin: ${t.slice(0,20).replace(/</g,'&lt;')}</p><p class="mono">decoded: ${decoded?hex(decoded):'mislukt'} ${atobErr}</p><p>${jsonOk?'Gzip + JSON: OK':'Gzip/JSON: '+detail}</p>`}catch(e){c.innerHTML=`<div class="big">Deel ${i}: <span class="bad">PROBLEEM</span></div><p>${e.message}</p>`}}(async()=>{for(let i=0;i<files.length;i++)await check(files[i],i+1)})()</script></body></html>
