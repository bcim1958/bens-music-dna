<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · cinematic act 1 v9</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#07110d 0,#020504 43%,#000 82%);perspective:1200px}.origin{position:absolute;left:50%;top:48%;width:min(56vw,820px);height:min(20vw,290px);transform:translate(-50%,-50%) rotate(-7deg) scale(.55);border-radius:50%;opacity:0;background:radial-gradient(ellipse at center,transparent 0 24%,#000 25% 35%,rgba(250,252,253,.88) 36%,rgba(213,220,225,.28) 43%,rgba(255,255,255,.08) 53%,transparent 69%);animation:origin 7.2s ease-in-out forwards}.world{position:absolute;inset:0;opacity:0;animation:world 9s ease 4.5s forwards}.tile{position:absolute;width:var(--s);aspect-ratio:1;border-radius:4px;background-position:center;background-size:cover;box-shadow:0 12px 35px #000;opacity:var(--o);filter:brightness(var(--b)) saturate(.84) blur(var(--blur));transform:rotate(var(--r));animation:float var(--d) ease-in-out var(--delay) infinite alternate}.flow{position:absolute;left:7%;right:7%;top:35%;height:32%;opacity:0;animation:flow 7s ease 14s forwards;background:radial-gradient(ellipse at 50% 50%,rgba(45,178,98,.095),rgba(20,92,55,.025) 50%,transparent 74%)}.flow:before,.flow:after{content:"";position:absolute;left:4%;right:4%;top:45%;height:1px;background:linear-gradient(90deg,transparent,rgba(61,190,112,.025),rgba(83,218,137,.13),rgba(61,190,112,.03),transparent);box-shadow:0 -27px 52px rgba(40,155,88,.05),0 27px 52px rgba(40,155,88,.05);transform:rotate(-1.5deg)}.flow:after{top:59%;transform:rotate(1.5deg);opacity:.5}.hero{position:absolute;top:49%;width:min(14.6vw,205px);aspect-ratio:1;border-radius:5px;object-fit:cover;box-shadow:0 22px 75px rgba(0,0,0,. e(-50%,-50%) rotate(-6deg) scale(.94)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-5deg) scale(1.2)}}@keyframes world{0%{opacity:0;transform:scale(.2)}38%{opacity:.86}100%{opacity:1;transform:scale(1)}}@keyframes float{to{margin-top:-12px;filter:brightness(calc(var(--b) + .07)) saturate(.9) blur(var(--blur))}}@keyframes flow{0%{opacity:0;transform:scaleX(.5)}100%{opacity:1;transform:scaleX(1)}}@keyframes qIn{0%{opacity:0;transform:translate(-330px,-55%) scale(.2) rotate(-10deg)}30%{opacity:.94}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}}@keyframes imIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.16)}30%{opacity:.98}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes gIn{0%{opacity:0;transform:translate(330px,-55%) scale(.2) rotate(10deg)}30%{opacity:.94}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(2deg)}}@keyframes tap{0%{opacity:0;transform:translate(-50%,40px)}28%{opacity:.58}70%{opacity:.62;transform:translate(-50%,-58px)}78%{opacity:.72;transform:translate(-50%,-63px) scale(.97)}100%{opacity:0;transform:translate(-50%,-70px)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0)}35%{box-shadow:0 0 0 12px rgba(255,255,255,.16)}100%{box-shadow:0 0 0 24px rgba(255,255,255,0)}}@keyframes signal{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:.9}100%{opacity:0;transform:translate(36vw,-22vh) scale(.2)}}</style></head><body><div class="stage"><div class="origin"></div><div class="world" id="world"></div><div class="flow"></div><img class="hero q" alt="Queen A Night at the Opera"><img class="hero im" alt="Iron Maiden Fear of the Dark"><img class="hero g" alt="Ghost Meliora"><div class="calm"></div><div class="signal"></div><div class="choices"><div class="choice heart">♥</div><div class="choice">👍</div><div class="choice">😐</div><div class="choice">👎</div></div><div class="hand" aria-hidden="true"><svg viewBox="0 0 90 120"><path d="M45 114c-3-18-3-36-2-52l1-28c0-8 3-15 8-15 6 0 7 7 6 15l-1 20c3-13 7-30 12-29 6 1 4 13 2 24 4-11 9-20 14-18 6 3 1 14-4 24 3-6 8-12 12-8 5 5-2 18-8 28-8 14-16 24-24 31-5 5-11 8-16 8z" fill="#cbb293" opacity=".77"/><path d="M53 20c2-6 6-10 10-10" fill="none" stroke="#e2c9aa" stroke-width="3" stroke-linecap="round" opacity=".62"/></svg></div></div><button class="restart" onclick="location.reload()">↻ opnieuw</button><script>const coverSets={q:['https://classicalbumsundays.com/wp-content/uploads/2018/12/71eu02SZK1L._SL1058_.jpg'],im:['https://www.ironmaiden.com/files/2024/08/09_FearOfTheDark.jpg','https://upload.wikimedia.org/wikipedia/en/e/eb/Iron_Maiden_-_Fear_Of_The_Dark.jpg','https://upload.wikimedia.org/wikipedia/en/thumb/e/eb/Iron_Maiden_-_Fear_Of_The_Dark.jpg/440px-Iron_Maiden_-_Fear_Of_The_Dark.jpg'],g:['https://upload.wikimedia.org/wikipedia/en/3/3d/Meliora.JPG']};function loadWithFallback(el,urls,i=0){if(i>=urls.length)return;el.onerror=()=>loadWithFallback(el,urls,i+1);el.src=urls[i]}loadWithFallback(document.querySelector('.q'),coverSets.q);loadWithFallback(document.querySelector('.im'),coverSets.im);loadWithFallback(document.querySelector('.g'),coverSets.g);const covers=[['KISS','https://npr.brightspotcdn.com/legacy/sites/radiowest/files/201405/5-6_Kiss_Destroyer1.jpg'],['Deep Purple','https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/f4/69/61/f469613d-a7ef-e89f-007a-a7590458462b/603497826254.jpg/1200x630bb.jpg'],['Judas Priest','https://uk.rarevinyl.com/cdn/shop/products/judas-priest-british-steel-promo-stamped-uk-vinyl-lp-album-record-84160-823439_1000x1011.jpg?v=1705578436'],['Pink Floyd','https://uk.rarevinyl.com/cdn/shop/files/pink-floyd-wish-you-were-here-1st-plus-postcard-uk-vinyl-lp-album-record-shvl814-230146_1000x1006.jpg?v=1714490549']];const positions=[[8,14,8.2,.68,.63,0,-7],[82,16,7.5,.58,.57,.35,6],[13,70,7.7,.52,.52,.6,7],[79,69,6.8,.45,.48,.85,-5]];const w=document.getElementById('world');covers.forEach((c,i)=>{const p=positions[i],e=document.createElement('div');e.className='tile';e.title=c[0];e.style.cssText=`left:${p[0]}%;top:${p[1]}%;--s:${p[2]}vw;--o:${p[3]};--b:${p[4]};--blur:${p[5]}px;--r:${p[6]}deg;--d:${8+i*.9}s;--delay:${-i*.8}s;background-image:url('${c[1]}')`;w.appendChild(e)});const heroes=[document.querySelector('.q'),document.querySelector('.im'),document.querySelector('.g')],choices=document.querySelector('.choices'),buttons=[...document.querySelectorAll('.choice')],hand=document.querySelector('.hand'),calm=document.querySelector('.calm'),signal=document.querySelector('.signal');const ratings=[1,0,2];function stageHero(active){heroes.forEach((h,i)=>{h.style.animation='none';h.style.transform='translate(-50%,-50%) rotate(0deg)';h.style.top='48%';h.style.width=i===active?'min(18vw,250px)':'min(10.8vw,150px)';h.style.opacity=i===active?'1':'.42';h.style.filter=i===active?'brightness(1) saturate(1)':'brightness(.72) saturate(.72)';h.style.zIndex=i===active?'6':'3';if(i===active)h.style.left='50%';else if(i<active)h.style.left='31%';else h.style.left='69%'});calm.style.opacity='1'}function tapRating(idx){buttons.forEach(b=>b.classList.remove('selected'));const b=buttons[idx];const offsets=[-114,-38,38,114];hand.style.left=`calc(50% + ${offsets[idx]}px)`;void hand.offsetWidth;hand.classList.remove('tap');void hand.offsetWidth;hand.classList.add('tap');setTimeout(()=>b.classList.add('selected'),1120);setTimeout(()=>{signal.classList.remove('go');void signal.offsetWidth;signal.classList.add('go')},1230)}function runCycle(active,start){setTimeout(()=>{stageHero(active);choices.classList.add('show')},start);setTimeout(()=>tapRating(ratings[active]),start+1450);setTimeout(()=>{buttons.forEach(b=>b.classList.remove('selected'));choices.classList.remove('show')},start+3600)}setTimeout(()=>{heroes.forEach(h=>{h.style.animationPlayState='paused'})},25500);runCycle(0,27000);runCycle(1,32500);runCycle(2,38000);setTimeout(()=>{heroes.forEach((h,i)=>{h.style.width='min(11.5vw,160px)';h.style.opacity='.5';h.style.left=['34%','50%','66%'][i];h.style.filter='brightness(.78) saturate(.78)'})},43000);</script></body></html>
