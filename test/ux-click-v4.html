<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>Music DNA · Voordeur v4</title><style>:root{--g:#1ed760;--t:#f7faf8;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11);--gold:#d7b86a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -5%,#1c4433 0,#0c1914 34%,#070b0a 74%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(86px + env(safe-area-inset-bottom,0px))}.top{text-align:center;position:relative;margin-bottom:17px}.logo{width:55px;height:55px}.brand{font-size:12px;font-weight:850;letter-spacing:1.25px;color:var(--g);text-transform:uppercase}.gear{position:absolute;right:0;top:1px;border:0;background:none;color:#9eaaa4;font-size:21px}.eye{color:var(--g);font-size:11px;font-weight:850;letter-spacing:1px;text-transform:uppercase}.muted{color:var(--m)}h1{font-size:30px;line-height:1.08;margin:5px 0 8px}h2{font-size:21px;margin:4px 0 7px}h3{font-size:18px;margin:0 0 5px}.lead{font-size:16px;line-height:1.48}.hero{border:1px solid rgba(30,215,96,.28);background:linear-gradient(145deg,rgba(30,215,96,.13),rgba(255,255,255,.045));border-radius:25px;padding:20px;margin:12px 0 18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.hero .big{font-size:31px;font-weight:850;line-height:1.08;margin:7px 0}.hero .sub{color:#c5d1cb;line-height:1.45}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:16px;margin:11px 0}.card{cursor:pointer}.btn{width:100%;border:0;border-radius:999px;padding:14px;font-size:15px;font-weight:850;margin:13px 0 3px;background:var(--g);color:#07100b}.secondary{background:rgba(30,215,96,.09);color:#d5f8df;border:1px solid rgba(30,215,96,.23)}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 12px}.teasers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.teaser{background:var(--c);border:1px solid var(--l);border-radius:19px;padding:15px;min-height:137px;cursor:pointer}.teaser .ico{font-size:24px;margin-bottom:8px}.teaser p{font-size:13px;color:var(--m);line-height:1.35;margin:6px 0}.pill{display:inline-block;font-size:10px;font-weight:800;color:#d5f8df;background:rgba(30,215,96,.09);border:1px solid rgba(30,215,96,.2);padding:5px 8px;border-radius:999px;margin-top:6px}.gold{color:var(--gold)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:70px;background:#09100d;border-top:1px solid var(--l);display:flex;justify-content:space-around;padding-top:8px;padding-bottom:env(safe-area-inset-bottom,0)}.nav button{border:0;background:none;color:#84928b;font-size:11px;min-width:88px}.nav b{display:block;font-size:19px;margin-bottom:3px}.nav .on{color:var(--g)}.cover{height:176px;border-radius:19px;background:radial-gradient(circle at 50% 30%,#625027,#25170e 47%,#090b0a 76%);display:grid;place-items:center;font-size:39px;font-weight:900;letter-spacing:2px;margin:12px 0}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:white;border-radius:16px;padding:14px 6px;font-weight:700}.link{color:var(--g);font-weight:750}.route{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.route button{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#d7e1dc;border-radius:999px;padding:8px 10px}.story{padding:13px 0;border-bottom:1px solid var(--l)}.story:last-child{border:0}.statebar{display:flex;gap:7px;margin:10px 0 18px}.statebar button{flex:1;border:1px solid var(--l);background:rgba(255,255,255,.04);color:#aebbb5;border-radius:12px;padding:8px 4px;font-size:11px}.statebar .on{color:#d8f7e1;border-color:rgba(30,215,96,.35);background:rgba(30,215,96,.08)}</style></head><body><main class="app"><div class="top"><button class="gear" onclick="go('settings')">⚙︎</button><img class="logo" src="icon.svg" alt="Music DNA"><div class="brand">Music DNA</div></div><div id="screen"></div></main><nav class="nav"><button class="on" onclick="root('front',this)"><b>⌂</b>Vandaag</button><button onclick="root('mine',this)"><b>♫</b>Mijn Muziek</button><button onclick="root('actual',this)"><b>▤</b>Actueel</button></nav><script>const S=document.getElementById('screen');let stack=[],page='front',mode=0;function el(t,c,x){let e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function go(p){stack.push(page);render(p)}function back(){render(stack.pop()||'front')}function root(p,b){stack=[];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(p)}function head(txt){S.innerHTML='';if(txt){let b=el('button','back','‹ '+txt);b.onclick=back;S.appendChild(b)}}function render(p){page=p;({front,choices,cirice,ghost,reviews,alive,actual,mine,settings}[p]||front)();scrollTo(0,0)}function switchMode(n){mode=n;front()}function front(){head();S.appendChild(el('div','eye','Dinsdag · jouw muziekwereld'));S.appendChild(el('h1','','Even kijken wat Music DNA voor je heeft…'));let sb=el('div','statebar');['Keuzes open','Keuzes gedaan','Volgende dag'].forEach((x,i)=>{let b=el('button',i===mode?'on':'',x);b.onclick=()=>switchMode(i);sb.appendChild(b)});S.appendChild(sb);let h=el('section','hero');if(mode===0){h.appendChild(el('div','eye','3 nieuwe ontdekkingen'));h.appendChild(el('div','big','Ik heb nieuwe muziek voor je gevonden.'));h.appendChild(el('div','sub','Drie nummers, gekozen vanuit jouw Music DNA. Jij luistert en bepaalt wat blijft.'));let b=el('button','btn','Begin met luisteren →');b.onclick=()=>go('choices');h.appendChild(b)}else if(mode===1){h.appendChild(el('div','eye','Van jouw laatste keuze'));h.appendChild(el('div','big','❤️ Cirice bleef hangen.'));h.appendChild(el('div','sub','Er zit een interessant verhaal achter dit nummer — en recensenten waren er bepaald niet stil over.'));let b=el('button','btn','Vertel me meer →');b.onclick=()=>go('cirice');h.appendChild(b);let r=el('div','route');[['Recensies',()=>go('reviews')],['Ghost',()=>go('ghost')],['Meliora',()=>go('ghost')]].forEach(x=>{let q=el('button','',x[0]);q.onclick=x[1];r.appendChild(q)});h.appendChild(r)}else{h.appendChild(el('div','eye','Vandaag in jouw muziekwereld'));h.appendChild(el('div','big','51 jaar geleden begon iets.'));h.appendChild(el('div','sub','KISS bracht Alive! uit. Voor jouw muziekverhaal is vooral één nummer bijzonder: 100,000 Years.'));let b=el('button','btn','Terug naar 1975 →');b.onclick=()=>go('alive');h.appendChild(b)}S.appendChild(h);S.appendChild(el('div','eye','Misschien ook interessant'));let g=el('div','teasers');let data=mode===0?[['📰','Ghost','Nieuw interview met Tobias Forge.','Actueel','ghost'],['🎸','Iron Maiden','Recente setlists bevatten een verrassing.','Live','actual']]:mode===1?[['📝','Cirice','3 recensies om naast jouw ❤️ te leggen.','Recensies','reviews'],['🎸','Iron Maiden','Nieuwe tourdata zijn bekend.','Live','actual']]:[['🌱','Nieuwe naam','Een moderne band raakt opvallend aan jouw hardrock-DNA.','Ontdekking','choices'],['📰','Ghost','Er is nieuw nieuws rond de band.','Actueel','ghost']];data.forEach(x=>{let t=el('div','teaser');t.appendChild(el('div','ico',x[0]));t.appendChild(el('h3','',x[1]));t.appendChild(el('p','',x[2]));t.appendChild(el('span','pill',x[3]));t.onclick=()=>go(x[4]);g.appendChild(t)});S.appendChild(g);let c=el('section','card');c.appendChild(el('div','eye','Uit jouw verhaal'));c.appendChild(el('h3','','Van KISS naar Iron Maiden naar Ghost'));c.appendChild(el('div','muted','Een muzikale lijn die generaties overbrugt. Alleen openen als je er vandaag zin in hebt.'));c.onclick=()=>go('alive');S.appendChild(c)}function choices(){head('Vandaag');S.appendChild(el('div','eye','Jouw dagelijkse ontdekkingen'));S.appendChild(el('h1','','Luister. Voel. Kies.'));['Cirice · Ghost','Evolve · The Warning','Highway Tune · Greta Van Fleet'].forEach((x,i)=>{let c=el('section','card');c.appendChild(el('div','eye',(i+1)+' VAN 3'));c.appendChild(el('h3','',x));if(i===0)c.onclick=()=>go('cirice');S.appendChild(c)});let b=el('button','btn secondary','Simuleer: alle keuzes gedaan');b.onclick=()=>{mode=1;render('front')};S.appendChild(b)}function cirice(){head('Terug');S.appendChild(el('div','cover','GHOST'));S.appendChild(el('div','eye','Ghost · Meliora · 2015'));S.appendChild(el('h1','','Cirice'));S.appendChild(el('div','lead muted','Luister eerst. Alles wat je daarna misschien wilt weten staat dichtbij, maar niets hoeft.'));let p=el('section','panel');p.appendChild(el('div','eye','Jouw oordeel'));let r=el('div','ratings');['❤️ Raak','👍 Goed','😐 Twijfel','👎 Nee'].forEach(v=>r.appendChild(el('button','rate',v)));p.appendChild(r);S.appendChild(p);let rt=el('div','route');[['Waarom voor mij?',()=>{}],['Recensies',()=>go('reviews')],['Ghost',()=>go('ghost')],['Meliora',()=>go('ghost')]].forEach(x=>{let q=el('button','',x[0]);q.onclick=x[1];rt.appendChild(q)});S.appendChild(rt)}function ghost(){head('Terug');S.appendChild(el('div','eye','Artiest'));S.appendChild(el('h1','','Ghost'));S.appendChild(el('div','lead muted','Je kwam hier omdat iets rond Ghost je nieuwsgierig maakte. Nu mag je zelf los.'));[['Muziek','Albums, nummers en jouw beoordelingen'],['Verhaal','Biografie, leden, invloeden en ontwikkeling'],['Actueel','Nieuws, interviews en aankondigingen'],['Live','Tourdata en setlists'],['Recensies','Track- en albumkritiek']].forEach((x,i)=>{let c=el('section','card');c.appendChild(el('h3','',x[0]+' ›'));c.appendChild(el('div','muted',x[1]));if(i===4)c.onclick=()=>go('reviews');S.appendChild(c)})}function reviews(){head('Terug');S.appendChild(el('div','eye','Cirice · Ghost'));S.appendChild(el('h1','','Wat schreven recensenten?'));S.appendChild(el('div','lead muted','Jouw oordeel blijft van jou. Dit is verdieping, geen stemadvies.'));let p=el('section','panel');[['Pitchfork','Positief · opbouw, dynamiek en centrale riff'],['OOR','Positief · melodramatische hardrockwereld'],['Andere bronnen','Gemengd · theatrale elementen verdelen de meningen']].forEach(x=>{let s=el('div','story');s.appendChild(el('h3','',x[0]));s.appendChild(el('div','muted',x[1]));p.appendChild(s)});S.appendChild(p)}function alive(){head('Terug');S.appendChild(el('div','eye gold','Jouw muziekgeschiedenis · 1975'));S.appendChild(el('h1','','KISS · Alive!'));S.appendChild(el('div','lead muted','100,000 Years vormt een ankerpunt in jouw hardrockverhaal. Vanuit zo’n aanleiding kan Music DNA geschiedenis, album, nummer en verwantschappen openen.'));let r=el('div','route');['100,000 Years','Het album','KISS','Waarom een anker?','Verwante muziek'].forEach(x=>r.appendChild(el('button','',x)));S.appendChild(r)}function actual(){head();S.appendChild(el('div','eye','Nu relevant voor jou'));S.appendChild(el('h1','','Actueel'));[['Ghost','Nieuw interview met Tobias Forge'],['Iron Maiden','Nieuwe tourdata'],['Recensies','Nieuwe bespreking van een album in jouw muziekwereld']].forEach(x=>{let c=el('section','card');c.appendChild(el('h3','',x[0]));c.appendChild(el('div','muted',x[1]));S.appendChild(c)})}function mine(){head();S.appendChild(el('div','eye','Wat zich opbouwt'));S.appendChild(el('h1','','Mijn Muziek'));[['🧬 Mijn profiel','Smaak, ankers en ontwikkeling'],['❤️ Mijn verzameling','Wat jij Raak of Goed vond en wilt terugvinden']].forEach(x=>{let c=el('section','card');c.appendChild(el('h2','',x[0]));c.appendChild(el('div','muted',x[1]));S.appendChild(c)})}function settings(){head('Terug');S.appendChild(el('h1','','Instellingen'));S.appendChild(el('section','panel','Account, Spotify, bronnen en voorkeuren blijven buiten de muzikale voordeur.'))}render('front');</script></body></html>
