<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06100c"><title>Music DNA · W36 cadeau</title><style>:root{--g:#20df68;--t:#f5f8f6;--m:#a9b5af}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030605;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100dvh;max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 10px);background:radial-gradient(circle at 50% 0,#123226,#07110d 38%,#030605 88%);display:flex;flex-direction:column}.head{text-align:center;flex:none}.logo{width:54px;height:54px;border-radius:13px}.brand,.eye{color:var(--g);font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.brand{font-size:13px;margin-top:5px}.sub{color:var(--m);font-size:13px}.screen{flex:1;min-height:0}.sealed,.blocked{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center}.eye{font-size:13px}.gift{font-size:min(24vw,112px);line-height:1;filter:drop-shadow(0 0 24px rgba(32,223,104,.25))}h1{font-size:clamp(27px,8vw,38px);line-height:1.02;margin:0}.lead{color:var(--m);font-size:clamp(14px,4vw,17px);line-height:1.35;margin:0;max-width:430px}.btn{width:100%;border:0;border-radius:999px;background:var(--g);color:#031009;padding:15px 12px;font-size:17px;font-weight:900}.btn:disabled{opacity:.6}.unwrap{width:100%}.wall{height:100%;display:flex;flex-direction:column;min-height:0}.walltop{text-align:center;flex:none}.walltop h1{font-size:23px;margin:2px 0}.status{color:var(--g);font-size:12px;font-weight:800;height:18px}.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(7,1fr);gap:4px;margin:4px 0}.tile{position:relative;min-height:0;opacity:0;transform:scale(.55);transition:opacity .28s ease,transform .42s cubic-bezier(.2,.9,.3,1.35)}.tile.on{opacity:1;transform:scale(1)}.cover,.fallback{width:100%;height:100%;object-fit:cover;border-radius:7px;border:1px solid rgba(255,255,255,.12);display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:#111b17;color:#245f40;font-size:20px}.badge{position:absolute;z-index:3;top:-3px;left:-3px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 8px #000}.heart{background:#c9443d}.thumb{background:#238a48}.done{flex:none;max-height:0;opacity:0;overflow:hidden;transition:.4s ease}.done.on{max-height:64px;opacity:1;margin-top:4px}.done .btn{padding:12px;font-size:15px}.spark{animation:spark .7s ease}@keyframes spark{50%{filter:drop-shadow(0 0 12px var(--g))}}@media(max-height:700px){.logo{width:44px;height:44px}.brand{font-size:11px}.sub{font-size:11px}.gift{font-size:78px}.lead{font-size:13px}.btn{padding:12px}.walltop h1{font-size:19px}}</style></head><body><main class="app"><header class="head"><img class="logo" src="apple-touch-icon.png?v=3" alt="Music DNA"><div class="brand">Ben's Music DNA</div><div class="sub">Ontdek DNA · W36</div></header><div id="screen" class="screen"></div></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-candidates-w36-v1.js"></script><script src="music-dna-learning-v1.js"></script><script src="music-dna-positive-bank-v1.js"></script><script>
const S=document.getElementById('screen'),WEEK='2026-W36',WEEK_LABEL='W36',CLIENT='97d634a60b824ecabfcc63790c0af5dd',REDIRECT='https://bcim1958.github.io/bens-music-dna/test/spotify-callback.html',GIFT_KEY='bmd-gift-'+WEEK+'-v1',DELIVERY='bmd-delivery-'+WEEK+'-v1';
function read(k,f=null){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function track(id){return (MUSIC_DNA_W36_CANDIDATES.tracks&&MUSIC_DNA_W36_CANDIDATES.tracks[id])||(MUSIC_DNA_W35_CANDIDATES.tracks&&MUSIC_DNA_W35_CANDIDATES.tracks[id])||(MUSIC_DNA_DB.tracks&&MUSIC_DNA_DB.tracks[id])||null}function selectedWeekIds(){let ids=[];for(let d=1;d<=7;d++){const s=read('bmd-week-'+WEEK+'-day'+d+'-selection-v1',null),st=read('bmd-week-'+WEEK+'-day'+d+'-v1',{});if(!s||!s.ids||s.ids.length!==3)return null;for(const id of s.ids){if(!st[id]||!st[id].rating)return null;ids.push(id)}}return ids}
function buildGift(){let g=read(GIFT_KEY,null);if(g&&g.complete&&g.ids&&g.ids.length===21)return g;const ids=selectedWeekIds();if(!ids)return null;g=MUSIC_DNA_POSITIVE_BANK.buildSaturdayPlaylist(WEEK,ids);if(!g.complete)return g;write(GIFT_KEY,g);return g}
let GIFT=buildGift();
function blocked(){S.innerHTML=`<section class="blocked"><div class="eye">Nog niet zover</div><div class="gift">🎁</div><h1>Je cadeau blijft<br>nog even dicht</h1><p class="lead">Eerst moeten alle 21 ontdekkingen van ${WEEK_LABEL} beoordeeld zijn. Daarna gaat de feestelijke zaterdag open.</p><div class="unwrap"><button class="btn" onclick="location.href='daily.html'">Terug naar mijn ontdekkingen</button></div></section>`}
function sealed(){S.innerHTML=`<section class="sealed"><div class="eye">Week klaar</div><div class="gift">🎁</div><h1>Je hebt een <span style="color:var(--g)">cadeautje</span><br>verdiend</h1><p class="lead">${GIFT.fromCurrentWeek} uit deze week${GIFT.fromReserve?` · ${GIFT.fromReserve} uit je positieve reserve`:''}.<br>21 positieve ontdekkingen wachten op je.</p><div class="unwrap"><button class="btn" id="unwrap">🎁 &nbsp; Bekijk mijn cadeau</button></div></section>`;document.getElementById('unwrap').onclick=unpack}
async function art(url,img,fb){try{const id=spotifyId(url),r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent('https://open.spotify.com/track/'+id)),d=await r.json();if(d.thumbnail_url){img.src=d.thumbnail_url;img.onload=()=>fb.remove();return}}catch(e){}img.remove()}
function spotifyId(url){const m=String(url||'').match(/track\/([A-Za-z0-9]+)/);return m?m[1]:''}function spotifyUri(t){const id=spotifyId(t&&t.spotifyUrl);return id?'spotify:track:'+id:null}
function giftTracks(){return GIFT.ids.map(id=>({id,bank:GIFT.tracks.find(x=>x.trackId===id),track:track(id)})).filter(x=>x.track)}
function unpack(){const T=giftTracks();S.innerHTML=`<section class="wall"><div class="walltop"><div class="eye">${WEEK_LABEL} uitgepakt</div><h1>Jouw <span style="color:var(--g)">21</span> nummers</h1><div class="status" id="status">Daar komen ze…</div></div><div class="grid" id="grid"></div><div class="done" id="done"><button class="btn" id="spotify">♫ &nbsp; Cadeau klaar voor Spotify</button></div></section>`;const g=document.getElementById('grid');T.forEach(x=>{const d=document.createElement('div');d.className='tile';const heart=x.bank&&x.bank.rating==='raak';d.innerHTML=`<span class="badge ${heart?'heart':'thumb'}">${heart?'♥':'👍'}</span><div class="fallback">⌁</div><img class="cover" alt="${esc(x.track.identity.artist)} – ${esc(x.track.identity.title)}">`;g.appendChild(d);art(x.track.spotifyUrl,d.querySelector('img'),d.querySelector('.fallback'))});const a=[...g.children],st=document.getElementById('status');let i=0;function next(){if(i===a.length){st.textContent='🎉 Je cadeau is compleet';setTimeout(()=>{document.getElementById('done').classList.add('on');setupSpotify()},650);return}a[i].classList.add('on','spark');st.textContent=`${i+1} van 21`;i++;setTimeout(next,900)}setTimeout(next,550)}
function setupSpotify(){const b=document.getElementById('spotify'),d=read(DELIVERY,null);if(d&&d.url){b.textContent='✓ '+WEEK_LABEL+' bezorgd — Open in Spotify';b.onclick=()=>location.href=d.url;return}b.onclick=deliver}
async function freshToken(){let token=sessionStorage.getItem('bmd_spotify_access'),exp=Number(sessionStorage.getItem('bmd_spotify_expires')||0);if(token&&Date.now()<exp-30000)return token;const refresh=localStorage.getItem('bmd_spotify_refresh');if(refresh){try{const body=new URLSearchParams({client_id:CLIENT,grant_type:'refresh_token',refresh_token:refresh});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(r.ok){const t=await r.json();sessionStorage.setItem('bmd_spotify_access',t.access_token);sessionStorage.setItem('bmd_spotify_expires',String(Date.now()+(t.expires_in||3600)*1000));if(t.refresh_token)localStorage.setItem('bmd_spotify_refresh',t.refresh_token);return t.access_token}}catch(e){}}return null}
async function deliver(){const b=document.getElementById('spotify');b.disabled=true;b.textContent='Spotify wordt voorbereid…';try{const token=await freshToken();if(!token){await authorize();return}await createGift(token,b)}catch(e){b.disabled=false;b.textContent='Opnieuw proberen met Spotify'}}
async function authorize(){const verifier=random(64),challenge=await sha256(verifier),state=random(24);sessionStorage.setItem('bmd_spotify_verifier',verifier);sessionStorage.setItem('bmd_spotify_state',state);sessionStorage.setItem('bmd_spotify_return','zaterdagcadeau.html');const p=new URLSearchParams({client_id:CLIENT,response_type:'code',redirect_uri:REDIRECT,scope:'playlist-modify-private',code_challenge_method:'S256',code_challenge:challenge,state});location.href='https://accounts.spotify.com/authorize?'+p}
async function createGift(token,b){b.textContent='Cadeau wordt bezorgd…';const old=read(DELIVERY,null);if(old&&old.url){location.href=old.url;return}const T=giftTracks(),uris=T.map(x=>spotifyUri(x.track));if(uris.length!==21||uris.some(x=>!x))throw new Error('spotify ids');const r=await fetch('https://api.spotify.com/v1/me/playlists',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({name:'Ontdek-DNA · '+WEEK_LABEL,public:false,description:'Ben’s Music DNA · '+WEEK_LABEL+' · zondag 30 augustus t/m zaterdag 5 september 2026.'})});if(r.status===401){sessionStorage.removeItem('bmd_spotify_access');sessionStorage.removeItem('bmd_spotify_expires');await authorize();return}if(!r.ok)throw new Error('create '+r.status);const p=await r.json();const a=await fetch('https://api.spotify.com/v1/playlists/'+encodeURIComponent(p.id)+'/items',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({uris})});if(!a.ok)throw new Error('items '+a.status);const url=(p.external_urls&&p.external_urls.spotify)||('https://open.spotify.com/playlist/'+p.id);write(DELIVERY,{id:p.id,url,at:new Date().toISOString(),week:WEEK,ids:GIFT.ids.slice()});MUSIC_DNA_POSITIVE_BANK.commitSaturdayPlaylist(GIFT);b.disabled=false;b.textContent='✓ '+WEEK_LABEL+' bezorgd — Open in Spotify';b.onclick=()=>location.href=url}
function random(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>(x%36).toString(36)).join('')}async function sha256(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
if(new URLSearchParams(location.search).get('spotify')==='ready'){history.replaceState({},'',location.pathname);GIFT=buildGift();if(!GIFT||!GIFT.complete)blocked();else{unpack();setTimeout(async()=>{const b=document.getElementById('spotify');if(b){b.disabled=true;b.textContent='Cadeau wordt bezorgd…';const t=await freshToken();if(t)createGift(t,b)}},20500)}}else if(!GIFT||!GIFT.complete)blocked();else sealed();
</script></body></html>
