<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · Edelsteenmuseum</title><style>body{background:#07100b;color:#f5f8f6;font:17px/1.5 system-ui;max-width:620px;margin:0 auto;padding:24px}a{color:#63e69a}img{width:100%;max-width:500px;border-radius:12px}h1{line-height:1.15}li{margin:8px 0}</style><main><h1 id="title">Edelsteenmuseum</h1><p id="status">De week wordt gecontroleerd…</p><div id="entry"></div></main><script>
(async()=>{const week=new URLSearchParams(location.search).get('week'),status=document.getElementById('status'),entry=document.getElementById('entry');const add=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;entry.appendChild(e);return e};try{if(!/^\d{4}-\d{2}$/.test(week||''))throw Error('Deze week is niet beschikbaar.');const r=await fetch('../data/week-publication-manifest-'+week+'-simulation-frozen.json',{cache:'no-store'});if(!r.ok)throw Error('De gecontroleerde museumweek staat nog niet klaar.');const m=await r.json();if(m.weekId!==week||m.freeze?.status!=='frozen'||m.tracks?.length!==21||JSON.stringify(m.freeze.orderedTrackIds)!==JSON.stringify(m.tracks.map(t=>t.spotifyTrackId||t.trackId)))throw Error('De weekselectie is niet volledig gecontroleerd.');document.getElementById('title').textContent='Ontdek DNA · '+week;status.textContent='De edelsteen hoort bij deze hele week.';const img=add('img','');img.src='../'+m.artwork.assetId;img.alt=m.gemstone.name+' · Steen '+m.gemstone.sequenceNumber;add('h2',m.gemstone.name+' · Steen '+m.gemstone.sequenceNumber);add('p',m.gemstone.editorialText);add('h2','De muziek');const ol=add('ol','');m.tracks.forEach(t=>{const li=document.createElement('li'),a=document.createElement('a');a.textContent=t.artistName+' — '+t.title;a.href='https://open.spotify.com/track/'+t.spotifyTrackId;li.appendChild(a);ol.appendChild(li)});add('h2','Bezorging');let d;try{d=JSON.parse(localStorage.getItem('bmd-delivery-'+week.replace('-','-W')+'-v1')||'null')}catch(ignore){}if(d?.receipt?.artworkReadback&&JSON.stringify(d.receipt.orderedUris)===JSON.stringify(m.tracks.map(t=>'spotify:track:'+t.spotifyTrackId))){add('p','Playlist en hoes teruggelezen. Zichtbare eindcontrole blijft afzonderlijk nodig.');if(/^https:\/\/open.spotify.com\/playlist\/[A-Za-z0-9]+$/.test(d.url||'')){const a=add('a','Open deze week in Spotify');a.href=d.url}}else add('p','Spotify-bezorging is in deze omgeving nog niet bevestigd.');add('p','Spotify-mapplaatsing: bekende technische beperking.');add('p','DNA Express: overdracht voorbereid zodra de simulatie groen is; definitieve bestemming nog niet operationeel.');}catch(e){status.textContent=e.message;entry.replaceChildren()}})();
</script></html>
