<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3"><title>Music DNA</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(48px + env(safe-area-inset-bottom,0px))}.top{text-align:center;margin-bottom:34px}.brand-logo{width:76px;height:76px;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 14px rgba(30,215,96,.18));border-radius:17px}.eye,.status{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.brand-name{font-size:15px;font-weight:850;letter-spacing:1.4px;color:var(--g);text-transform:uppercase}.muted{color:var(--m)}#cycleLabel{font-size:18px;margin-top:2px}.day-status{width:104px;height:104px;border:2px solid var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px}.day-status .num{font-size:42px;font-weight:850}.notice{text-align:center;padding:8px 8px 36px}h1{font-size:31px;line-height:1.08}.intro{font-size:17px;line-height:1.48}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b}.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.small{font-size:14px;line-height:1.5}.footer{text-align:center;color:#718078;font-size:12px;margin-top:28px}.giftbox{font-size:96px;line-height:1;margin:26px 0}.giftlist{text-align:left;font-size:14px;line-height:1.55;background:rgba(0,0,0,.24);border-radius:16px;padding:14px;margin-top:14px}@media(min-width:700px){.app{padding-top:34px}}</style></head><body><main class="app"><div class="top"><img class="brand-logo" src="apple-touch-icon.png?v=3" alt="Music DNA"><div class="brand-name">Ben's Music DNA</div><div class="muted" id="cycleLabel">Ontdek-DNA · 2026 · W36</div></div><div id="screen"></div><div class="footer">3 per dag · 21 per week · alleen +1/+2 naar zaterdag</div></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-candidates-w36-v1.js"></script><script src="music-dna-learning-v1.js"></script><script src="music-dna-positive-bank-v1.js"></script><script>(function(){var screen=document.getElementById('screen'),WEEK='2026-W36',DISPLAY='2026 · W36';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function n(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function track(id){return MUSIC_DNA_W36_CANDIDATES.tracks[id]||MUSIC_DNA_W35_CANDIDATES.tracks[id]||MUSIC_DNA_DB.tracks[id]||null}function actualRatings(){var out={};for(var d=1;d<=7;d++){var st=read('bmd-week-'+WEEK+'-day'+d+'-v1',{});for(var id in st){if(Object.prototype.hasOwnProperty.call(st,id)&&st[id]&&st[id].rating&&/^2026-W36-/.test(id))out[id]={id:id,rating:st[id].rating,ratedAt:st[id].ratedAt||null,day:d};}}return out}function selectedIds(){var out=[];for(var d=1;d<=7;d++){var s=read('bmd-week-'+WEEK+'-day'+d+'-selection-v1',null);if(s&&s.ids)out=out.concat(s.ids);}return out}function showGift(){document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY+' · Cadeau';screen.innerHTML='';var ratings=actualRatings(),ids=Object.keys(ratings),w=n('section','notice');if(ids.length!==21){w.appendChild(n('div','eye','Veilige wachtstand'));w.appendChild(n('h1','','W36 is nog niet technisch bewezen'));w.appendChild(n('div','intro','Music DNA vindt in deze appopslag '+ids.length+' van de 21 echte W36-beoordelingen. Er is niets gewijzigd of opnieuw beoordeeld.'));var p=n('section','panel');p.appendChild(n('div','small muted','De oude melding “21 beoordelingen beschikbaar” bleek een kalendertekst na afloop van de week en was geen telling van de opgeslagen beoordelingen. Deze controle telt nu de echte opgeslagen W36-beoordelingen.'));w.appendChild(p);screen.appendChild(w);return}var positive=ids.filter(function(id){return ratings[id].rating==='raak'||ratings[id].rating==='goed'});w.appendChild(n('div','eye','Herstel bevestigd'));w.appendChild(n('div','giftbox','🎁'));w.appendChild(n('h1','','21/21 W36-beoordelingen bewezen'));w.appendChild(n('div','intro',positive.length+' positieve W36-nummers zijn gevonden. De beoordelingen blijven ongewijzigd.'));var b=n('button','btn','Verder met mijn W36-cadeau');b.onclick=function(){var gift=MUSIC_DNA_POSITIVE_BANK.buildSaturdayPlaylist(WEEK,ids);if(!gift.complete){screen.innerHTML='';var z=n('section','notice');z.appendChild(n('div','eye','Veilige wachtstand'));z.appendChild(n('h1','','Beoordelingen compleet, cadeauvoorraad nog niet'));z.appendChild(n('div','intro','Alle 21 beoordelingen zijn bewezen. De bezorgbare positieve voorraad komt veilig tot '+gift.size+'/21. Er wordt niets geforceerd.'));screen.appendChild(z);return}write('bmd-gift-'+WEEK+'-v1',gift);renderGift(gift)};w.appendChild(b);screen.appendChild(w)}function renderGift(gift){screen.innerHTML='';var w=n('section','notice');w.appendChild(n('div','eye','W36 uitgepakt'));w.appendChild(n('h1','','Jouw 21 nummers'));var list=n('div','giftlist');gift.tracks.forEach(function(x,i){list.appendChild(n('div','',String(i+1)+'. '+x.artist+' — '+x.title+' · '+(x.rating==='raak'?'❤️':'👍')))});w.appendChild(list);screen.appendChild(w)}function render(){var ratings=actualRatings(),count=Object.keys(ratings).length;document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY;screen.innerHTML='';var w=n('section','notice'),c=n('div','day-status'),num=n('div','num',count===21?'✓':String(count));c.appendChild(num);w.appendChild(c);w.appendChild(n('div','eye',count===21?'Week afgerond':'Herstelcontrole'));w.appendChild(n('h1','',count===21?'21 beoordelingen bevestigd':count+' van 21 beoordelingen gevonden'));w.appendChild(n('div','intro',count===21?DISPLAY+' is aantoonbaar compleet. De positieve oogst is klaar voor het zaterdagcadeau.':'Music DNA telt nu de werkelijk opgeslagen W36-beoordelingen in plaats van alleen de kalenderdatum.'));var gift=n('button','btn','🎁 Controleer mijn '+DISPLAY+'-cadeau');gift.onclick=showGift;w.appendChild(gift);screen.appendChild(w)}render()})();</script></body></html>
