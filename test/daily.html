<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3"><title>Music DNA</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 76px) 20px calc(48px + env(safe-area-inset-bottom,0px))}.top{text-align:center;margin-bottom:34px}.brand-logo{width:76px;height:76px;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 14px rgba(30,215,96,.18));border-radius:17px}.eye,.status{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.brand-name{font-size:15px;font-weight:850;letter-spacing:1.4px;color:var(--g);text-transform:uppercase}.muted{color:var(--m)}#cycleLabel{font-size:18px;margin-top:2px}.day-status{width:104px;height:104px;border:2px solid var(--g);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 0 24px rgba(30,215,96,.08)}.day-status .num{font-size:40px;line-height:.95;font-weight:850;color:var(--g)}.day-status .txt{font-size:13px;font-weight:700;line-height:1.15;margin-top:7px;text-align:center}.day-status.done .num{font-size:42px;color:var(--t)}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h2{font-size:22px;margin:4px 0 8px}h3{font-size:20px;margin:0 0 6px l:'😐 Twijfel',nee:'👎 Nee'},START=new Date(2026,7,30),END=new Date(2026,8,6),WEEK='2026-W36',DISPLAY_WEEK='2026 · W36';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function n(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function track(id){return MUSIC_DNA_W36_CANDIDATES.tracks[id]||MUSIC_DNA_W35_CANDIDATES.tracks[id]||MUSIC_DNA_DB.tracks[id]}function country(c){return({'United States':'Verenigde Staten','United Kingdom':'Verenigd Koninkrijk','Sweden':'Zweden','Norway':'Noorwegen','Australia':'Australië','Ireland':'Ierland'})[c]||c||'Onbekend'}function cycleDay(now){if(now<START)return 0;if(now>=END)return 8;return Math.floor((now-START)/86400000)+1}function stateKey(d){return'bmd-week-'+WEEK+'-day'+d+'-v1'}function selectionKey(d){return'bmd-week-'+WEEK+'-day'+d+'-selection-v1'}function allExcluded(){var out={},model=MUSIC_DNA_LEARNING.read(),signals=model.signals||{};for(var id in signals)out[id]=true;for(var d=1;d<=7;d++){var x=read(selectionKey(d),null);if(x&&x.ids)x.ids.forEach(function(i){out[i]=true})}return Object.keys(out)}function getSelection(d){var s=read(selectionKey(d),null);if(s&&s.ids&&s.ids.length===3)return s;var chosen=MUSIC_DNA_SELECTOR.chooseBatch(MUSIC_DNA_W36_CANDIDATES.tracks,{size:3,excludeIds:allExcluded()});s={ids:chosen.map(function(x){return x.id}),createdAt:new Date().toISOString(),signalCount:MUSIC_DNA_SELECTOR.buildProfile().count,reserveMode:chosen.reserveMode&&chosen.reserveMode.mode||'normal'};write(selectionKey(d),s);return s}function statusCircle(left){var c=n('div','day-status'+(left===0?' done':'')),a=n('div','num',left===0?'✓':String(left));c.appendChild(a);if(left)c.appendChild(n('div','txt','te gaan\nvandaag'));return c}function spotifyUrl(t){return t.spotifyUrl||('https://open.spotify.com/search/'+encodeURIComponent(t.identity.title+' '+t.identity.artist))}function renderDay(d){document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY_WEEK+' · Dag '+d+' van 7';var sel=getSelection(d),ids=sel.ids,s=read(stateKey(d),{}),done=ids.filter(function(id){return s[id]&&s[id].rating}).length;screen.innerHTML='';screen.appendChild(statusCircle(3-done));screen.appendChild(n('div','eye','Vandaag'));screen.appendChild(n('h1','','Jouw 3 ontdekkingen'));screen.appendChild(n('div','intro','Drie nieuwe nummers voor de playlist van zaterdag.'));var bar=n('div','trackbar'),fill=n('div');fill.style.width=(done/3*100)+'%';bar.appendChild(fill);screen.appendChild(bar);ids.forEach(function(id,i){var t=track(id),c=n('section','card'),r=s[id]&&s[id].rating;c.appendChild(n('div','status',r?'✓ BEOORDEELD':(i+1)+' VAN 3 · NOG TE ONTDEKKEN'));c.appendChild(n('h3','',t.identity.title));c.appendChild(n('div','muted',t.identity.artist));c.appendChild(n('div','meta',country(t.identity.country)+' · '+t.identity.releaseYear+' · '+t.identity.albumOrRelease));var tags=n('div','tags'),st=(t.taxonomy&&t.taxonomy.allMusicStyles)||[];(st.length?st:(t.discoverDNA&&t.discoverDNA.dnaRoute||[])).slice(0,2).forEach(function(x){tags.appendChild(n('span','tag',x))});c.appendChild(tags);if(r)c.appendChild(n('div','meta',labels[r]));c.onclick=function(){detail(d,id)};screen.appendChild(c)});if(done===3){var p=n('section','panel');p.appendChild(n('div','eye','Vandaag voltooid'));p.appendChild(n('h2','',d===7?'Week klaar. Je hebt een cadeautje verdiend.':'3 signalen toegevoegd'));p.appendChild(n('div','small muted',d===7?'Je 21 beoordelingen zijn compleet. De feestelijke zaterdag kan beginnen.':'Morgen staan weer drie nieuwe ontdekkingen klaar.'));if(d===7){var gift=n('button','btn','🎁 Bekijk mijn cadeau');gift.onclick=function(){location.href='zaterdagcadeau.html'};p.appendChild(gift)}screen.appendChild(p)}}function detail(d,id){var t=track(id),s=read(stateKey(d),{});screen.innerHTML='';var b=n('button','back','‹ Vandaag');b.onclick=function(){renderDay(d)};screen.appendChild(b);screen.appendChild(n('div','eye',country(t.identity.country)+' · '+t.identity.releaseYear));screen.appendChild(n('h1','',t.identity.title));screen.appendChild(n('h3','muted',t.identity.artist));var sp=n('button','btn','▶ Open in Spotify');sp.onclick=function(){window.location.href=spotifyUrl(t)};screen.appendChild(sp);var why=n('section','panel');why.appendChild(n('div','eye','Waarom voor jou?'));why.appendChild(n('div','intro',t.editorial&&t.editorial.whyForYou||'Geselecteerd vanuit je opgebouwde Ontdek-DNA.'));screen.appendChild(why);var r=n('section','panel');r.appendChild(n('div','eye','Jouw oordeel'));r.appendChild(n('h3','','Wat vond je ervan?'));var g=n('div','ratings');['raak','goed','twijfel','nee'].forEach(function(v){var x=n('button','rate',labels[v]);x.onclick=function(){s[id]={rating:v,ratedAt:new Date().toISOString()};write(stateKey(d),s);renderDay(d)};g.appendChild(x)});r.appendChild(g);screen.appendChild(r)}function render(){var d=cycleDay(new Date());if(d===0){document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY_WEEK;screen.innerHTML='';var w=n('section','notice');w.appendChild(statusCircle(3));w.appendChild(n('div','eye','Klaar voor de eerste echte week'));w.appendChild(n('h1','',DISPLAY_WEEK+' start zondag'));w.appendChild(n('div','intro','Vanaf zondag 30 augustus staan hier iedere dag precies drie nieuwe ontdekkingen klaar. Zaterdag 5 september sluit je de week af met de laatste drie en daarna je eerste feestelijke cadeau.'));screen.appendChild(w);return}if(d===8){document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY_WEEK;screen.innerHTML='';var w=n('section','notice');w.appendChild(statusCircle(0));w.appendChild(n('div','eye','Week afgerond'));w.appendChild(n('h1','','21 beoordelingen beschikbaar'));w.appendChild(n('div','intro',DISPLAY_WEEK+' is compleet. De positieve oogst is klaar voor het zaterdagcadeau.'));var gift=n('button','btn','🎁 Open mijn '+DISPLAY_WEEK+'-cadeau');gift.onclick=function(){location.href='zaterdagcadeau.html'};w.appendChild(gift);screen.appendChild(w);return}renderDay(d)}render()})();</script></body></html>
