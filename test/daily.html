<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>Music DNA</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11);--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(48px + env(safe-area-inset-bottom,0px))}.top{text-align:center;margin-bottom:24px}.mark{width:52px;height:52px;border:1.5px solid var(--g);border-radius:50%;display:grid;place-items:center;font-size:24px;margin:0 auto 8px}.eye,.status{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.muted{color:var(--m)}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h2{font-size:22px;margin:4px 0 8px}h3{font-size:20px;margin:0 0 6px}.intro{font-size:17px;line-height:1.48}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.meta{font-size:15px;color:#bbc7c1;margin-top:8px;line-height:1.45}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:13px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px;color:#d1f7dc}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b;cursor:pointer}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 14px;cursor:pointer}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700}.trackbar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:8px 0 16px}.trackbar div{height:100%;background:var(--g)}.notice{text-align:center;padding:36px 8px}.notice .mark{width:64px;height:64px}.warn{color:var(--warn)}.small{font-size:14px;line-height:1.5}.footer{text-align:center;color:#718078;font-size:12px;margin-top:28px}</style></head><body><main class="app"><div class="top"><div class="mark">♫</div><div class="eye">Ben's Music DNA</div><div class="muted" id="cycleLabel">Ontdek-DNA · productie</div></div><div id="screen"></div><div class="footer">3 per dag · 21 per week · alleen +1/+2 naar zaterdag</div></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-candidates-w36-v1.js"></script><script src="music-dna-learning-v1.js"></script><script src="music-dna-positive-bank-v1.js"></script><script src="music-dna-selector-v1.js"></script><script>(function(){var screen=document.getElementById('screen'),labels={raak:'❤️ Raak',goed:'👍 Goed',twijfel:'😐 Twijfel',nee:'👎 Nee'};var START=new Date(2026,7,29,0,0,0),END=new Date(2026,8,5,0,0,0),WEEK='2026-W36';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function n(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function track(id){return MUSIC_DNA_W36_CANDIDATES.tracks[id]||MUSIC_DNA_W35_CANDIDATES.tracks[id]||MUSIC_DNA_DB.tracks[id]}function country(c){var m={'United States':'Verenigde Staten','United Kingdom':'Verenigd Koninkrijk','Sweden':'Zweden','Norway':'Noorwegen','Australia':'Australië','Ireland':'Ierland','Canada':'Canada','Mexico':'Mexico'};return m[c]||c||'Onbekend'}function cycleDay(now){if(now<START)return 0;if(now>=END)return 8;return Math.floor((now-START)/86400000)+1}function stateKey(day){return 'bmd-week-'+WEEK+'-day'+day+'-v1'}function selectionKey(day){return 'bmd-week-'+WEEK+'-day'+day+'-selection-v1'}function allExcluded(){var out={};var model=MUSIC_DNA_LEARNING.read(),signals=model.signals||{};for(var id in signals)out[id]=true;for(var d=1;d<=7;d++){var x=read(selectionKey(d),null);if(x&&x.ids)for(var i=0;i<x.ids.length;i++)out[x.ids[i]]=true}return Object.keys(out)}function getSelection(day){var sel=read(selectionKey(day),null);if(sel&&sel.ids&&sel.ids.length===3)return sel;var chosen=MUSIC_DNA_SELECTOR.chooseBatch(MUSIC_DNA_W36_CANDIDATES.tracks,{size:3,excludeIds:allExcluded()});sel={ids:chosen.map(function(x){return x.id}),createdAt:new Date().toISOString(),signalCount:MUSIC_DNA_SELECTOR.buildProfile().count,reserveMode:chosen.reserveMode&&chosen.reserveMode.mode||'normal'};write(selectionKey(day),sel);return sel}function spotifyUrl(t){return t.spotifyUrl||('https://open.spotify.com/search/'+encodeURIComponent(t.identity.title+' '+t.identity.artist))}function renderDay(day){document.getElementById('cycleLabel').textContent='Ontdek-DNA · W36 · Dag '+day+' van 7';var sel=getSelection(day),ids=sel.ids,s=read(stateKey(day),{}),done=ids.filter(function(id){return s[id]&&s[id].rating}).length;screen.innerHTML='';screen.appendChild(n('div','eye','Vandaag'));screen.appendChild(n('h1','','Jouw 3 ontdekkingen'));screen.appendChild(n('div','intro','Drie nieuwe nummers voor de playlist van volgende zaterdag.'));var p=n('section','panel');p.appendChild(n('div','eye','Weekritme'));p.appendChild(n('div','small','Dag '+day+' van 7 · '+done+' van 3 beoordeeld · selectormodus '+(sel.reserveMode||'normal')+'.'));screen.appendChild(p);var bar=n('div','trackbar'),fill=n('div');fill.style.width=(done/3*100)+'%';bar.appendChild(fill);screen.appendChild(bar);if(ids.length<3){var w=n('section','panel');w.appendChild(n('h2','warn','Kandidatenvoorraad aanvullen'));w.appendChild(n('div','small muted','Er zijn minder dan drie nog niet beoordeelde kandidaten beschikbaar. Er wordt niets dubbel aangeboden.'));screen.appendChild(w);return}ids.forEach(function(id,i){var t=track(id),c=n('section','card'),r=s[id]&&s[id].rating;c.appendChild(n('div','status',r?'✓ BEOORDEELD':(i+1)+' VAN 3 · NOG TE ONTDEKKEN'));c.appendChild(n('h3','',t.identity.title));c.appendChild(n('div','muted',t.identity.artist));c.appendChild(n('div','meta',country(t.identity.country)+' · '+t.identity.releaseYear+' · '+t.identity.albumOrRelease));var tags=n('div','tags'),st=(t.taxonomy&&t.taxonomy.allMusicStyles)||[];(st.length?st:t.discoverDNA.dnaRoute.slice(0,2)).slice(0,2).forEach(function(x){tags.appendChild(n('span','tag',x))});c.appendChild(tags);if(r)c.appendChild(n('div','meta',labels[r]));c.onclick=function(){detail(day,id)};screen.appendChild(c)});if(done===3){var doneCard=n('section','panel');doneCard.appendChild(n('div','eye','Vandaag voltooid'));doneCard.appendChild(n('h2','','3 signalen toegevoegd'));doneCard.appendChild(n('div','small muted','Morgen staan weer drie nieuwe ontdekkingen klaar. Zaterdag telt de motor alle +1/+2 van deze week op en vult waar nodig aan uit de positieve reserve.'));screen.appendChild(doneCard)}}function detail(day,id){var t=track(id),s=read(stateKey(day),{});screen.innerHTML='';var b=n('button','back','‹ Vandaag');b.onclick=function(){renderDay(day)};screen.appendChild(b);screen.appendChild(n('div','eye',country(t.identity.country)+' · '+t.identity.releaseYear));screen.appendChild(n('h1','',t.identity.title));screen.appendChild(n('h3','muted',t.identity.artist));var sp=n('button','btn','▶ Open in Spotify');sp.onclick=function(){window.location.href=spotifyUrl(t)};screen.appendChild(sp);var why=n('section','panel');why.appendChild(n('div','eye','Waarom voor jou?'));why.appendChild(n('div','intro',t.editorial&&t.editorial.whyForYou||'Geselecteerd vanuit je opgebouwde Ontdek-DNA.'));screen.appendChild(why);var r=n('section','panel');r.appendChild(n('div','eye','Jouw oordeel'));r.appendChild(n('h3','','Wat vond je ervan?'));var g=n('div','ratings');['raak','goed','twijfel','nee'].forEach(function(v){var x=n('button','rate',labels[v]);x.onclick=function(){s[id]={rating:v,ratedAt:new Date().toISOString()};write(stateKey(day),s);renderDay(day)};g.appendChild(x)});r.appendChild(g);screen.appendChild(r)}function render(){var now=new Date(),d=cycleDay(now);if(d===0){document.getElementById('cycleLabel').textContent='Ontdek-DNA · W36';screen.innerHTML='';var w=n('section','notice');w.appendChild(n('div','mark','✓'));w.appendChild(n('div','eye','Klaar voor de eerste echte week'));w.appendChild(n('h1','','W36 start zaterdag'));w.appendChild(n('div','intro','Vanaf zaterdag 29 augustus staan hier iedere dag precies drie nieuwe ontdekkingen klaar. De validatie blijft als startgeheugen actief. De voorraad voor alle 21 nummers is gecontroleerd.'));screen.appendChild(w);return}if(d===8){document.getElementById('cycleLabel').textContent='Ontdek-DNA · W36';screen.innerHTML='';var w=n('section','notice');w.appendChild(n('div','mark','✓'));w.appendChild(n('div','eye','Week afgerond'));w.appendChild(n('h1','','21 beoordelingen beschikbaar'));w.appendChild(n('div','intro','De zaterdagmotor kan nu de definitieve positieve playlist samenstellen.'));screen.appendChild(w);return}renderDay(d)}render();})();</script></body></html>
