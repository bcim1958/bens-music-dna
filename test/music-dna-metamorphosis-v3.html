push({ang,rad,sx:.5+Math.cos(ang)*rad,sy:.48+Math.sin(ang)*rad*.56,sz:.02+Math.random()*.16,tx:h.x,ty:h.y,tz:h.z,img:imgs[i%imgs.length],rot:(Math.random()-.5)*.7,delay:Math.random()*.22,drift:(Math.random()-.5)*.018})}const start=performance.now(),DUR=48000;function hole(t){let appear=smooth(clamp(t/.11)),leave=1-smooth(clamp((t-.22)/.16)),a=appear*leave;if(a<=.001)return;ctx.save();ctx.translate(W*.5,H*.48);ctx.scale(1,.47);let R=Math.min(W,H)*.34;ctx.globalCompositeOperation='screen';for(let k=0;k<8;k++){ctx.beginPath();ctx.arc(0,0,R*(.52+k*.055),0,Math.PI*2);ctx.strokeStyle=k%3===0?'rgba(255,116,116,'+(.10*a)+')':k%3===1?'rgba(220,80,255,'+(.12*a)+')':'rgba(105,120,255,'+(.08*a)+')';ctx.lineWidth=R*(.10-k*.006);ctx.shadowBlur=28;ctx.shadowColor='#d755ff';ctx.stroke()}ctx.globalCompositeOperation='source-over';let g=ctx.createRadialGradient(0,0,R*.05,0,0,R*.5);g.addColorStop(0,'#000');g.addColorStop(.7,'#000');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R*.56,0,Math.PI*2);ctx.fill();ctx.restore()}function draw(now){let t=clamp((now-start)/DUR);ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.65);bg.addColorStop(0,'#07100d');bg.addColorStop(.48,'#020504');bg.addColorStop(1,'#000');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);hole(t);let arrival=smooth(clamp((t-.07)/.34)),organize=smooth(clamp((t-.38)/.42)),light=smooth(clamp((t-.76)/.20));let order=P.map((p,i)=>({p,i,z:p.sz+(p.tz-p.sz)*organize})).sort((a,b)=>a.z-b.z);for(const o of order){let p=o.p,local=smooth(clamp((arrival-p.delay)/(1-p.delay))),org=smooth(clamp((organize-p.delay*.24)/(1-p.delay*.24)));if(local<=.001)continue;let emergence=1-smooth(clamp((local-.05)/.95));let originX=.5+Math.cos(p.ang)*p.rad*(.12+.88*local),originY=.48+Math.sin(p.ang)*p.rad*.56*(.12+.88*local);let x=(originX+(p.tx-originX)*org+p.drift*Math.sin(t*8+o.i))*W,y=(originY+(p.ty-originY)*org)*H;let depth=.25+.75*(p.sz+(p.tz-p.sz)*org),base=Math.min(W,H)*(.011+.0
