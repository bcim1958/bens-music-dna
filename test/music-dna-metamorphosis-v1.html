<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · metamorphosis v1</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#07100c 0,#020403 48%,#000 82%)}#c{position:absolute;inset:0;width:100%;height:100%}.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 40%,rgba(0,0,0,.4) 74%,rgba(0,0,0,.88) 100%)}.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(18px,2vw,28px);letter-spacing:.03em;color:#dbe7df;opacity:0;text-shadow:0 3px 20px #000;animation:hint 30s both}.controls{position:fixed;right:18px;bottom:16px;z-index:20}.controls button{background:#07100c;color:#fff;border:1px solid #41584b;border-radius:999px;padding:9px 14px}@keyframes hint{0%,72%{opacity:0}78%,91%{opacity:.72}100%{opacity:0}}</style></head><body><div class="stage"><canvas id="c"></canvas><div class="veil"></div><div class="hint">Uit muziek ontstaat een patroon.</div></div><div class="controls"><button onclick="location.reload()">↻ opnieuw</button></div><script src="music-dna-candidates-w36-v1.js"></script><script>(async()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,D=window.devicePixelRatio||1;function size(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);const tracks=Object.values(MUSIC_DNA_W36_CANDIDATES.tracks),imgs=[];async function art(x){try{let r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(x.spotifyUrl)),j=await r.json(),im=new Image();im.crossOrigin='anonymous';im.src=j.thumbnail_url;await im.decode();return im}catch(e){return null}}for(const t of tracks){let im=await art(t);if(im)imgs.push(im)}if(!imgs.length)return;const N=180,pts=[];function targets(i){const half=i%2,step=Math.floor(i/2),n=Math.ceil(N/2),u=step/(n-1),y=.12+.76*u,phase=u*Math.PI*5.1,x=.5+(half?1:-1)*(.14*Math.sin(phase)+.018);return[x,y]}for(let i=0;i<N;i++){let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.65)*.48;let [tx,ty]=targets(i);pts.push({x:.5+Math.cos(a)*r,y:.5+Math.sin(a)*r*.72,tx,ty,s:.022+Math.random()*.018,im:imgs[i%imgs.length],rot:(Math.random()-.5)*.3})}const start=performance.now(),dur=30000;function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}function frame(now){let t=Math.min(1,(now-start)/dur);ctx.clearRect(0,0,W,H);let form=Math.max(0,Math.min(1,(t-.23)/.45)),e=ease(form),glow=Math.max(0,Math.min(1,(t-.64)/.24));for(let i=0;i<N;i++){let p=pts[i],x=(p.x+(p.tx-p.x)*e)*W,y=(p.y+(p.ty-p.y)*e)*H,sz=p.s*Math.min(W,H)*(1-.32*e);ctx.save();ctx.translate(x,y);ctx.rotate(p.rot*(1-e));if(glow){ctx.shadowBlur=18*glow;ctx.shadowColor=i%2?'#d83cff':'#ff7a18';ctx.globalAlpha=1-.35*glow}ctx.drawImage(p.im,-sz/2,-sz/2,sz,sz);ctx.restore()}if(glow>.05){ctx.save();ctx.globalCompositeOperation='screen';ctx.lineCap='round';ctx.lineWidth=3+8*glow;let grad=ctx.createLinearGradient(W*.32,0,W*.68,0);grad.addColorStop(0,'#ff8a00');grad.addColorStop(.5,'#d52cff');grad.addColorStop(1,'#28a8ff');ctx.strokeStyle=grad;ctx.globalAlpha=.12+.65*glow;for(let side of [-1,1]){ctx.beginPath();for(let j=0;j<160;j++){let u=j/159,y=H*(.12+.76*u),x=W*(.5+side*(.14*Math.sin(u*Math.PI*5.1)+.018));j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ctx.restore()}if(t<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
