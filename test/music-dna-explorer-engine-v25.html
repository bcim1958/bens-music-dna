<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNA Explorer — Engine 25</title><style>
:root{--ink:#f5f0e8;--muted:#aaa7b6;--gold:#e6b65d;--line:#302d43;--panel:#10111c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#342044,#090a15 34%,#05060c 82%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:14px 13px 105px}.top{display:flex;justify-content:space-between;padding:5px 2px 10px}.brand{font-weight:900;letter-spacing:.12em}.brand b,.eyebrow{color:var(--gold)}.small{font-size:.76rem;color:var(--muted)}.crumbs{display:flex;gap:5px;overflow:auto;white-space:nowrap;padding:4px 1px 12px;font-size:.75rem}.crumbs button{border:0;background:none;color:var(--muted);padding:0}.crumbs button:last-child{color:var(--ink);font-weight:800}.card{border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#151426,#0a0b13);padding:20px}.eyebrow{font-size:.68rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(2.45rem,11vw,4.7rem)/.95 Georgia,serif;margin:.13em 0 .18em}h2{font:700 1.35rem/1.1 Georgia,serif;margin:.4em 0}.lead{color:#ded9e4;margin:0 0 14px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.fact{background:#0d0e17;border:1px solid var(--line);border-radius:15px;padding:10px}.fact b,.fact span{display:block}.fact span{font-size:.72rem;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#10111c;color:var(--ink);border-radius:999px;padding:9px 12px}.tab.on{border-color:var(--gold);color:var(--gold)}.section{border-top:1px solid var(--line);padding-top:14px}.doors{display:grid;gap:9px}.door{border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--ink);padding:13px;text-align:left}.door span,.door strong{display:block}.door span{font-size:.76rem;color:var(--muted)}.story p{color:#e3dfe7}.take{border-left:3px solid var(--gold);padding-left:12px;margin:18px 0}.source{display:block;color:#b8b2c2;text-decoration:none;border:1px dashed #494052;border-radius:15px;padding:11px;font-size:.82rem}.source-note{font-size:.72rem;color:var(--muted);margin:7px 2px 0}.source-card{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:14px;margin-top:10px}.source-card h2{margin:.15em 0 .35em}.source-meta{font-size:.76rem;color:var(--muted);margin-bottom:10px}.source-card ul{margin:8px 0 12px;padding-left:20px;color:#e3dfe7}.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 18px));display:grid;grid-template-columns:1fr 1fr;background:#080914ef;border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(14px)}.bottom button{border:0;background:none;color:var(--ink);padding:10px}.bottom button:last-child{text-align:right;color:var(--gold)}
</style></head><body><main class="app"><header class="top"><div class="brand"><b>⌁</b> DNA EXPLORER</div><div class="small">ENGINE 25</div></header><div class="crumbs" id="crumbs"></div><div id="view"></div></main><nav class="bottom"><button onclick="back()">← Eén stap terug</button><button onclick="home()">⌂ Ghost</button></nav><script src="music-dna-explorer-graph-v16.js"></script><script>
const G=window.MUSIC_DNA_EXPLORER_GRAPH_V1;
Object.assign(G.nodes,{
skeleta:{type:"album",name:"Skeletá",eyebrow:"Studioalbum · 2025",orientation:"Het zesde studioalbum van Ghost."},
meliora:{type:"album",name:"Meliora",eyebrow:"Studioalbum · 2015",orientation:"Het derde studioalbum van Ghost."},
infestissumam:{type:"album",name:"Infestissumam",eyebrow:"Studioalbum · 2013",orientation:"Het tweede studioalbum van Ghost."},
opus:{type:"album",name:"Opus Eponymous",eyebrow:"Studioalbum · 2010",orientation:"Het debuutalbum van Ghost."}
});let path=[{kind:"artist",id:"ghost",label:"Ghost"}],tab="overview";
const ghostTabs={overview:"Overzicht",music:"Muziek",people:"Mensen",stories:"Verhalen",relations:"Verwantschap"};
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function crumbs(){document.getElementById("crumbs").innerHTML=path.map((x,i)=>'<button onclick="jump('+i+')">'+(i?'› ':'')+esc(x.label)+'</button>').join("")}
function jump(i){path=path.slice(0,i+1);let x=path[path.length-1];if(x.kind==="tab")tab=x.id;render()}
function home(){path=[{kind:"artist",id:"ghost",label:"Ghost"}];tab="overview";render()}
function back(){if(path.length>1){path.pop();let x=path[path.length-1];if(x.kind==="tab")tab=x.id;render()}}
function openTab(id){tab=id;path=[path[0],{kind:"tab",id,label:ghostTabs[id]}];render()}
function openNode(id){let n=G.nodes[id];if(!n)return;path.push({kind:n.type==="story"?"story":(n.type==="album"?"album":"node"),id,label:n.name});render()}
function openTrack(id){const tracks={rats:"Rats",dance:"Dance Macabre",faith:"Faith",life:"Life Eternal"};path.push({kind:"track",id,label:tracks[id]||id});render()}
function openShelf(id){const names={live:"Live",ep:"EP’s",single:"Singles",comp:"Compilaties"};path.push({kind:"shelf",id,label:names[id]});render()}
function teaser(id,rel,txt){let n=G.nodes[id];return '<button class="door" onclick="openNode(\''+id+'\')"><span>'+esc(rel)+'</span><strong>'+esc(n.name)+' →</strong><span>'+esc(txt)+'</span></button>'}
function tabs(){return '<div class="tabs">'+Object.entries(ghostTabs).map(([id,l])=>'<button class="tab '+(tab===id?"on":"")+'" onclick="openTab(\''+id+'\')">'+l+'</button>').join("")+'</div>'}
function artist(){let body='';if(tab==="overview")body='<div class="facts"><div class="fact"><span>Herkomst</span><b>Zweden</b></div><div class="fact"><span>Actief</span><b>sinds 2006</b></div><div class="fact"><span>Kernfiguur</span><b>Tobias Forge</b></div><div class="fact"><span>DNA-anker</span><b>Rats</b></div></div><div class="section"><div class="eyebrow">In één oogopslag</div><p>Ghost combineert theatrale hardrock en metal met een sterk melodisch karakter. Tobias Forge is de centrale maker; albums, podiumfiguren en uiteenlopende invloeden vormen samen de wereld rond de band.</p></div>';
if(tab==="music")body='<div class="section"><div class="eyebrow">Studioalbums · nieuwste eerst</div><div class="doors">'+
teaser("skeleta","studioalbum · 2025","Het zesde studioalbum van Ghost.")+
teaser("impera","studioalbum · 2022","Het vijfde studioalbum; hier liggen ook sporen naar Fredrik Åkesson en Klas Åhlund.")+
teaser("prequelle","studioalbum · 2018","Het vierde studioalbum; hier staat Rats op, een track uit jouw Music DNA.")+
teaser("meliora","studioalbum · 2015","Het derde studioalbum van Ghost.")+
teaser("infestissumam","studioalbum · 2013","Het tweede studioalbum van Ghost.")+
teaser("opus","studioalbum · 2010","Het debuutalbum van Ghost.")+
'</div><div class="eyebrow" style="margin-top:18px">Andere uitgaven</div><div class="doors"><button class="door" onclick="openShelf(\'live\')"><span>aparte plank</span><strong>Live →</strong><span>Livealbums en live-uitgaven.</span></button><button class="door" onclick="openShelf(\'ep\')"><span>aparte plank</span><strong>EP’s →</strong><span>EP-uitgaven los van de studioalbums.</span></button><button class="door" onclick="openShelf(\'single\')"><span>aparte plank</span><strong>Singles →</strong><span>Singles zonder de albumstructuur te vermengen.</span></button><button class="door" onclick="openShelf(\'comp\')"><span>aparte plank</span><strong>Compilaties →</strong><span>Verzameluitgaven apart gehouden.</span></button></div></div>';
if(tab==="people")body='<div class="section"><div class="eyebrow">Mensen</div><div class="doors">'+teaser("forge","maker","Centrale songwriter, zanger en bedenker achter Ghost.")+teaser("akesson","studiomuzikant","Opeth-gitarist die de gitaren op Impera inspeelde.")+teaser("ahlund","producer/songwriter","Producer en medecomponist op Impera.")+'</div></div>';
if(tab==="stories")body='<div class="section"><div class="eyebrow">Kies zelf hoeveel je wilt lezen</div><div class="doors">'+teaser("maiden-story","samen op tour","Forge bestudeerde Maiden als jongen; in 2017 trok Ghost met de band door Noord-Amerika.")+teaser("metallica-story","tour + cover","Van jeugdvoorbeeld en stadiontour naar Ghosts eigen Enter Sandman.")+teaser("singer-story","bijna een andere zanger","Meerdere beoogde zangers zeiden nee voordat Forge zelf achter de microfoon belandde.")+'</div></div>';
if(tab==="relations")body='<div class="section"><div class="eyebrow">Onderbouwde verbindingen</div><div class="doors">'+teaser("sabbath","invloed + jouw DNA","Een vroege zware-rockbron én aanwezig in Band DNA playlist Ghost.")+teaser("abba","songwriting","Forge heeft ABBA expliciet genoemd als belangrijke songwriting-invloed.")+teaser("sweden","tijd & plaats","De geografische context opent een andere Zweedse muziekwereld.")+'</div></div>';
return '<section class="card"><div class="eyebrow">Artiest · direct overzicht</div><h1>Ghost</h1><p class="lead">Eerst de zekere kern. De diepte kies je zelf.</p>'+tabs()+body+'</section>'}
function node(id){let n=G.nodes[id];if(n.type==="story")return story(n);return '<section class="card"><div class="eyebrow">'+esc(n.eyebrow||n.type)+'</div><h1>'+esc(n.name)+'</h1><p class="lead">'+esc(n.orientation)+'</p><div class="section"><div class="eyebrow">Verder vanaf hier</div><p class="small">Dit is een proef van de navigatielogica. Gebruik de terugweg of de broodkruimel om een andere diepte te kiezen.</p></div></section>'}
function album(id){let n=G.nodes[id];if(id!=="prequelle")return '<section class="card"><div class="eyebrow">'+esc(n.eyebrow)+'</div><h1>'+esc(n.name)+'</h1><p class="lead">Albumoverzicht. De volledige tracklijst wordt op dezelfde vaste manier opgebouwd.</p></section>';
return '<section class="card"><div class="eyebrow">Studioalbum · 2018</div><h1>Prequelle</h1><p class="lead">Ghost · vierde studioalbum</p><div class="facts"><div class="fact"><span>Uitgebracht</span><b>2018</b></div><div class="fact"><span>Type</span><b>Studioalbum</b></div></div><div class="section"><div class="eyebrow">Tracks · albumvolgorde</div><div class="doors"><button class="door"><span>01</span><strong>Ashes</strong></button><button class="door" onclick="openTrack(\'rats\')"><span>02 · ◆ Music DNA</span><strong>Rats →</strong><span>Open de track voor context en verdere sporen.</span></button><button class="door"><span>03</span><strong>Faith</strong></button><button class="door"><span>04</span><strong>See the Light</strong></button><button class="door"><span>05</span><strong>Miasma</strong></button><button class="door"><span>06</span><strong>Dance Macabre</strong></button><button class="door"><span>07</span><strong>Pro Memoria</strong></button><button class="door"><span>08</span><strong>Witch Image</strong></button><button class="door"><span>09</span><strong>Helvetesfönster</strong></button><button class="door"><span>10</span><strong>Life Eternal</strong></button></div></div></section>'}
function track(id){if(id!=="rats")return "";return '<section class="card"><div class="eyebrow">Track · Prequelle · 2018</div><h1>Rats</h1><p class="lead">Track 2 · Ghost</p><div class="facts"><div class="fact"><span>Album</span><b>Prequelle</b></div><div class="fact"><span>Music DNA</span><b>◆ aanwezig</b></div></div><div class="section"><div class="eyebrow">In het kort</div><p>Rats is de eerste volledige song op Prequelle, na de korte opener Ashes. Tobias Forge schreef het nummer bewust als een grote, directe live-opener. Het pestbeeld werkt tegelijk als metafoor voor ideeën en gedrag die zich razendsnel verspreiden.</p></div><div class="section"><div class="eyebrow">Kies je verdieping</div><div class="doors"><button class="door" onclick="openTrackStory()"><span>ⓘ verhaal achter het nummer</span><strong>Waarom Rats meer is dan ratten →</strong><span>Over de pestmetafoor, publieke veroordeling en de gewenste stadionenergie.</span></button><button class="door" onclick="openNode(\'forge\')"><span>maker</span><strong>Tobias Forge →</strong><span>Naar de persoon achter Ghost.</span></button><button class="door" onclick="jump(path.length-2)"><span>albumcontext</span><strong>Prequelle →</strong><span>Terug naar het album en de volledige tracklijst.</span></button></div></div></section>'}
function openTrackStory(){path.push({kind:"trackstory",id:"rats-story",label:"Verhaal"});render()}
function trackStory(){return '<section class="card story"><div class="eyebrow">Nummerverhaal · Rats</div><h1>Waarom Rats meer is dan ratten</h1><p class="lead">De pest als beeld voor iets dat zich razendsnel door een samenleving verspreidt.</p><p>Bij Rats gebruikte Tobias Forge de builenpest niet simpelweg als historisch decor. Hij legde uit dat het nummer in wezen gaat over iets dat zich als een lopend vuur verspreidt en sneller schade aanricht dan mensen beseffen. De ratten functioneren daarbij als herkenbaar beeld voor besmetting en dreiging.</p><p>Forge verbond dat idee ook aan moderne publieke veroordeling. In interviews rond Prequelle sprak hij over de snelheid waarmee overtuigingen, beschuldigingen en groepsgedrag zich kunnen verspreiden, vooral online. Daarmee sluit Rats aan op het bredere thema van Prequelle: sterfelijkheid, rampspoed en overleven in onrustige tijden.</p><p>Muzikaal had Forge eveneens een heel concreet doel. Hij wilde een nummer dat onmiddellijk als grote opener kon werken. Een jeugdherinnering aan Ozzy Osbourne die I Don’t Know speelde tijdens het Moscow Music Peace Festival van 1989 diende als voorbeeld voor die energie: een nummer dat vanaf de eerste momenten een enorm publiek in beweging kan krijgen.</p><div class="take"><b>Kort samengevat</b><br>Rats koppelt een pestmetafoor aan moderne besmetting van ideeën en werd tegelijk bewust ontworpen als explosieve live-opener.</div><button class="source" onclick="openSources()"><b>ⓘ Bronnen geraadpleegd · bronnenregister</b><br><span class="small">Hoe weten we dit? Bekijk de bewijslaag zonder DNA Explorer te verlaten.</span></button></section>'}
function openSources(){path.push({kind:"sources",id:"rats-sources",label:"Bronnen"});render()}
function sources(){return '<section class="card"><div class="eyebrow">Bronnenregister · Rats</div><h1>Hoe weten we dit?</h1><p class="lead">De bewijslaag achter het verhaal. Alleen als je zelf verder wilt lezen, ga je vanaf hier naar de oorspronkelijke publicatie.</p><div class="source-card"><div class="eyebrow">Bron 1 · interview</div><h2>Ghost Mastermind Tobias Forge Reports From Studio in First “Unmasked” U.S. Interview</h2><div class="source-meta">Revolver · Steve Appleford · 2 februari 2018</div><div class="small">Onderbouwt onder meer:</div><ul><li>de pest als bredere metafoor voor iets dat zich snel verspreidt;</li><li>de koppeling van Prequelle aan middeleeuwse én actuele maatschappelijke thema’s;</li><li>Forge’s vergelijking met snelle publieke veroordeling en online gedrag.</li></ul><a class="source" href="https://www.revolvermag.com/music/ghost-mastermind-tobias-forge-reports-studio-first-unmasked-us-interview/" target="_blank" rel="noopener noreferrer">↗ Originele publicatie · Revolver</a></div><div class="source-card"><div class="eyebrow">Bron 2 · interview</div><h2>Exclusive: Tobias Forge Talks Ghost’s New Song ‘Rats’ + New Album</h2><div class="source-meta">Loudwire · Brian Ives · 7 april 2018</div><div class="small">Onderbouwt onder meer:</div><ul><li>dat Rats bewust als grote, directe openingstrack werd ontworpen;</li><li>Forge’s jeugdherinnering aan Ozzy Osbourne met I Don’t Know op het Moscow Peace Festival;</li><li>de gewenste stadionenergie: een nummer dat een zeer groot publiek meteen in beweging kan krijgen.</li></ul><a class="source" href="https://loudwire.com/ghost-tobias-forge-ghost-new-song-rats-new-album/" target="_blank" rel="noopener noreferrer">↗ Originele publicatie · Loudwire</a></div><div class="source-note">← Eén stap terug brengt je rechtstreeks terug naar het Rats-verhaal.</div></section>'}
function shelf(id){const names={live:"Live",ep:"EP’s",single:"Singles",comp:"Compilaties"};return '<section class="card"><div class="eyebrow">Andere uitgaven</div><h1>'+names[id]+'</h1><p class="lead">Deze categorie staat bewust los van de studioalbums. De volledige inhoud volgt na de structuurproef.</p></section>'}
function story(n){return '<section class="card story"><div class="eyebrow">'+esc(n.eyebrow)+'</div><h1>'+esc(n.name)+'</h1><div class="small">'+esc(n.publisher)+' · '+esc(n.readtime)+'</div><h2>'+esc(n.title)+'</h2>'+n.summary.map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="take"><b>Kort samengevat</b><br>'+esc(n.takeaway)+'</div><a class="source" href="'+n.url+'" target="_blank" rel="noopener noreferrer" onclick="rememberExplorer()">↗ Externe bron · oorspronkelijke publicatie</a><div class="source-note">Extra leesvoer buiten DNA Explorer. Je route blijft hier bewaard.</div></section>'}
function rememberExplorer(){try{sessionStorage.setItem("dnaExplorer24",JSON.stringify({path,tab,scrollY:window.scrollY}))}catch(e){}}
function restoreExplorer(){try{const s=JSON.parse(sessionStorage.getItem("dnaExplorer24")||"null");if(s&&Array.isArray(s.path)&&s.path.length){path=s.path;tab=s.tab||tab;return s.scrollY||0}}catch(e){}return 0}
const restoreY=restoreExplorer();
function render(){crumbs();let x=path[path.length-1];document.getElementById("view").innerHTML=(x.kind==="artist"||x.kind==="tab")?artist():(x.kind==="shelf"?shelf(x.id):(x.kind==="album"?album(x.id):(x.kind==="track"?track(x.id):(x.kind==="trackstory"?trackStory():(x.kind==="sources"?sources():node(x.id))))));scrollTo(0,0)}render();if(restoreY)requestAnimationFrame(()=>scrollTo(0,restoreY));
</script></body></html>
