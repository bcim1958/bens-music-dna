<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNA Explorer — Edge Integrity Gate v2</title><style>body{font:16px/1.5 system-ui;background:#080914;color:#f5f0e8;max-width:760px;margin:auto;padding:24px}.pass{color:#91df8c}.fail{color:#ff8d8d}li{margin:8px 0}</style></head><body><h1>DNA Explorer · Edge Integrity Gate v2</h1><div id="out">Controleren…</div><script src="music-dna-explorer-graph-v4.js"></script><script>
const G=window.MUSIC_DNA_EXPLORER_GRAPH_V1,problems=[],edges=[];
for(const [from,n] of Object.entries(G.nodes)){for(const to of [...(n.primary||[]),...(n.doors||[])]){const edge=from+">"+to;edges.push(edge);if(!G.nodes[to])problems.push("Ontbrekend doel: "+edge);if(!G.relations[edge])problems.push("Geen expliciete relatie: "+edge)}}
for(const edge of Object.keys(G.relations)){const [from,to]=edge.split(">");if(!G.nodes[from]||!G.nodes[to])problems.push("Relatie met onbekend knooppunt: "+edge)}
const duplicates=edges.filter((x,i,a)=>a.indexOf(x)!==i);if(duplicates.length)problems.push("Dubbele deurverwijzing: "+[...new Set(duplicates)].join(", "));
document.getElementById("out").innerHTML=problems.length?'<h2 class="fail">FAIL · '+problems.length+'</h2><ul>'+problems.map(x=>'<li>'+x+'</li>').join("")+'</ul>':'<h2 class="pass">PASS</h2><p><b>'+Object.keys(G.nodes).length+'</b> knooppunten · <b>'+edges.length+'</b> deurverwijzingen · alle zichtbare deuren hebben een bestaand doel en expliciete edge.</p><p>Dit is een structurele gate; inhoudelijke bronkwaliteit blijft een afzonderlijke toets.</p>';
</script></body></html>
