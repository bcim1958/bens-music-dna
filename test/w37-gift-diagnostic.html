<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06100c"><title>Music DNA · W37 cadeau diagnose</title><style>body{margin:0;background:#06100c;color:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:28px 18px 60px}h1{font-size:28px;margin:0 0 8px}.g{color:#20df68}.muted{color:#a9b5af}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;margin:14px 0}.ok{color:#20df68}.bad{color:#ff827b}.warn{color:#ffd166}.row{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}.row:last-child{border:0}code{font-size:12px;word-break:break-all}button{width:100%;border:0;border-radius:999px;background:#20df68;color:#031009;padding:14px;font-size:16px;font-weight:850;margin-top:12px}</style></head><body><main class="app"><div class="g" style="font-weight:900;letter-spacing:1px">BEN'S MUSIC DNA · DIAGNOSE</div><h1>W37 cadeau — veilige controle</h1><p class="muted">Alleen lezen. Deze pagina maakt geen Spotify-playlist aan en wijzigt geen beoordelingen.</p><div id="out" class="card">Controle wordt uitgevoerd…</div><button onclick="location.href='zaterdagcadeau.html?week=2026-W37'">Terug naar W37-cadeau</button></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-weeks-v1.js"></script><script>(async()=>{const WEEK='2026-W37',out=document.getElementById('out');function read(k,f=null){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}function spotifyId(url){const m=String(url||'').match(/track\/([A-Za-z0-9]+)/);return m?m[1]:''}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const TRACKS={};try{for(const w of MUSIC_DNA_WEEKS.weeks){if(!w.ready&&w.key!==WEEK)continue;await load(w.candidateFile);const obj=window[w.candidateGlobal];if(obj&&obj.tracks)Object.assign(TRACKS,obj.tracks)}if(window.MUSIC_DNA_W35_CANDIDATES&&MUSIC_DNA_W35_CANDIDATES.tracks)Object.assign(TRACKS,MUSIC_DNA_W35_CANDIDATES.tracks);if(window.MUSIC_DNA_DB&&MUSIC_DNA_DB.tracks)Object.assign(TRACKS,MUSIC_DNA_DB.tracks);const selections=[],ratings={};let complete=true;for(let d=1;d<=7;d++){const s=read('bmd-week-'+WEEK+'-day'+d+'-selection-v1',null),st=read('bmd-week-'+WEEK+'-day'+d+'-v1',{});if(!s||!Array.isArray(s.ids)||s.ids.length!==3){complete=false;continue}for(const id of s.ids){selections.push(id);if(st[id]&&st[id].rating)ratings[id]=st[id].rating;else complete=false}}const learning=read('bmd-learning-v1',{signals:{}}),signals=learning.signals||{},history=read('bmd-positive-playlist-history-v1',{weeks:{}}),used={};for(const wk in (history.weeks||{})){for(const id of ((history.weeks[wk]&&history.weeks[wk].ids)||[]))used[id]=(used[id]||0)+1}const candidateSet={};selections.forEach(id=>candidateSet[id]=true);const positives=[];for(const id in signals){const x=signals[id];if(x.rating!=='raak'&&x.rating!=='goed')continue;if(!(x.spotifyResolvedExact&&spotifyId(x.spotifyUrl)))continue;positives.push({...x,trackId:id,playlistUses:used[id]||0})}function rank(r){return r==='raak'?2:r==='goed'?1:0}positives.sort((a,b)=>{const ac=candidateSet[a.trackId]?0:1,bc=candidateSet[b.trackId]?0:1;if(ac!==bc)return ac-bc;if((a.playlistUses||0)!==(b.playlistUses||0))return(a.playlistUses||0)-(b.playlistUses||0);if(rank(a.rating)!==rank(b.rating))return rank(b.rating)-rank(a.rating);return String(b.ratedAt||'').localeCompare(String(a.ratedAt||''))});const gift=positives.slice(0,21),missing=gift.filter(x=>!TRACKS[x.trackId]),badSpotify=gift.filter(x=>TRACKS[x.trackId]&&!spotifyId(TRACKS[x.trackId].spotifyUrl)),stored=read('bmd-gift-'+WEEK+'-v1',null);let html='';html+=`<div class="row"><b>21 beoordelingen:</b> <span class="${complete&&selections.length===21?'ok':'bad'}">${complete&&selections.length===21?'JA':'NEE'} (${selections.length}/21)</span></div>`;html+=`<div class="row"><b>Positief bezorgbaar in leerlaag:</b> ${positives.length}</div>`;html+=`<div class="row"><b>Gereconstrueerd cadeau:</b> <span class="${gift.length===21?'ok':'bad'}">${gift.length}/21</span></div>`;html+=`<div class="row"><b>Ontbrekende brontracks:</b> <span class="${missing.length?'bad':'ok'}">${missing.length}</span></div>`;html+=`<div class="row"><b>Brontracks zonder directe Spotify-ID:</b> <span class="${badSpotify.length?'bad':'ok'}">${badSpotify.length}</span></div>`;html+=`<div class="row"><b>Opgeslagen cadeau aanwezig:</b> ${stored?'JA':'NEE'}</div>`;if(missing.length){html+='<h3 class="bad">Ontbrekende brontrack(s)</h3>';missing.forEach(x=>html+=`<div class="row"><code>${esc(x.trackId)}</code> · ${esc(x.artist)} — ${esc(x.title)} · bank-Spotify: ${spotifyId(x.spotifyUrl)?'OK':'NIET OK'}</div>`)}if(badSpotify.length){html+='<h3 class="bad">Brontrack zonder bruikbare Spotify-ID</h3>';badSpotify.forEach(x=>{const t=TRACKS[x.trackId];html+=`<div class="row"><code>${esc(x.trackId)}</code> · ${esc(t&&t.identity&&t.identity.artist)} — ${esc(t&&t.identity&&t.identity.title)}</div>`})}if(!missing.length&&!badSpotify.length&&gift.length===21){html+='<p class="ok"><b>De 21 cadeau-items zijn in deze controle technisch volledig teruggevonden.</b></p><p class="muted">Als de gewone cadeaupagina toch wacht, zit het verschil waarschijnlijk in de opgeslagen cadeauversie of in de runtime-validatie. Maak dan een screenshot van deze diagnosepagina.</p>'}else{html+='<p class="warn"><b>De veilige wachtstand heeft een concrete datagrond.</b> Bovenstaande regels tonen welke items de gewone cadeaupagina niet veilig kan herleiden.</p>'}out.innerHTML=html}catch(e){out.innerHTML='<span class="bad"><b>Diagnose kon niet worden uitgevoerd:</b> '+esc(e.message)+'</span>'}})();</script></body></html>
