<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>Music DNA · UX proef v2</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(92px + env(safe-area-inset-bottom,0px))}.top{text-align:center;margin-bottom:26px;position:relative}.logo{width:66px;height:66px;margin:auto auto 10px;display:block}.brand{font-size:13px;font-weight:850;letter-spacing:1.3px;color:var(--g);text-transform:uppercase}.settings{position:absolute;right:0;top:4px;border:0;background:none;color:#aebbb5;font-size:22px}.muted{color:var(--m)}.eye{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}h1{font-size:30px;line-height:1.08;margin:5px 0 8px}h2{font-size:22px;margin:5px 0 8px}h3{font-size:19px;margin:0 0 5px}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:21px;padding:17px;margin:12px 0}.card{cursor:pointer}.meta{font-size:14px;color:#bbc7c1;margin-top:7px}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:800;margin:9px 0;background:var(--g);color:#07100b}.secondary{background:rgba(30,215,96,.10);color:#d1f7dc;border:1px solid rgba(30,215,96,.25)}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 14px}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:15px 7px;font-size:15px;font-weight:700}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:6px 9px;border-radius:999px;color:#d1f7dc}.tabs{display:flex;gap:17px;overflow:auto;border-bottom:1px solid var(--l);margin:7px 0 15px}.tabs button{background:none;border:0;color:var(--m);padding:11px 0;white-space:nowrap}.tabs .on{color:var(--g);border-bottom:2px solid var(--g)}.cover{height:185px;border-radius:19px;background:radial-gradient(circle at 50% 30%,#625027,#25170e 47%,#090b0a 76%);display:grid;place-items:center;font-size:42px;font-weight:900;letter-spacing:2px;margin-bottom:15px}.why{font-size:16px;line-height:1.48}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:72px;background:#09100d;border-top:1px solid var(--l);display:flex;justify-content:space-around;padding-top:8px;padding-bottom:env(safe-area-inset-bottom,0)}.nav button{border:0;background:none;color:#84928b;font-size:11px;min-width:72px}.nav b{display:block;font-size:19px;margin-bottom:3px}.nav .on{color:var(--g)}.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);background:#111a16;border:1px solid #375044;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0));z-index:20;box-shadow:0 -20px 60px #000b}.close{float:right;background:none;border:0;color:#fff;font-size:24px}.external{position:fixed;inset:0;background:#f4f2ec;color:#171717;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px}.external button{padding:11px 13px;border-radius:10px;border:1px solid #aaa;background:white}.notice{padding:12px;border:1px solid rgba(30,215,96,.3);border-radius:14px;background:rgba(30,215,96,.08);margin-top:12px}.link{color:var(--g);font-weight:700;cursor:pointer}.review{padding:14px 0;border-bottom:1px solid var(--l)}.review:last-child{border:0}.review .tone{font-size:12px;color:#d1f7dc;font-weight:800;margin-bottom:5px}</style></head><body><main class="app"><div class="top"><button class="settings" onclick="go('settings')">⚙︎</button><img class="logo" src="icon.svg" alt="Music DNA"><div class="brand">Ben's Music DNA</div><div class="muted">UX-proef · v2</div></div><div id="screen"></div></main><nav class="nav"><button class="on" onclick="root('today',this)"><b>⌂</b>Vandaag</button><button onclick="root('discover',this)"><b>⌕</b>Ontdek</button><button onclick="root('music',this)"><b>♫</b>Mijn Muziek</button><button onclick="root('news',this)"><b>▤</b>Nieuws</button></nav><script>const S=document.getElementById('screen');let stack=[],page='today';function el(t,c,x){let e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function go(p){stack.push(page);render(p)}function back(){render(stack.pop()||'today')}function root(p,b){stack=[];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(p)}function head(txt){S.innerHTML='';if(txt){let b=el('button','back','‹ '+txt);b.onclick=back;S.appendChild(b)}}function render(p){page=p;({today,listen,artist,reviews,music,news,discover,settings}[p]||today)();scrollTo(0,0)}function today(){head();S.appendChild(el('div','eye','Vandaag'));S.appendChild(el('h1','','Jouw 3 ontdekkingen'));S.appendChild(el('div','why muted','Luister, oordeel en verdiep alleen wanneer jij daar zin in hebt.'));[['Cirice','Ghost','Zweden · 2015'],['Evolve','The Warning','Mexico · 2021'],['Highway Tune','Greta Van Fleet','VS · 2017']].forEach((x,i)=>{let c=el('section','card');c.appendChild(el('div','eye',(i+1)+' VAN 3 · NOG TE ONTDEKKEN'));c.appendChild(el('h3','',x[0]));let a=el('div',i===0?'link':'muted',x[1]);if(i===0)a.onclick=e=>{e.stopPropagation();go('artist')};c.appendChild(a);c.appendChild(el('div','meta',x[2]));if(i===0){c.appendChild(el('div','meta','🧬 Zeer sterke match'));c.onclick=()=>go('listen')}S.appendChild(c)})}function listen(){head('Vandaag');S.appendChild(el('div','cover','GHOST'));S.appendChild(el('div','eye','Ontdekking 1 van 3'));S.appendChild(el('h1','','Cirice'));let a=el('div','link','Ghost');a.onclick=()=>go('artist');S.appendChild(a);let sp=el('button','btn','▶ Open in Spotify');sp.onclick=spotifySim;S.appendChild(sp);let w=el('button','btn secondary','🧬 Waarom voor mij?');w.onclick=sheet;S.appendChild(w);let r=el('section','panel');r.appendChild(el('div','eye','Jouw oordeel eerst'));r.appendChild(el('h3','','Wat vind jij ervan?'));let g=el('div','ratings');['❤️ Raak','👍 Goed','😐 Twijfel','👎 Nee'].forEach(v=>{let b=el('button','rate',v);b.onclick=()=>rated(v);g.appendChild(b)});r.appendChild(g);S.appendChild(r);let rev=el('section','card');rev.onclick=()=>go('reviews');rev.appendChild(el('div','eye','Verdieping'));rev.appendChild(el('h3','','Recensies · 3 ›'));rev.appendChild(el('div','muted','Lees desgewenst wat muziekschrijvers over Cirice en Meliora zeggen.'));S.appendChild(rev)}function rated(v){let n=document.getElementById('rated');if(n)n.remove();n=el('div','notice',v+' · jouw oordeel staat voorop. Recensies blijven optioneel.');n.id='rated';S.appendChild(n)}function reviews(){head('Cirice');S.appendChild(el('div','eye','Cirice · Ghost'));S.appendChild(el('h1','','Recensies'));S.appendChild(el('div','why muted','Eerst jouw oren, daarna desgewenst de muziekpers. Samenvattingen zijn kort; de oorspronkelijke bron blijft leidend.'));let p=el('section','panel');[['POSITIEF','Pitchfork','Benadrukt de opbouw, dynamiek en centrale riff.'],['POSITIEF','OOR','Plaatst het nummer in de melodramatische hardrockwereld van Meliora.'],['GEMENGD','Andere recensies','Niet iedere recensent waardeert dezelfde theatrale elementen even sterk.']].forEach(x=>{let q=el('div','review');q.appendChild(el('div','tone',x[0]));q.appendChild(el('h3','',x[1]));q.appendChild(el('div','muted',x[2]));let l=el('div','link','Lees bij de bron →');l.onclick=external;q.appendChild(l);p.appendChild(q)});S.appendChild(p)}function sheet(){let q=el('div','sheet'),x=el('button','close','×');x.onclick=()=>q.remove();q.appendChild(x);q.appendChild(el('div','eye','Mijn Smaak'));q.appendChild(el('h2','','Waarom Cirice?'));q.appendChild(el('div','why','Theatrale hardrock, melodie, sfeer en een sterke verwantschap met lijnen die Music DNA al kent.'));let b=el('button','btn secondary','Ontdek Ghost →');b.onclick=()=>{q.remove();go('artist')};q.appendChild(b);document.body.appendChild(q)}function artist(){head('Cirice');S.appendChild(el('div','eye','Artiest'));S.appendChild(el('h1','','Ghost'));S.appendChild(el('div','muted','Zweden · actief sinds 2006'));let tabs=el('div','tabs');['Overzicht','Muziek','Verhaal','Actueel'].forEach((v,i)=>tabs.appendChild(el('button',i===0?'on':'',v)));S.appendChild(tabs);let r=el('section','card');r.onclick=()=>go('reviews');r.appendChild(el('div','eye','Rond deze muziek'));r.appendChild(el('h3','','Recensies ›'));r.appendChild(el('div','muted','Track- en albumkritiek blijft bereikbaar vanuit de muziek waarop zij betrekking heeft.'));S.appendChild(r);let d=el('section','panel');d.appendChild(el('div','eye','🧬 Mijn Smaak'));d.appendChild(el('h3','','Zeer sterke verwantschap'));d.appendChild(el('div','muted','KISS · Iron Maiden · theatrale hardrock'));S.appendChild(d)}function music(){head();S.appendChild(el('div','eye','Jouw muziek. Jouw verhaal.'));S.appendChild(el('h1','','Mijn Muziek'));[['🧬 Mijn DNA','Wat Music DNA over jouw smaak heeft geleerd.'],['❤️ Mijn verzameling','Muziek die bij je blijft: Raak en Goed.'],['◷ Mijn muziekgeschiedenis','Ontdekkingen, ankers en hoe jouw muziekwereld groeit.'],['♬ Mijn artiesten','Artiesten die een plaats in jouw muziekwereld hebben.']].forEach(x=>{let c=el('section','card');c.appendChild(el('h2','',x[0]));c.appendChild(el('div','muted',x[1]));S.appendChild(c)})}function news(){head();S.appendChild(el('div','eye','Voor jou'));S.appendChild(el('h1','','Mijn Muzieknieuws'));[['Iron Maiden kondigt tourdata aan','Zeer relevant'],['Ghost: nieuw interview','Sterke match'],['Nieuwe hardrocknaam raakt aan jouw DNA','Mogelijk interessant']].forEach(x=>{let c=el('section','card');c.appendChild(el('div','eye',x[1]));c.appendChild(el('h3','',x[0]));S.appendChild(c)})}function discover(){head();S.appendChild(el('h1','','Ontdek'));S.appendChild(el('section','panel','Vrij rondkijken buiten je dagelijkse drie.'))}function settings(){head('Terug');S.appendChild(el('div','eye','Beheer'));S.appendChild(el('h1','','Instellingen'));S.appendChild(el('section','panel','Account, Spotify-koppeling, bronnen en technische voorkeuren. Geen aparte “Ik”-wereld in de hoofdnavigatie.'))}function external(){let e=el('div','external'),b=el('button','','← Terug naar recensies');b.onclick=()=>e.remove();e.appendChild(b);e.appendChild(el('p','muted','Gesimuleerde externe recensie'));e.appendChild(el('h1','','Oorspronkelijke bron'));e.appendChild(el('p','','Na terugkeer kom je precies terug bij de recensies van Cirice.'));document.body.appendChild(e)}function spotifySim(){let e=el('div','external'),b=el('button','','← Terug naar Music DNA');b.onclick=()=>e.remove();e.appendChild(b);e.appendChild(el('p','muted','Gesimuleerde Spotify-overgang'));e.appendChild(el('h1','','Cirice · Ghost'));e.appendChild(el('p','','De echte luisterkoppeling volgt later; deze versie test de informatie- en klikarchitectuur.'));document.body.appendChild(e)}render('today');</script></body></html>
