<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>Music DNA · UX proef</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(92px + env(safe-area-inset-bottom,0px))}.top{text-align:center;margin-bottom:26px}.logo{width:66px;height:66px;margin:auto auto 10px;display:block}.brand{font-size:13px;font-weight:850;letter-spacing:1.3px;color:var(--g);text-transform:uppercase}.muted{color:var(--m)}.eye{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}h1{font-size:30px;line-height:1.08;margin:5px 0 8px}h2{font-size:22px;margin:5px 0 8px}h3{font-size:19px;margin:0 0 5px}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:21px;padding:17px;margin:12px 0}.card{cursor:pointer}.meta{font-size:14px;color:#bbc7c1;margin-top:7px}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:800;margin:9px 0;background:var(--g);color:#07100b}.secondary{background:rgba(30,215,96,.10);color:#d1f7dc;border:1px solid rgba(30,215,96,.25)}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 14px}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:15px 7px;font-size:15px;font-weight:700}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;background:rgba(30,215,96,.105);border:1px solid rgba(30,215,96,.22);padding:6px 9px;border-radius:999px;color:#d1f7dc}.tabs{display:flex;gap:17px;overflow:auto;border-bottom:1px solid var(--l);margin:7px 0 15px}.tabs button{background:none;border:0;color:var(--m);padding:11px 0;white-space:nowrap}.tabs .on{color:var(--g);border-bottom:2px solid var(--g)}.cover{height:185px;border-radius:19px;background:radial-gradient(circle at 50% 30%,#625027,#25170e 47%,#090b0a 76%);display:grid;place-items:center;font-size:42px;font-weight:900;letter-spacing:2px;margin-bottom:15px}.news{border-bottom:1px solid var(--l);padding:13px 0}.news:last-child{border:0}.why{font-size:16px;line-height:1.48}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:72px;background:#09100d;border-top:1px solid var(--l);display:flex;justify-content:space-around;padding-top:8px;padding-bottom:env(safe-area-inset-bottom,0)}.nav button{border:0;background:none;color:#84928b;font-size:11px}.nav b{display:block;font-size:19px;margin-bottom:3px}.nav .on{color:var(--g)}.hidden{display:none}.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);background:#111a16;border:1px solid #375044;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0));z-index:20;box-shadow:0 -20px 60px #000b}.close{float:right;background:none;border:0;color:#fff;font-size:24px}.external{position:fixed;inset:0;background:#f4f2ec;color:#171717;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px}.external button{padding:11px 13px;border-radius:10px;border:1px solid #aaa;background:white}.notice{padding:12px;border:1px solid rgba(30,215,96,.3);border-radius:14px;background:rgba(30,215,96,.08);margin-top:12px}.link{color:var(--g);font-weight:700;cursor:pointer}</style></head><body><main class="app"><div class="top"><img class="logo" src="icon.svg" alt="Music DNA"><div class="brand">Ben's Music DNA</div><div class="muted">UX-proef · verdieping</div></div><div id="screen"></div></main><nav class="nav"><button id="nToday" class="on" onclick="root('today',this)"><b>⌂</b>Vandaag</button><button onclick="root('discover',this)"><b>⌕</b>Ontdek</button><button id="nDna" onclick="root('dna',this)"><b>🧬</b>Mijn DNA</button><button id="nNews" onclick="root('news',this)"><b>▤</b>Nieuws</button><button onclick="root('profile',this)"><b>○</b>Ik</button></nav><script>const S=document.getElementById('screen');let stack=[];let page='today';function el(t,c,x){let e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function go(p){stack.push(page);render(p)}function back(){render(stack.pop()||'today')}function root(p,b){stack=[];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(p)}function head(backText){S.innerHTML='';if(backText){let b=el('button','back','‹ '+backText);b.onclick=back;S.appendChild(b)}}function render(p){page=p;if(p==='today')today();if(p==='listen')listen();if(p==='artist')artist();if(p==='actual')actual();if(p==='news')news();if(p==='dna')dna();if(p==='discover')simple('Ontdek','Nieuwe muziek buiten je dagelijkse drie krijgt hier later een eigen ingang.');if(p==='profile')simple('Ik','Profiel, bronnen en voorkeuren wonen hier — niet op het dagelijkse luisterpad.');scrollTo(0,0)}function today(){head();S.appendChild(el('div','eye','Vandaag'));S.appendChild(el('h1','','Jouw 3 ontdekkingen'));S.appendChild(el('div','why muted','De dagelijkse route blijft rustig. Tik zoals je vanzelf zou doen.'));[['Mary On A Cross','Ghost','Zweden · 2019'],['Evolve','The Warning','Mexico · 2021'],['Highway Tune','Greta Van Fleet','VS · 2017']].forEach((x,i)=>{let c=el('section','card');c.appendChild(el('div','eye',(i+1)+' VAN 3 · NOG TE ONTDEKKEN'));c.appendChild(el('h3','',x[0]));let a=el('div','muted',x[1]);if(i===0){a.classList.add('link');a.onclick=e=>{e.stopPropagation();go('artist')}}c.appendChild(a);c.appendChild(el('div','meta',x[2]));if(i===0){let d=el('div','meta dna','🧬 Zeer sterke match');c.appendChild(d);c.onclick=()=>go('listen')}S.appendChild(c)})}function listen(){head('Vandaag');let cv=el('div','cover','GHOST');S.appendChild(cv);S.appendChild(el('div','eye','Ontdekking 1 van 3'));S.appendChild(el('h1','','Mary On A Cross'));let a=el('div','link','Ghost');a.onclick=()=>go('artist');S.appendChild(a);let sp=el('button','btn','▶ Open in Spotify');sp.onclick=()=>spotifySim();S.appendChild(sp);let w=el('button','btn secondary','🧬 Mijn Smaak · Zeer sterke match ›');w.onclick=sheet;S.appendChild(w);let p=el('section','panel');p.appendChild(el('div','eye','Jouw oordeel'));p.appendChild(el('h3','','Wat vond je ervan?'));let g=el('div','ratings');['❤️ Raak','👍 Goed','😐 Twijfel','👎 Nee'].forEach(v=>{let b=el('button','rate',v);b.onclick=()=>rated(v);g.appendChild(b)});p.appendChild(g);S.appendChild(p)}function rated(v){let old=document.getElementById('rated');if(old)old.remove();let n=el('div','notice',v+' · keuze verwerkt. De luisterroute blijft hierna bij je dagelijkse ontdekkingen.');n.id='rated';S.appendChild(n)}function sheet(){let q=el('div','sheet');let x=el('button','close','×');x.onclick=()=>q.remove();q.appendChild(x);q.appendChild(el('div','eye','Mijn Smaak'));q.appendChild(el('h2','','Waarom deze ontdekking?'));q.appendChild(el('div','why','Ghost raakt sterk aan theatrale hardrock, melodie en een uitgesproken visuele wereld die al in jouw profiel voorkomen.'));let tags=el('div','tags');['Theatraal','Melodie','Hardrock','Sfeer'].forEach(v=>tags.appendChild(el('span','tag',v)));q.appendChild(tags);let b=el('button','btn secondary','Ontdek de artiest →');b.onclick=()=>{q.remove();go('artist')};q.appendChild(b);document.body.appendChild(q)}function artist(){head('Luisteren');S.appendChild(el('div','eye','Artiest'));S.appendChild(el('h1','','Ghost'));S.appendChild(el('div','muted','Zweden · actief sinds 2006'));let d=el('section','card');d.onclick=sheet;d.appendChild(el('div','eye','🧬 Mijn Smaak'));d.appendChild(el('h3','','Zeer sterke match ›'));S.appendChild(d);let tabs=el('div','tabs');['Overzicht','Muziek','Verhaal'].forEach((v,i)=>{let b=el('button',i===0?'on':'',v);tabs.appendChild(b)});let ac=el('button','','Actueel');ac.onclick=()=>go('actual');tabs.appendChild(ac);S.appendChild(tabs);S.appendChild(el('h2','','Waarom Ghost bij jou past'));S.appendChild(el('div','why muted','De verdieping verklaart de plaats van een artiest binnen jouw eigen muziekwereld, zonder het dagelijkse luisterscherm zwaarder te maken.'));let r=el('section','panel');r.appendChild(el('div','eye','Sterke verwantschappen'));r.appendChild(el('h3','','KISS · Iron Maiden · klassieke hardrock'));S.appendChild(r)}function actual(){head('Ghost');S.appendChild(el('div','eye','Ghost'));S.appendChild(el('h1','','Actueel'));let tabs=el('div','tabs');['Nieuws','Artikelen','On Tour','Setlists'].forEach((v,i)=>tabs.appendChild(el('button',i===0?'on':'',v)));S.appendChild(tabs);let p=el('section','panel');let n=el('div','news');n.appendChild(el('div','eye','Artikel'));n.appendChild(el('h3','','Nieuw interview met Tobias Forge'));n.appendChild(el('div','muted','Metal Hammer · recent'));n.appendChild(el('p','why','Korte samenvatting in Music DNA. De oorspronkelijke bron blijft leidend.'));let b=el('button','btn secondary','Lees bij de bron →');b.onclick=external;n.appendChild(b);p.appendChild(n);let t=el('div','news');t.appendChild(el('div','eye','On Tour'));t.appendChild(el('h3','','Komende concerten'));t.appendChild(el('div','muted','Tourinformatie krijgt hier een rustige plek.'));p.appendChild(t);let se=el('div','news');se.appendChild(el('div','eye','Setlists'));se.appendChild(el('h3','','Recente setlists'));se.appendChild(el('div','muted','Doorkijk naar setlist.fm.'));p.appendChild(se);S.appendChild(p)}function external(){let e=el('div','external');e.id='external';let b=el('button','','← Terug naar Music DNA');b.onclick=()=>e.remove();e.appendChild(b);e.appendChild(el('p','muted','Gesimuleerde externe bron'));e.appendChild(el('h1','','Interview met Tobias Forge'));e.appendChild(el('p','','Dit scherm simuleert een artikel buiten Music DNA. Bij terugkeer hoort exact Ghost › Actueel terug te staan, zonder dat je route verloren gaat.'));document.body.appendChild(e)}function spotifySim(){let e=el('div','external');e.id='spotify';let b=el('button','','← Terug naar Music DNA');b.onclick=()=>e.remove();e.appendChild(b);e.appendChild(el('p','muted','Gesimuleerde Spotify-overgang'));e.appendChild(el('h1','','Mary On A Cross'));e.appendChild(el('p','','In de echte app opent Spotify. Deze proef test vooral of terugkeren logisch voelt en je context behouden blijft.'));document.body.appendChild(e)}function news(){head();S.appendChild(el('div','eye','Voor jou'));S.appendChild(el('h1','','Mijn Nieuws'));[['ZEER RELEVANT','Iron Maiden kondigt tourdata aan','Metal Hammer · 2 uur geleden'],['STERKE MATCH','Ghost: nieuw interview','Arrow Lords of Metal · vandaag'],['MOGELIJK INTERESSANT','Nieuwe hardrocknaam raakt aan jouw DNA','Waarom zie ik dit? →']].forEach(x=>{let c=el('section','card');c.appendChild(el('div','eye',x[0]));c.appendChild(el('h3','',x[1]));c.appendChild(el('div','muted',x[2]));S.appendChild(c)})}function dna(){head();S.appendChild(el('div','eye','Jouw muziek. Jouw verhaal.'));S.appendChild(el('h1','','Mijn DNA'));let c=el('section','card');c.appendChild(el('h2','','🧬 Jouw muzieksmaak'));let tags=el('div','tags');['Hard Rock','Heavy Metal','Prog Rock','Classic Rock'].forEach(v=>tags.appendChild(el('span','tag',v)));c.appendChild(tags);S.appendChild(c);let h=el('section','card');h.appendChild(el('h2','','Mijn muziekgeschiedenis'));h.appendChild(el('div','muted','Ontdekkingen, Raak-momenten, ankers en hoe jouw smaak zich door de tijd ontwikkelt.'));S.appendChild(h)}function simple(title,text){head();S.appendChild(el('h1','',title));S.appendChild(el('section','panel',text))}render('today');</script></body></html>
