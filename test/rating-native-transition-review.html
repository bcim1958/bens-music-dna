 out.textContent=JSON.stringify(report,null,2);button.disabled=stage>=5;
 }catch(e){report.pass=false;report.error=String(e.stack||e);out.textContent=JSON.stringify(report,null,2);button.disabled=true;for(const w of [owner,second,reopened])if(w&&!w.closed)w.close();if(registration)await registration.unregister();}}
