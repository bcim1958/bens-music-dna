<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · opening v4</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000}.stage{position:fixed;inset:0;background:#000}canvas{position:absolute;inset:0;width:100%;height:100%}.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 49%,transparent 0,transparent 47%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.9) 100%)}.controls{position:fixed;right:16px;bottom:14px;z-index:5}.controls button{background:#07100c;color:#fff;border:1px solid #41584b;border-radius:999px;padding:9px 14px}</style></head><body><div class="stage"><canvas id="c"></canvas><div class="veil"></div></div><div class="controls"><button onclick="location.reload()">↻ opnieuw</button></div><script src="music-dna-candidates-w36-v1.js"></script><script>(async()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tracks=Object.values(MUSIC_DNA_W36_CANDIDATES.tracks),imgs=[];let W,H,D;const cl=x=>Math.max(0,Math.min(1,x)),sm=x=>x*x*(3-2*x);function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);async function art(t){try{let r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(t.spotifyUrl)),j=await r.json(),im=new Image();im.crossOrigin='anonymous';im.src=j.thumbnail_url;await im.decode();return im}catch(e){return null}}for(const t of tracks){let im=await art(t);if(im)imgs.push(im)}if(!imgs.length)return;const N=460,P=[];for(let i=0;i<N;i++){let a=(Math.random()-.5)*1.18,spread=.12+Math.pow(Math.random(),.7)*.88,side=Math.random()<.5?-1:1;P.push({im:imgs[i%imgs.length],a,spread,side,delay:Math.random()*.72,roll:(Math.random()-.5)*.55,lift:(Math.random()-.5)*.45,depth:.2+Math.random()*.8})}const start=performance.now(),DUR=30000;function origin(t){let on=sm(cl(t/.13))*(1-sm(cl((t-.36)/.22)));if(on<.002)return;let cx=W*.23,cy=H*.5,R=Math.min(W,H)*(.12+.04*sm(cl(t/.25)));ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(cx,cy);ctx.scale(1,.62);ctx.rotate(-.12);for(let k=0;k<10;k++){let rr=R*(1.05+k*.085),alpha=(.13-k*.008)*on;ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.strokeStyle='rgba(235,242,250,'+alpha+')';ctx.lineWidth=R*(.12-k*.006);ctx.shadowBlur=18+3*k;ctx.shadowColor='rgba(205,220,240,.7)';ctx.stroke()}ctx.restore();ctx.save();ctx.fillStyle='rgba(0,0,0,'+(.98*on)+')';ctx.shadowBlur=20;ctx.shadowColor='#dce8f5';ctx.beginPath();ctx.arc(cx,cy,R*.7,0,Math.PI*2);ctx.fill();ctx.restore();let pin=2.5+4*on;ctx.save();ctx.fillStyle='rgba(255,255,255,'+(.72*on)+')';ctx.shadowBlur=14;ctx.shadowColor='#fff';ctx.beginPath();ctx.arc(cx+R*.68,cy,pin,0,Math.PI*2);ctx.fill();ctx.restore()}function draw(now){let t=cl((now-start)/DUR);ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.28,H*.5,0,W*.28,H*.5,Math.max(W,H)*.72);bg.addColorStop(0,'#05080a');bg.addColorStop(.5,'#010203');bg.addColorStop(1,'#000');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);origin(t);let cx=W*.23,cy=H*.5,flow=sm(cl((t-.10)/.75));let arr=[];for(let i=0;i<N;i++){let p=P[i],q=cl((flow-p.delay)/(1-p.delay));if(q<=0)continue;q=sm(q);let travel=Math.pow(q,.76),fan=.05+p.spread*.74*travel,x=cx+W*(.015+.80*travel),y=cy+H*(Math.sin(p.a)*fan*.54+p.lift*.055*travel);let z=.08+.92*travel*p.depth,s=Math.min(W,H)*(.005+.033*z)*(.3+.7*q);arr.push({p,q,x,y,z,s,i})}arr.sort((a,b)=>a.z-b.z);for(const o of arr){ctx.save();ctx.globalAlpha=cl(o.q*1.3)*(.22+.78*o.z);ctx.translate(o.x,o.y);ctx.rotate(o.p.roll*(1-o.q*.75));ctx.filter='blur('+((1-o.q)*7+(1-o.z)*2)+'px) brightness('+(0.3+.8*o.q)+')';ctx.shadowBlur=7*o.q;ctx.shadowColor='rgba(235,240,255,.18)';ctx.drawImage(o.p.im,-o.s/2,-o.s/2,o.s,o.s);ctx.restore()}if(t<1)requestAnimationFrame(draw)}requestAnimationFrame(draw)})();</script></body></html>
