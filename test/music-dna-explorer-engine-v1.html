<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA — Explorer Engine v1</title><style>:root{--ink:#f5f0e8;--muted:#aaa7b6;--gold:#e6b65d;--green:#94d68c;--line:#302d43}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#342044,#090a15 34%,#05060c 82%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:14px 13px 110px}.top{display:flex;justify-content:space-between;padding:5px 2px 12px}.brand{font-weight:900;letter-spacing:.12em}.brand b,.eyebrow{color:var(--gold)}.small{font-size:.76rem;color:var(--muted)}.trail{display:flex;gap:5px;overflow:auto;white-space:nowrap;color:var(--muted);font-size:.75rem;padding:3px 2px 12px}.trail b{color:var(--ink)}.card{border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#151426,#0a0b13);padding:21px}.eyebrow{font-size:.69rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(2.5rem,11vw,4.8rem)/.94 Georgia,serif;margin:.13em 0 .2em}h2{font:700 1.45rem/1.08 Georgia,serif}.lead{font-size:1.05rem;color:#ded9e4}.dna{border-left:3px solid var(--green);padding:10px 13px;margin:15px 0;background:#0d1715;border-radius:0 14px 14px 0}.doors{display:grid;gap:9px;margin:15px 0}.door{border:1px solid var(--line);border-radius:18px;background:#10111c;color:var(--ink);padding:15px;text-align:left;width:100%;cursor:pointer}.door strong,.door span{display:block}.door span{font-size:.78rem;color:var(--muted)}.primary{border-color:#45664f;background:#0f1915}.surprise{border:0;background:linear-gradient(110deg,#e7b75f,#b989df);color:#17100b}.surprise span{color:#49372d}.story{border-color:#59446c}.readtime{display:inline-block;border:1px solid #544a67;border-radius:999px;padding:5px 9px;color:#cbc2d7;font-size:.7rem;margin:7px 0}.takeaway{border-left:3px solid var(--gold);padding-left:13px;margin:18px 0}.source{display:block;color:#d7c7e5;text-decoration:none;border:1px dashed #59446c;border-radius:16px;padding:13px;margin-top:18px}.empty{color:var(--muted);padding:14px 2px}.bottom{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 18px));display:grid;grid-template-columns:1fr auto 1fr;background:#080914ef;border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;color:var(--ink);padding:10px 8px}.bottom .home{color:var(--gold);font-weight:850}.bottom button:last-child{text-align:right}</style></head><body><main class="app"><header class="top"><div class="brand"><b>⌁</b> DNA EXPLORER</div><div class="small">ENGINE 01</div></header><div class="trail" id="trail"></div><div id="view"></div></main><nav class="bottom"><button onclick="back()">← Terug</button><button class="home" onclick="home()">⌁ Ghost</button><button onclick="origin()">Beginpunt ↩</button></nav><script src="music-dna-explorer-graph-v1.js"></script><script>
const G=window.MUSIC_DNA_EXPLORER_GRAPH_V1;let current=G.start,stack=[],visited=[G.start],lastSurpriseType="";
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rel(a,b){return G.relations[a+">"+b]||"volg dit spoor"}
function door(id,cls=""){const n=G.nodes[id];return n?'<button class="door '+cls+'" onclick="go(\''+id+'\')"><span>'+esc(rel(current,id))+'</span><strong>'+esc(n.name)+' →</strong><span>'+esc(n.orientation)+'</span></button>':""}
function render(){const n=G.nodes[current];if(!n)return;document.getElementById("trail").innerHTML=visited.slice(-7).map((id,i,a)=>i===a.length-1?"<b>"+esc(G.nodes[id].name)+"</b>":esc(G.nodes[id].name)+" ›").join(" ");let x='<section class="card '+(n.type==="story"?"story":"")+'"><div class="eyebrow">'+esc(n.eyebrow||n.type)+'</div><h1>'+esc(n.name)+'</h1>';if(n.type==="story"){x+='<div class="readtime">'+esc(n.publisher)+' · '+esc(n.date)+' · '+esc(n.readtime)+'</div><h2>'+esc(n.title)+'</h2>'+n.summary.map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="takeaway"><b>Wat neem je hiervan mee?</b><br>'+esc(n.takeaway)+'</div><div class="eyebrow">Volg een spoor</div><div class="doors">'+n.doors.map(id=>door(id)).join("")+'</div><a class="source" target="_blank" rel="noopener" href="'+n.url+'"><b>Lees het oorspronkelijke interview ↗</b><br><span class="small">'+esc(n.publisher)+' · '+esc(n.date)+'</span></a>'}else{x+='<p class="lead">'+esc(n.orientation)+'</p>';if(n.dna)x+='<div class="dna"><div class="eyebrow">In jouw Music DNA</div>'+esc(n.dna)+'</div>';let ds=n.primary||n.doors||[];x+='<div class="doors">'+ds.map((id,i)=>door(id,n.primary&&i===1?"primary":"")).join("");if(n.surprise)x+='<button class="door surprise" onclick="surprise()"><strong>✦ Kies een interessante afslag voor mij</strong><span>alleen uit bestaande, onderbouwde deuren</span></button>';if(!ds.length)x+='<div class="empty">Deze buurt is nog niet verrijkt. Explorer verzint hier niets bij.</div>';x+='</div>'}x+='</section>';document.getElementById("view").innerHTML=x;scrollTo(0,0)}
function go(id){if(!G.nodes[id])return;stack.push(current);current=id;visited.push(id);render()}function back(){if(!stack.length)return;current=stack.pop();visited.push(current);render()}function home(){stack.push(current);current=G.start;visited.push(current);render()}function origin(){stack=[];visited=[G.start];current=G.start;render()}
function candidates(){const n=G.nodes[current],ids=(n.primary||n.doors||[]).filter(id=>G.nodes[id]);return ids.map(id=>({id,type:rel(current,id)}))}
function surprise(){let c=candidates();if(!c.length)return;let fresh=c.filter(x=>!visited.slice(-5).includes(x.id)&&x.type!==lastSurpriseType);if(!fresh.length)fresh=c.filter(x=>x.type!==lastSurpriseType);if(!fresh.length)fresh=c;let p=fresh[Math.floor(Math.random()*fresh.length)];lastSurpriseType=p.type;go(p.id)}render();
</script></body></html>
