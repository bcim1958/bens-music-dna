<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07130f"><title>Ben's Music DNA — GO</title><style>:root{--g:#8ed85e;--gold:#e6ad52;--bg:#05090b;--ink:#f5f5ef;--muted:#9aa7a5;--line:#293438;--panel:#0d1518}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163329,#07100d 38%,#050708 80%);color:var(--ink);font:17px/1.55 system-ui,-apple-system,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:28px 20px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-weight:900;letter-spacing:.13em}.brand b{color:var(--g)}.muted{color:var(--muted)}.small{font-size:.82rem}.eye{color:var(--g);font-size:.76rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase}h1{font:700 clamp(2.5rem,8vw,4.6rem)/.98 Georgia,serif;margin:.12em 0 .25em}h2{font:700 2rem/1.05 Georgia,serif;margin:.15em 0}.lead{font-size:1.15rem;color:#d8dedb}.track{border:1px solid var(--line);background:#0c1518;border-radius:24px;padding:18px;margin:13px 0;cursor:pointer;display:grid;grid-template-columns:68px 1fr auto;gap:15px;align-items:center}.cover{width:68px;height:68px;border-radius:12px;background:radial-gradient(circle at 55% 25%,#b8a466,#40382b 35%,#101415 72%);display:grid;place-items:center;font-weight:900}.track.done{opacity:.72}.track strong{display:block;font-size:1.05rem}.arrow{color:var(--gold);font-size:1.4rem}.panel{border:1px solid var(--line);background:#0c1518;border-radius:26px;padding:24px;margin:20px 0}.btn{border:1px solid var(--line);background:#101a1e;color:var(--ink);border-radius:999px;padding:13px 17px;font:inherit;cursor:pointer}.primary{background:var(--g);color:#071008;border:0;font-weight:850}.gold{background:var(--gold);color:#151008;border:0;font-weight:850}.row{display:flex;gap:9px;flex-wrap:wrap}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.ratings button{border:1px solid var(--line);background:#10191c;color:white;border-radius:17px;padding:16px 5px;font-size:1.4rem}.ratings small{display:block;font-size:.7rem}.door{width:100%;border:1px solid var(--line);background:#0d171a;color:var(--ink);border-radius:18px;padding:16px 18px;margin:7px 0;text-align:left;font:inherit;cursor:pointer;display:flex;justify-content:space-between}.door span{color:var(--muted);display:block;font-size:.84rem}.door em{color:var(--gold);font-style:normal;font-size:1.3rem}.backbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 24px));display:flex;justify-content:center;gap:5px;background:#071014ed;border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(12px)}.backbar button{border:0;background:transparent;color:var(--ink);padding:9px 13px}.backbar .home{color:var(--g)}.donebox{border:1px solid #395632;background:#0d1b12;border-radius:20px;padding:18px;margin:20px 0}.hide{display:none}@media(max-width:520px){.ratings{grid-template-columns:repeat(2,1fr)}.track{grid-template-columns:58px 1fr auto}.cover{width:58px;height:58px}}</style></head><body><main class="app"><header class="top"><div class="brand"><b>⌁</b> MUSIC DNA</div><div class="small muted" id="place">Vandaag</div></header><div id="screen"></div></main><nav class="backbar"><button id="back">← Terug</button><button class="home" id="home">⌁ Vandaag</button></nav><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-learning-v1.js"></script><script src="music-dna-positive-bank-v1.js"></script><script src="music-dna-selector-v1.js"></script><script src="music-dna-weeks-v1.js"></script><script>(function(){const S=document.getElementById('screen'),P=document.getElementById('place');let stack=[],current='today',C=null,CFG=MUSIC_DNA_WEEKS.resolve(new Date()),DAY=Math.max(1,Math.min(7,Math.floor((new Date()-CFG.start)/86400000)+1));const sk='bmd-week-'+CFG.key+'-day'+DAY+'-v1',selk='bmd-week-'+CFG.key+'-day'+DAY+'-selection-v1';function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function tr(id){return(C&&C.tracks&&C.tracks[id])||(MUSIC_DNA_DB.tracks&&MUSIC_DNA_DB.tracks[id])}function select(){let x=read(selk,null);if(x&&x.ids&&x.ids.length===3)return x.ids;let chosen=MUSIC_DNA_SELECTOR.chooseBatch(C.tracks,{size:3,excludeIds:[]});x={ids:chosen.map(x=>x.id),createdAt:new Date().toISOString()};write(selk,x);return x.ids}function spotify(t){return t.spotifyUrl||('https://open.spotify.com/search/'+encodeURIComponent(t.identity.title+' '+t.identity.artist))}function page(name,fn,push=true){if(push&&current!==name)stack.push(current);current=name;P.textContent=name==='today'?'Vandaag':name;S.innerHTML='';fn();window.scrollTo(0,0)}function today(){page('today',()=>{let ids=select(),st=read(sk,{}),done=ids.filter(id=>st[id]&&st[id].rating).length;S.innerHTML='<div class="eye">Vandaag voor jou</div><h1>Drie ontdekkingen.</h1><p class="lead">Eerst muziek. De rest verschijnt alleen wanneer jij nieuwsgierig wordt.</p>'+(done===3?'<div class="donebox">✓ Jouw drie van vandaag zijn compleet. Je hoeft niets meer.</div>':'');ids.forEach((id,i)=>{let t=tr(id),r=st[id]&&st[id].rating,d=document.createElement('div');d.className='track'+(r?' done':'');d.innerHTML='<div class="cover">'+(i+1)+'</div><div><strong>'+t.identity.title+'</strong><span class="muted">'+t.identity.artist+(r?' · '+({raak:'❤️',goed:'👍',twijfel:'😐',nee:'👎'}[r]):'')+'</span></div><div class="arrow">→</div>';d.onclick=()=>detail(id);S.appendChild(d)})},false)}function detail(id){let t=tr(id);page(t.identity.title,()=>{S.innerHTML='<div class="eye">'+t.identity.artist+' · '+t.identity.releaseYear+'</div><h1>'+t.identity.title+'</h1><p class="lead">'+t.identity.albumOrRelease+'</p><div class="panel"><h2>Luister eerst.</h2><p class="muted">De informatie wacht. De muziek niet.</p><button class="gold btn" id="play">▶ Open dit nummer</button></div><div class="panel"><div class="eye">Jouw reactie</div><div class="ratings" id="rates"></div></div>';document.getElementById('play').onclick=()=>window.open(spotify(t),'_blank');let g=document.getElementById('rates');[['raak','❤️','Raak'],['goed','👍','Goed'],['twijfel','😐','Twijfel'],['nee','👎','Nee']].forEach(a=>{let b=document.createElement('button');b.innerHTML=a[1]+'<small>'+a[2]+'</small>';b.onclick=()=>rate(id,a[0]);g.appendChild(b)})})}function rate(id,r){let st=read(sk,{});st[id]={rating:r,ratedAt:new Date().toISOString()};write(sk,st);let t=tr(id);if(r==='raak'||r==='goed')curious(id,t);else today()}function curious(id,t){page(t.identity.title,()=>{S.innerHTML='<div class="donebox">✓ '+(read(sk,{})[id].rating==='raak'?'❤️ Raak':'👍 Goed')+' opgeslagen.</div><div class="eye">Alleen als je wilt</div><h1>Blijf bij de muziek — of volg je nieuwsgierigheid.</h1><p class="lead">Music DNA bewaart '+t.identity.artist+' vanaf nu als positieve muziekrelatie. Informatie is bijvangst, geen opdracht.</p><button class="door" id="why"><div><strong>Waarom past dit bij mij?</strong><span>een korte Music DNA-uitleg</span></div><em>→</em></button><button class="door" id="artist"><div><strong>Wat is er rond '+t.identity.artist+' te ontdekken?</strong><span>albums · live · verhaal · nieuwe oogst</span></div><em>→</em></button><button class="door" id="music"><div><strong>Verder met muziek</strong><span>terug naar jouw drie van vandaag</span></div><em>→</em></button>';document.getElementById('why').onclick=()=>info(t);document.getElementById('artist').onclick=()=>artist(t);document.getElementById('music').onclick=today})}function info(t){page('Waarom voor jou?',()=>{S.innerHTML='<div class="eye">Music DNA</div><h1>Waarom deze?</h1><div class="panel"><p class="lead">'+((t.editorial&&t.editorial.whyForYou)||'Geselecteerd vanuit je opgebouwde Music DNA en je eerdere luistersignalen.')+'</p></div><button class="primary btn" onclick="history.back()">Terug naar de muziek</button>'})}function artist(t){page(t.identity.artist,()=>{let ghost=/^ghost$/i.test(t.identity.artist);S.innerHTML='<div class="eye">Positieve artiestenwereld</div><h1>'+t.identity.artist+'</h1><p class="lead">De muziek blijft de ingang. Hier groeit alleen wat jouw beleving rijker kan maken.</p>'+(ghost?'<button class="door" id="ghost"><div><strong>Open de Ghost-klikwereld</strong><span>Papa’s · live · Chapters · Meliora · verhaal</span></div><em>→</em></button>':'<div class="panel"><strong>Artiestenwereld wordt gevuld</strong><p class="muted">Deze plek krijgt de betrouwbare nieuwe oogst, albums, live, interviews en unieke zijpaden van deze artiest — zonder de dagelijkse muziekstroom te belasten.</p></div>')+'<button class="door" id="backmusic"><div><strong>Terug naar mijn muziek</strong><span>Vandaag</span></div><em>→</em></button>';if(ghost)document.getElementById('ghost').onclick=()=>location.href='ux-cirice-flow-v6-5.html';document.getElementById('backmusic').onclick=today})}document.getElementById('back').onclick=()=>{if(stack.length){let x=stack.pop();if(x==='today')today();else today()}else today()};document.getElementById('home').onclick=today;let sc=document.createElement('script');sc.src=CFG.candidateFile;sc.onload=()=>{C=window[CFG.candidateGlobal];if(!C||!C.tracks){S.innerHTML='<h1>Veilige wachtstand</h1><p>De huidige oogst is nog niet geladen.</p>';return}today()};sc.onerror=()=>S.innerHTML='<h1>Veilige wachtstand</h1><p>De huidige oogst kon niet worden geladen.</p>';document.head.appendChild(sc)})();</script></body></html>
