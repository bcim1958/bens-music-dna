<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>Ben's Music DNA — GO</title><style>:root{--g:#1ed760;--gold:#e6ad52;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:40px 20px 110px}.brand{font-size:15px;font-weight:850;letter-spacing:1.4px;color:var(--g);text-transform:uppercase;margin-bottom:34px}.eye,.status{color:var(--g);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.muted{color:var(--m)}h1{font-size:31px;line-height:1.08;margin:5px 0 8px}h2{font-size:22px;margin:4px 0 8px}h3{font-size:20px;margin:0 0 6px}.intro{font-size:17px;line-height:1.48}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.meta{font-size:15px;color:#bbc7c1;margin-top:8px;line-height:1.45}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b;cursor:pointer}.btn.alt{background:transparent;border:1px solid var(--l);color:var(--t)}.btn.gold{background:var(--gold);color:#171006}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 14px;cursor:pointer}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700}.notice{text-align:center;padding:8px 8px 30px}.donebox{border:1px solid rgba(30,215,96,.3);background:rgba(30,215,96,.08);border-radius:18px;padding:16px;margin:18px 0}.door{width:100%;border:1px solid var(--l);background:rgba(255,255,255,.05);color:var(--t);border-radius:18px;padding:16px;text-align:left;margin:8px 0;font-size:16px;cursor:pointer}.door small{display:block;color:var(--m);margin-top:4px}.footer{text-align:center;color:#718078;font-size:12px;margin-top:28px}.error{border:1px solid #7b3d3d;background:#2a1212;border-radius:18px;padding:16px}</style></head><body><main class="app"><div class="brand">⌁ Ben's Music DNA</div><div id="screen"><div class="notice"><div class="eye">Music DNA</div><h1>Even laden…</h1></div></div><div class="footer">Eerst muziek. Dan jij. Dan de wereld.</div></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-learning-v1.js"></script><script src="music-dna-selector-v1.js"></script><script src="music-dna-weeks-v1.js"></script><script src="music-dna-candidates-w36-v1.js"></script><script>(function(){var screen=document.getElementById('screen');var CFG=MUSIC_DNA_WEEKS.resolve(new Date());var C=window[CFG.candidateGlobal]||MUSIC_DNA_W36_CANDIDATES;var START=CFG.start;var d=Math.floor((new Date()-START)/86400000)+1;if(d<1)d=1;if(d>7)d=7;var stateKey='bmd-week-'+CFG.key+'-day'+d+'-v1';var selectionKey='bmd-week-'+CFG.key+'-day'+d+'-selection-v1';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function track(id){return(C.tracks&&C.tracks[id])||(MUSIC_DNA_DB.tracks&&MUSIC_DNA_DB.tracks[id])}function selection(){var s=read(selectionKey,null);if(s&&s.ids&&s.ids.length===3)return s.ids;var chosen=MUSIC_DNA_SELECTOR.chooseBatch(C.tracks,{size:3,excludeIds:[]});if(!chosen||chosen.length!==3)throw new Error('Geen drie ontdekkingen beschikbaar');s={ids:chosen.map(function(x){return x.id}),createdAt:new Date().toISOString()};write(selectionKey,s);return s.ids}function spotify(t){return t.spotifyUrl||('https://open.spotify.com/search/'+encodeURIComponent(t.identity.title+' '+t.identity.artist))}function today(){var ids=selection(),st=read(stateKey,{}),done=ids.filter(function(id){return st[id]&&st[id].rating}).length;screen.innerHTML='<div class="eye">Vandaag voor jou</div><h1>Drie ontdekkingen.</h1><div class="intro muted">Luister. Beoordeel. De rest verschijnt alleen wanneer jij daar zin in hebt.</div>'+(done===3?'<div class="donebox">✓ Jouw drie van vandaag zijn compleet. Je hoeft niets meer.</div>':'');ids.forEach(function(id,i){var t=track(id);if(!t)return;var r=st[id]&&st[id].rating;var c=document.createElement('section');c.className='card';c.innerHTML='<div class="status">'+(r?'✓ BEOORDEELD':(i+1)+' VAN 3')+'</div><h3>'+t.identity.title+'</h3><div class="muted">'+t.identity.artist+'</div><div class="meta">'+t.identity.releaseYear+' · '+t.identity.albumOrRelease+(r?' · '+({raak:'❤️ Raak',goed:'👍 Goed',twijfel:'😐 Twijfel',nee:'👎 Nee'}[r]):'')+'</div>';c.onclick=function(){detail(id)};screen.appendChild(c)})}function detail(id){var t=track(id),st=read(stateKey,{});screen.innerHTML='';var b=document.createElement('button');b.className='back';b.textContent='‹ Vandaag';b.onclick=today;screen.appendChild(b);var box=document.createElement('div');box.innerHTML='<div class="eye">'+t.identity.artist+' · '+t.identity.releaseYear+'</div><h1>'+t.identity.title+'</h1><div class="muted">'+t.identity.albumOrRelease+'</div><section class="panel"><h2>Luister eerst.</h2><div class="intro muted">De informatie wacht. De muziek niet.</div><button class="btn gold" id="play">▶ Open dit nummer in Spotify</button></section><section class="panel"><div class="eye">Jouw oordeel</div><h3>Wat doet dit met je?</h3><div class="ratings" id="ratings"></div></section>';screen.appendChild(box);document.getElementById('play').onclick=function(){window.open(spotify(t),'_blank')};var g=document.getElementById('ratings');[['raak','❤️ Raak'],['goed','👍 Goed'],['twijfel','😐 Twijfel'],['nee','👎 Nee']].forEach(function(a){var x=document.createElement('button');x.className='rate';x.textContent=a[1];x.onclick=function(){st[id]={rating:a[0],ratedAt:new Date().toISOString()};write(stateKey,st);if(a[0]==='raak'||a[0]==='goed')afterPositive(id);else today()};g.appendChild(x)})}function afterPositive(id){var t=track(id),st=read(stateKey,{}),rating=st[id]&&st[id].rating;screen.innerHTML='<button class="back" id="toToday">‹ Vandaag</button><div class="donebox">✓ '+(rating==='raak'?'❤️ Raak':'👍 Goed')+' opgeslagen.</div><div class="eye">Muziek eerst</div><h1>'+t.identity.title+'</h1><div class="intro">Je kunt meteen verder met muziek. Alleen als je nieuwsgierig bent, staat er meer klaar.</div><button class="btn" id="music">Verder met mijn muziek</button><button class="door" id="why"><strong>Waarom past dit bij mij?</strong><small>Korte Music DNA-uitleg</small></button><button class="door" id="artist"><strong>Wat is er rond '+t.identity.artist+' te ontdekken?</strong><small>Alleen waardevolle bijvangst</small></button>';document.getElementById('toToday').onclick=today;document.getElementById('music').onclick=today;document.getElementById('why').onclick=function(){why(t,id)};document.getElementById('artist').onclick=function(){artist(t,id)}}function why(t,id){screen.innerHTML='<button class="back" id="backPos">‹ Terug naar '+t.identity.title+'</button><div class="eye">Waarom voor jou?</div><h1>'+t.identity.title+'</h1><section class="panel"><div class="intro">'+((t.editorial&&t.editorial.whyForYou)||'Geselecteerd vanuit je opgebouwde Music DNA en eerdere luistersignalen.')+'</div></section><button class="btn" id="music">Terug naar mijn muziek</button>';document.getElementById('backPos').onclick=function(){afterPositive(id)};document.getElementById('music').onclick=today}function artist(t,id){var ghost=/^ghost$/i.test(t.identity.artist);screen.innerHTML='<button class="back" id="backPos">‹ Terug naar '+t.identity.title+'</button><div class="eye">Artiestenwereld</div><h1>'+t.identity.artist+'</h1><div class="intro muted">Deze wereld groeit alleen omdat de muziek positief bij jou landde.</div>'+(ghost?'<button class="door" id="ghost"><strong>Open de Ghost-wereld</strong><small>Papa’s · live · Chapters · Meliora · verhaal</small></button>':'<section class="panel"><h3>Wordt gevuld</h3><div class="muted">Nieuwe oogst, albums, live, interviews en unieke verhalen komen hier later samen — zonder de dagelijkse muziekbeleving te belasten.</div></section>')+'<button class="btn" id="music">Terug naar mijn muziek</button>';document.getElementById('backPos').onclick=function(){afterPositive(id)};document.getElementById('music').onclick=today;if(ghost)document.getElementById('ghost').onclick=function(){location.href='ux-cirice-flow-v6-5.html'}}try{today()}catch(e){screen.innerHTML='<div class="error"><div class="eye">Technische fout</div><h2>Music DNA kon vandaag niet openen.</h2><div class="muted">'+String(e&&e.message?e.message:e)+'</div></div>'}})();</script></body></html>
