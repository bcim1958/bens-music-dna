<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06100c"><title>Music DNA · Spotify</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030605;color:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100dvh;max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 20px);background:radial-gradient(circle at 50% 0,#123226,#07110d 38%,#030605 88%);display:grid;place-items:center;text-align:center}.logo{width:62px;height:62px;border-radius:15px}.brand{color:#20df68;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;font-size:13px;margin-top:8px}h1{font-size:28px;margin:24px 0 10px}.muted{color:#a9b5af;line-height:1.45}.ok{color:#20df68}</style></head><body><main class="app"><div><img class="logo" src="apple-touch-icon.png?v=3" alt="Music DNA"><div class="brand">Ben's Music DNA</div><h1 id="title">Spotify rondt de bezorging af…</h1><p class="muted" id="text">Een ogenblik.</p></div></main><script>
(async()=>{const q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state'),error=q.get('error'),expected=sessionStorage.getItem('bmd_spotify_state'),verifier=sessionStorage.getItem('bmd_spotify_verifier'),returnUrl=sessionStorage.getItem('bmd_spotify_return')||'proefcadeau-v2.1.html';function fail(m){document.getElementById('title').textContent='Spotify-koppeling niet voltooid';document.getElementById('text').textContent=m}function readyUrl(){try{const u=new URL(returnUrl,location.href);u.searchParams.set('spotify','ready');return u.href}catch(e){return returnUrl+(returnUrl.indexOf('?')>=0?'&':'?')+'spotify=ready'}}if(error)return fail('Spotify heeft geen toestemming gegeven. Er is niets gewijzigd.');if(!code||!state||!expected||state!==expected||!verifier)return fail('De beveiligde Spotify-sessie kon niet worden gecontroleerd. Probeer het vanuit het cadeau opnieuw.');try{const body=new URLSearchParams({client_id:'97d634a60b824ecabfcc63790c0af5dd',grant_type:'authorization_code',code,redirect_uri:'https://bcim1958.github.io/bens-music-dna/test/spotify-callback.html',code_verifier:verifier});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw new Error('token');const t=await r.json();sessionStorage.setItem('bmd_spotify_access',t.access_token);sessionStorage.setItem('bmd_spotify_expires',String(Date.now()+(t.expires_in||3600)*1000));if(t.refresh_token)localStorage.setItem('bmd_spotify_refresh',t.refresh_token);sessionStorage.removeItem('bmd_spotify_state');sessionStorage.removeItem('bmd_spotify_verifier');document.getElementById('title').innerHTML='<span class="ok">Spotify is gekoppeld ✓</span>';document.getElementById('text').textContent='Je cadeau wordt nu bezorgd.';setTimeout(()=>location.replace(readyUrl()),650)}catch(e){fail('Spotify kon de toestemming niet afronden. Er is geen playlist aangemaakt.')}})();
</script></body></html>
