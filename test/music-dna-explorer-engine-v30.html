<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNA Explorer — Engine 30</title><style>
:root{--ink:#f5f0e8;--muted:#aaa7b6;--gold:#e6b65d;--line:#302d43;--panel:#10111c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#342044,#090a15 34%,#05060c 82%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:14px 13px 105px}.top{display:flex;justify-content:space-between;padding:5px 2px 10px}.brand{font-weight:900;letter-spacing:.12em}.brand b,.eyebrow{color:var(--gold)}.small{font-size:.76rem;color:var(--muted)}.crumbs{display:flex;gap:5px;overflow:auto;white-space:nowrap;padding:4px 1px 12px;font-size:.75rem}.crumbs button{border:0;background:none;color:var(--muted);padding:0}.crumbs button:last-child{color:var(--ink);font-weight:800}.card{border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#151426,#0a0b13);padding:20px}.eyebrow{font-size:.68rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(2.45rem,11vw,4.7rem)/.95 Georgia,serif;margin:.13em 0 .18em}h2{font:700 1.35rem/1.1 Georgia,serif;margin:.4em 0}.lead{color:#ded9e4;margin:0 0 14px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.fact{background:#0d0e17;border:1px solid var(--line);border-radius:15px;padding:10px}.fact b,.fact span{display:block}.fact span{font-size:.72rem;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#10111c;color:var(--ink);border-radius:999px;padding:9px 12px}.tab.on{border-color:var(--gold);color:var(--gold)}.section{border-top:1px solid var(--line);padding-top:14px}.doors{display:grid;gap:9px}.door{border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--ink);padding:13px;text-align:left}.door span,.door strong{display:block}.door span{font-size:.76rem;color:var(--muted)}.story p{color:#e3dfe7}.take{border-left:3px solid var(--gold);padding-left:12px;margin:18px 0}.source{display:block;width:100%;-webkit-appearance:none;appearance:none;color:#d8d3df;background:#0d0e17;text-decoration:none;border:1px dashed #494052;border-radius:15px;padding:11px;font:inherit;font-size:.82rem;text-align:left;cursor:pointer}.source b{color:#e6e0e9}.source .small{color:#aaa7b6}.source-note{font-size:.72rem;color:var(--muted);margin:7px 2px 0}.source-card{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:14px;margin-top:10px}.source-card h2{margin:.15em 0 .35em}.source-meta{font-size:.76rem;color:var(--muted);margin-bottom:10px}.source-card ul{margin:8px 0 12px;padding-left:20px;color:#e3dfe7}.bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 18px));display:grid;grid-template-columns:1fr 1fr;background:#080914ef;border:1px solid var(--line);border-radius:999px;padding:7px;backdrop-filter:blur(14px)}.bottom button{border:0;background:none;color:var(--ink);padding:10px}.bottom button:last-child{text-align:right;color:var(--gold)}
@media (max-width:760px){
  .app{min-height:auto;padding-bottom:18px}
  .bottom{position:static;left:auto;bottom:auto;transform:none;width:calc(100% - 26px);margin:0 auto 14px}

</style></head><body><main class="app"><header class="top"><div class="brand"><b>⌁</b> DNA EXPLORER</div><div class="small">ENGINE 30</div></header><div class="crumbs" id="crumbs"></div><div id="view"></div></main><nav class="bottom"><button onclick="back()">← Eén stap terug</button><button onclick="home()">⌂ Ghost</button></nav><script src="music-dna-explorer-graph-v16.js"></script><script src="music-dna-explorer-trails-v1.js"></script><script src="music-dna-explorer-story-sources-v1.js"></script><script src="music-dna-relation-registry-v1.js"></script><script>
const G=window.MUSIC_DNA_EXPLORER_GRAPH_V1;const T=window.MUSIC_DNA_EXPLORER_TRAILS_V1;const SS=window.MUSIC_DNA_EXPLORER_STORY_SOURCES_V1;const RR=window.MUSIC_DNA_RELATION_REGISTRY_V1;
Object.assign(G.nodes,{
skeleta:{type:"album",name:"Skeletá",eyebrow:"Studioalbum · 2025",orientation:"Het zesde studioalbum van Ghost."},
meliora:{type:"album",name:"Meliora",eyebrow:"Studioalbum · 2015",orientation:"Het derde studioalbum van Ghost."},
infestissumam:{type:"album",name:"Infestissumam",eyebrow:"Studioalbum · 2013",orientation:"Het tweede studioalbum van Ghost."},
opus:{type:"album",name:"Opus Eponymous",eyebrow:"Studioalbum · 2010",orientation:"Het debuutalbum van Ghost."}
});let path=[{kind:"artist",id:"ghost",label:"Ghost"}],tab="overview";
const ghostTabs={overview:"Overzicht",music:"Muziek",people:"Mensen",stories:"Verhalen",relations:"Verwantschap"};
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function crumbs(){document.getElementById("crumbs").innerHTML=path.map((x,i)=>'<button onclick="jump('+i+')">'+(i?'› ':'')+esc(x.label)+'</button>').join("")}
function jump(i){path=path.slice(0,i+1);let x=path[path.length-1];if(x.kind==="tab")tab=x.id;render()}
function home(){path=[{kind:"artist",id:"ghost",label:"Ghost"}];tab="overview";render()}
function back(){if(path.length>1){path.pop();let x=path[path.length-1];if(x.kind==="tab")tab=x.id;render()}}
function openTab(id){tab=id;path=[path[0],{kind:"tab",id,label:ghostTabs[id]}];render()}
function openNode(id){let n=G.nodes[id];if(!n)return;path.push({kind:n.type==="story"?"story":(n.type==="album"?"album":"node"),id,label:n.name});render()}
function openTrack(id){const tracks={rats:"Rats",dance:"Dance Macabre",faith:"Faith",life:"Life Eternal"};path.push({kind:"track",id,label:tracks[id]||id});render()}
function openShelf(id){const names={live:"Live",ep:"EP’s",single:"Singles",comp:"Compilaties"};path.push({kind:"shelf",id,label:names[id]});render()}
function teaser(id,rel,txt){let n=G.nodes[id];return '<button class="door" onclick="openNode(\''+id+'\')"><span>'+esc(rel)+'</span><strong>'+esc(n.name)+' →</strong><span>'+esc(txt)+'</span></button>'}
function relationTheme(b){
  let f=b.families||[], types=(b.relations||[]).map(r=>r.type);
  if(f.includes("recording"))return "Gedeelde muziek";
  if(f.includes("live")&&f.includes("influence"))return "Van voorbeeld naar podium";
  if(types.includes("career-show-guidepost"))return "Podium & ambitie";
  if(types.includes("foundational-musical-influence"))return "Muzikale wortels";
  if(types.includes("guitar-influence"))return "Gitaar-DNA";
  if(f.includes("influence"))return "Invloeden";
  return "Andere verbindingen";
}
function relationThemeIntro(theme){
  return {"Muzikale wortels":"Bouwstenen die Forge zelf verbindt aan het ontstaan van Ghost.","Gitaar-DNA":"Klassieke bands die Forge noemt in zijn vorming als gitarist.","Van voorbeeld naar podium":"Een voorbeeld werd later ook een concrete professionele ontmoeting.","Gedeelde muziek":"De relatie kreeg ook een tastbare muzikale vorm.","Podium & ambitie":"Voorbeelden voor schaal, presentatie of loopbaan — niet automatisch voor de klank.","Invloeden":"Andere onderbouwde muzikale invloeden.","Andere verbindingen":"Onderbouwde verbindingen die niet in de andere groepen vallen."}[theme]||"";
}
function relationBundleTeaser(b){let name=(b.entity||{}).name||b.entityId;let summary=b.relations.length+" verband"+(b.relations.length===1?"":"en")+" in één dossier";return '<button class="door" onclick="openRelationBundle(\''+esc(b.entityId)+'\')"><span>'+esc(relationTheme(b))+'</span><strong>'+esc(name)+' →</strong><span>'+esc(summary)+'</span></button>'}
function openRelationBundle(id){path.push({kind:"relationbundle",id,label:((RR.api.entity(id)||{}).name||id)});render()}
function relationBundle(id){let b=RR.api.relationshipBundles("ghost",{use:"explorer",confidence:"confirmed"}).find(x=>x.entityId===id);if(!b)return '<section class="card"><div class="eyebrow">Relatiedossier</div><h1>Niet gevonden</h1></section>';
let name=(b.entity||{}).name||id;
if(id==="abba"){
let strands=[
["De les zit in het liedje","Forge gebruikt ABBA niet als voorbeeld van hoe Ghost moet klinken. De terugkerende bewondering gaat juist over compositie: sterke melodieën, duidelijke hooks en liedjes die eenvoudig lijken maar uiterst precies in elkaar zitten."],
["Van invloed naar fysieke plek","Bij de opnamen van Impera komt die relatie onverwacht dichtbij. Ghost werkt in Atlantis/Metronome in Stockholm, de historische studio die sterk met ABBA verbonden is. Forge vertelt enthousiast over oude instrumenten en apparatuur die daar nog aanwezig zijn."],
["Een klein detail zegt soms meer","In een apart interview kiest Forge I Have A Dream wanneer hem naar een favoriete ABBA-song wordt gevraagd. Zo krijgt de brede uitspraak 'ABBA is een invloed' ineens een concreet luisterspoor."]
];
let cards=strands.map(x=>'<div class="fact"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join("");
return '<section class="card"><div class="eyebrow">Ghost ↔ ABBA · multi-source dossier</div><h1>Niet de klank, wel het liedje</h1><p class="lead">Bij ABBA vormt geen tijdlijn het sterkste verhaal. Verschillende gesprekken vullen juist drie kanten van dezelfde relatie in: schrijven, plek en een concreet liedje.</p><div class="section"><div class="eyebrow">De kern</div><p>ABBA helpt verklaren waarom Ghost ondanks zware gitaren zo nadrukkelijk op melodie en memorabele songs leunt. Forge komt daar in verschillende gesprekken op terug zonder te beweren dat Ghost als ABBA moet klinken.</p></div><div class="section"><div class="eyebrow">Drie verschillende vondsten</div>'+cards+'</div><div class="section"><div class="eyebrow">Waarom dit geen Iron Maiden-verhaal is</div><p class="small">Hier is nauwelijks sprake van jeugd → ontmoeting → samenwerking. De bronnen vormen eerder een thematisch mozaïek. De dossiermotor moet dus niet standaard een tijdlijn afdwingen.</p></div></section>'
}
if(id==="metallica"){
let strands=[
["Een vroege maatstaf","Forge beschrijft Metallica als een band die al vroeg liet zien hoe zware muziek tegelijk groot, direct en professioneel kon worden. De relatie begint dus als voorbeeld, niet als persoonlijke connectie."],
["Later dezelfde wereld in","Ghost komt vervolgens daadwerkelijk in Metallica's professionele omgeving terecht. Samen optreden verandert een verre invloed in een concrete collegiale relatie."],
["Enter Sandman maakt de cirkel zichtbaar","De Polar Music Prize vormt een aparte route naar Ghosts cover van Enter Sandman. Forge vertelt in interviews over de verantwoordelijkheid van zo'n bekende song en over het vinden van een Ghost-eigen benadering."]
];
let cards=strands.map(x=>'<div class="fact"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join("");
return '<section class="card"><div class="eyebrow">Ghost ↔ Metallica · multi-source dossier</div><h1>Van maatstaf naar eigen versie</h1><p class="lead">Bij Metallica lopen drie soorten relatie in elkaar over: voorbeeld, professionele nabijheid en uiteindelijk een concrete opname.</p><div class="section"><div class="eyebrow">De rode draad</div><p>Metallica staat eerst op afstand als voorbeeld. Later deelt Ghost het podium en de professionele wereld met de band. Met Enter Sandman krijgt die lange relatie uiteindelijk een hoorbaar resultaat.</p></div><div class="section"><div class="eyebrow">Drie hoofdstukken</div>'+cards+'</div><div class="section"><div class="eyebrow">Waarom dit weer anders is</div><p class="small">Dit dossier wordt niet gedragen door één chronologie of één soort invloed, maar door verschillende relatietypen die samen een cirkel vormen: bewonderen → ontmoeten → interpreteren.</p></div></section>'
}
if(id==="iron_maiden"){
let moments=[
["2017 · het jeugdmodel","Forge vertelt dat Iron Maiden hem muzikaal vormde, maar vooral dat Live After Death hem liet zien hoe een echte tour eruitzag. Met een kaart boek tekende hij als kind de speelsteden uit."],
["2018 · van atlas naar werkelijkheid","Na daadwerkelijk met Maiden te hebben getourd, vertelt Forge hetzelfde jeugdverhaal opnieuw. Nu voegt hij toe dat hij Steve Harris en de crew persoonlijk kent en dat beide tourcrews mensen delen."],
["2019–2022 · een blijvende leerschool","In latere gesprekken keert dezelfde kern terug: Maiden is niet alleen muziek, maar ook podiumproductie, werkethiek en een professionele school voor Ghost."],
["2023 · de relatie wordt muziek","Ghost neemt Phantom of the Opera op. Forge zegt dat juist de vriendschap en eerdere gezamenlijke tours extra druk geven: hij hoopt dat Maiden hun versie waardeert."]
];
let cards=moments.map(x=>'<div class="fact"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join("");
return '<section class="card"><div class="eyebrow">Ghost ↔ Iron Maiden · multi-source dossier</div><h1>Van atlas naar tourbus</h1><p class="lead">Forge komt jarenlang op dezelfde relatie terug. Niet iedere bron herhaalt hetzelfde: samen bouwen ze één steeds rijker verhaal.</p><div class="section"><div class="eyebrow">De rode draad</div><p>Als jongen bestudeert Forge Iron Maiden om te begrijpen hoe een grote rockband leeft en toert. Later staat Ghost zelf met Maiden op tour, leert hij de mensen achter de band kennen en wordt die jeugdinvloed een echte professionele relatie.</p></div><div class="section"><div class="eyebrow">Bronmomenten · door de tijd</div>'+cards+'</div><div class="section"><div class="eyebrow">Waarom meerdere bronnen?</div><p class="small">De kracht zit niet in vier keer hetzelfde vinkje. De terugkerende kern maakt het verband geloofwaardiger; de verschillen voegen atlas, tourlogistiek, crewcontacten, werkethiek, podiumambitie en uiteindelijk een cover toe.</p></div><div class="section"><div class="eyebrow">Onder de motorkap</div><p class="source-note">De Relation Registry bewaart de afzonderlijke feiten. Deze pagina vertelt wat de bronmomenten gezamenlijk zichtbaar maken.</p></div></section>'}
let facts=b.relations.map(r=>'<div class="fact"><span>'+esc(r.family+" · "+r.type)+'</span><b>'+esc(r.claim)+'</b></div>').join("");let sources=b.evidence.map(s=>'<div class="source-card"><div class="eyebrow">'+esc(s.provider)+'</div><h2>'+esc(s.title)+'</h2><div class="source-meta">'+esc(s.kind)+'</div></div>').join("");return '<section class="card"><div class="eyebrow">Ghost · gebundeld relatiedossier</div><h1>'+esc(name)+'</h1><p class="lead">'+b.relations.length+' onderliggende verband'+(b.relations.length===1?"":"en")+' · één zichtbare relatiepartner.</p><div class="section"><div class="eyebrow">Wat verbindt ze?</div>'+facts+'</div><div class="section"><div class="eyebrow">Bronnenkast</div>'+sources+'</div></section>'}
function tabs(){return '<div class="tabs">'+Object.entries(ghostTabs).map(([id,l])=>'<button class="tab '+(tab===id?"on":"")+'" onclick="openTab(\''+id+'\')">'+l+'</button>').join("")+'</div>'}
function artist(){let body='';if(tab==="overview")body='<div class="facts"><div class="fact"><span>Herkomst</span><b>Zweden</b></div><div class="fact"><span>Actief</span><b>sinds 2006</b></div><div class="fact"><span>Kernfiguur</span><b>Tobias Forge</b></div><div class="fact"><span>DNA-anker</span><b>Rats</b></div></div><div class="section"><div class="eyebrow">In één oogopslag</div><p>Ghost combineert theatrale hardrock en metal met een sterk melodisch karakter. Tobias Forge is de centrale maker; albums, podiumfiguren en uiteenlopende invloeden vormen samen de wereld rond de band.</p></div>';
if(tab==="music")body='<div class="section"><div class="eyebrow">Studioalbums · nieuwste eerst</div><div class="doors">'+
teaser("skeleta","studioalbum · 2025","Het zesde studioalbum van Ghost.")+
teaser("impera","studioalbum · 2022","Het vijfde studioalbum; hier liggen ook sporen naar Fredrik Åkesson en Klas Åhlund.")+
teaser("prequelle","studioalbum · 2018","Het vierde studioalbum; hier staat Rats op, een track uit jouw Music DNA.")+
teaser("meliora","studioalbum · 2015","Het derde studioalbum van Ghost.")+
teaser("infestissumam","studioalbum · 2013","Het tweede studioalbum van Ghost.")+
teaser("opus","studioalbum · 2010","Het debuutalbum van Ghost.")+
'</div><div class="eyebrow" style="margin-top:18px">Andere uitgaven</div><div class="doors"><button class="door" onclick="openShelf(\'live\')"><span>aparte plank</span><strong>Live →</strong><span>Livealbums en live-uitgaven.</span></button><button class="door" onclick="openShelf(\'ep\')"><span>aparte plank</span><strong>EP’s →</strong><span>EP-uitgaven los van de studioalbums.</span></button><button class="door" onclick="openShelf(\'single\')"><span>aparte plank</span><strong>Singles →</strong><span>Singles zonder de albumstructuur te vermengen.</span></button><button class="door" onclick="openShelf(\'comp\')"><span>aparte plank</span><strong>Compilaties →</strong><span>Verzameluitgaven apart gehouden.</span></button></div></div>';
if(tab==="people")body='<div class="section"><div class="eyebrow">Mensen</div><div class="doors">'+teaser("forge","maker","Centrale songwriter, zanger en bedenker achter Ghost.")+teaser("akesson","studiomuzikant","Opeth-gitarist die de gitaren op Impera inspeelde.")+teaser("ahlund","producer/songwriter","Producer en medecomponist op Impera.")+'</div></div>';
if(tab==="stories")body='<div class="section"><div class="eyebrow">Kies zelf hoeveel je wilt lezen</div><div class="doors">'+teaser("maiden-story","samen op tour","Forge bestudeerde Maiden als jongen; in 2017 trok Ghost met de band door Noord-Amerika.")+teaser("metallica-story","tour + cover","Van jeugdvoorbeeld en stadiontour naar Ghosts eigen Enter Sandman.")+teaser("singer-story","bijna een andere zanger","Meerdere beoogde zangers zeiden nee voordat Forge zelf achter de microfoon belandde.")+'</div></div>';
if(tab==="relations"){
  let bundles=RR.api.relationshipBundles("ghost",{use:"explorer",confidence:"confirmed"}).filter(b=>(b.entity||{}).type==="artist");
  let order=["Muzikale wortels","Gitaar-DNA","Van voorbeeld naar podium","Gedeelde muziek","Podium & ambitie","Invloeden","Andere verbindingen"];
  let groups={};bundles.forEach(b=>{let t=relationTheme(b);(groups[t]||(groups[t]=[])).push(b)});
  body='<div class="section"><div class="eyebrow">Verwantschap · geordend naar betekenis</div><p class="small">Niet één lange lijst, maar verschillende manieren waarop Ghost met andere artiesten verbonden is.</p>'+
    order.filter(t=>groups[t]).map(t=>'<div class="eyebrow" style="margin-top:18px">'+esc(t)+'</div><p class="source-note">'+esc(relationThemeIntro(t))+'</p><div class="doors">'+groups[t].map(relationBundleTeaser).join("")+'</div>').join("")+
    '<p class="source-note">Iedere artiest blijft één keer zichtbaar; alle afzonderlijke feiten en bronnen blijven in het dossier bewaard.</p></div>';
}
return '<section class="card"><div class="eyebrow">Artiest · direct overzicht</div><h1>Ghost</h1><p class="lead">Eerst de zekere kern. De diepte kies je zelf.</p>'+tabs()+body+'</section>'}
function node(id){let n=G.nodes[id];if(n.type==="story")return story(n);return '<section class="card"><div class="eyebrow">'+esc(n.eyebrow||n.type)+'</div><h1>'+esc(n.name)+'</h1><p class="lead">'+esc(n.orientation)+'</p><div class="section"><div class="eyebrow">Verder vanaf hier</div><p class="small">Dit is een proef van de navigatielogica. Gebruik de terugweg of de broodkruimel om een andere diepte te kiezen.</p></div></section>'}
function album(id){let n=G.nodes[id];if(id!=="prequelle")return '<section class="card"><div class="eyebrow">'+esc(n.eyebrow)+'</div><h1>'+esc(n.name)+'</h1><p class="lead">Albumoverzicht. De volledige tracklijst wordt op dezelfde vaste manier opgebouwd.</p></section>';
return '<section class="card"><div class="eyebrow">Studioalbum · 2018</div><h1>Prequelle</h1><p class="lead">Ghost · vierde studioalbum</p><div class="facts"><div class="fact"><span>Uitgebracht</span><b>2018</b></div><div class="fact"><span>Type</span><b>Studioalbum</b></div></div><div class="section"><div class="eyebrow">Tracks · albumvolgorde</div><div class="doors"><button class="door"><span>01</span><strong>Ashes</strong></button><button class="door" onclick="openTrack(\'rats\')"><span>02 · ◆ Music DNA</span><strong>Rats →</strong><span>Open de track voor context en verdere sporen.</span></button><button class="door"><span>03</span><strong>Faith</strong></button><button class="door"><span>04</span><strong>See the Light</strong></button><button class="door"><span>05</span><strong>Miasma</strong></button><button class="door"><span>06</span><strong>Dance Macabre</strong></button><button class="door"><span>07</span><strong>Pro Memoria</strong></button><button class="door"><span>08</span><strong>Witch Image</strong></button><button class="door"><span>09</span><strong>Helvetesfönster</strong></button><button class="door"><span>10</span><strong>Life Eternal</strong></button></div></div></section>'}
function track(id){if(id!=="rats")return "";return '<section class="card"><div class="eyebrow">Track · Prequelle · 2018</div><h1>Rats</h1><p class="lead">Track 2 · Ghost</p><div class="facts"><div class="fact"><span>Album</span><b>Prequelle</b></div><div class="fact"><span>Music DNA</span><b>◆ aanwezig</b></div></div><div class="section"><div class="eyebrow">In het kort</div><p>Rats is de eerste volledige song op Prequelle, na de korte opener Ashes. Tobias Forge schreef het nummer bewust als een grote, directe live-opener. Het pestbeeld werkt tegelijk als metafoor voor ideeën en gedrag die zich razendsnel verspreiden.</p></div><div class="section"><div class="eyebrow">Kies je verdieping</div><div class="doors"><button class="door" onclick="openTrackStory()"><span>ⓘ verhaal achter het nummer</span><strong>Waarom Rats meer is dan ratten →</strong><span>Over de pestmetafoor, publieke veroordeling en de gewenste stadionenergie.</span></button><button class="door" onclick="openNode(\'forge\')"><span>maker</span><strong>Tobias Forge →</strong><span>Naar de persoon achter Ghost.</span></button><button class="door" onclick="jump(path.length-2)"><span>albumcontext</span><strong>Prequelle →</strong><span>Terug naar het album en de volledige tracklijst.</span></button></div></div></section>'}
function openTrackStory(){path.push({kind:"trackstory",id:"rats-story",label:"Verhaal"});render()}
function trackStory(){return '<section class="card story"><div class="eyebrow">Nummerverhaal · Rats</div><h1>Waarom Rats meer is dan ratten</h1><p class="lead">De pest als beeld voor iets dat zich razendsnel door een samenleving verspreidt.</p><p>Bij Rats gebruikte Tobias Forge de builenpest niet simpelweg als historisch decor. Hij legde uit dat het nummer in wezen gaat over iets dat zich als een lopend vuur verspreidt en sneller schade aanricht dan mensen beseffen. De ratten functioneren daarbij als herkenbaar beeld voor besmetting en dreiging.</p><p>Forge verbond dat idee ook aan moderne publieke veroordeling. In interviews rond Prequelle sprak hij over de snelheid waarmee overtuigingen, beschuldigingen en groepsgedrag zich kunnen verspreiden, vooral online. Daarmee sluit Rats aan op het bredere thema van Prequelle: sterfelijkheid, rampspoed en overleven in onrustige tijden.</p><p>Muzikaal had Forge eveneens een heel concreet doel. Hij wilde een nummer dat onmiddellijk als grote opener kon werken. Een jeugdherinnering aan Ozzy Osbourne die I Don’t Know speelde tijdens het Moscow Music Peace Festival van 1989 diende als voorbeeld voor die energie: een nummer dat vanaf de eerste momenten een enorm publiek in beweging kan krijgen.</p><div class="take"><b>Kort samengevat</b><br>Rats koppelt een pestmetafoor aan moderne besmetting van ideeën en werd tegelijk bewust ontworpen als explosieve live-opener.</div><div class="section"><div class="eyebrow">Een spoor dat hier ontstaat</div><div class="doors">'+trailDoor("rats-moscow-1989")+'</div></div><button class="source" onclick="openSources()"><b>ⓘ Bronnen geraadpleegd · bronnenregister</b><br><span class="small">Hoe weten we dit? Bekijk de bewijslaag zonder DNA Explorer te verlaten.</span></button></section>'}
function openSources(){path.push({kind:"sources",id:"rats-sources",label:"Bronnen"});render()}
function sources(){return '<section class="card"><div class="eyebrow">Bronnenregister · Rats</div><h1>Hoe weten we dit?</h1><p class="lead">De bewijslaag achter het verhaal. Alleen als je zelf verder wilt lezen, ga je vanaf hier naar de oorspronkelijke publicatie.</p><div class="source-card"><div class="eyebrow">Bron 1 · interview</div><h2>Ghost Mastermind Tobias Forge Reports From Studio in First “Unmasked” U.S. Interview</h2><div class="source-meta">Revolver · Steve Appleford · 2 februari 2018</div><div class="small">Onderbouwt onder meer:</div><ul><li>de pest als bredere metafoor voor iets dat zich snel verspreidt;</li><li>de koppeling van Prequelle aan middeleeuwse én actuele maatschappelijke thema’s;</li><li>Forge’s vergelijking met snelle publieke veroordeling en online gedrag.</li></ul><a class="source" href="https://www.revolvermag.com/music/ghost-mastermind-tobias-forge-reports-studio-first-unmasked-us-interview/" target="_blank" rel="noopener noreferrer">↗ Originele publicatie · Revolver</a></div><div class="source-card"><div class="eyebrow">Bron 2 · interview</div><h2>Exclusive: Tobias Forge Talks Ghost’s New Song ‘Rats’ + New Album</h2><div class="source-meta">Loudwire · Brian Ives · 7 april 2018</div><div class="small">Onderbouwt onder meer:</div><ul><li>dat Rats bewust als grote, directe openingstrack werd ontworpen;</li><li>Forge’s jeugdherinnering aan Ozzy Osbourne met I Don’t Know op het Moscow Peace Festival;</li><li>de gewenste stadionenergie: een nummer dat een zeer groot publiek meteen in beweging kan krijgen.</li></ul><a class="source" href="https://loudwire.com/ghost-tobias-forge-ghost-new-song-rats-new-album/" target="_blank" rel="noopener noreferrer">↗ Originele publicatie · Loudwire</a></div><div class="source-note">← Eén stap terug brengt je rechtstreeks terug naar het Rats-verhaal.</div></section>'}
function trailDoor(id){let t=T.trails[id];if(!t)return "";return '<button class="door" onclick="openTrail(\''+id+'\')"><span>'+esc(t.door.relation)+'</span><strong>'+esc(t.door.title)+' →</strong><span>'+esc(t.door.summary)+'</span></button>'}

function story(n){let id=path[path.length-1].id,has=SS.stories[id];return '<section class="card story"><div class="eyebrow">'+esc(n.eyebrow)+'</div><h1>'+esc(n.name)+'</h1><div class="small">'+esc(n.publisher)+' · '+esc(n.readtime)+'</div><h2>'+esc(n.title)+'</h2>'+n.summary.map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="take"><b>Kort samengevat</b><br>'+esc(n.takeaway)+'</div>'+(has?'<button class="source" onclick="openStorySources(\''+id+'\')"><b>ⓘ Bronnen geraadpleegd · bronnenregister</b><br><span class="small">Hoe weten we dit? Bekijk de bewijslaag zonder DNA Explorer te verlaten.</span></button>':'')+'</section>'}

function storySources(id){let s=SS.stories[id];if(!s)return "";return '<section class="card"><div class="eyebrow">Bronnenregister · '+esc(s.label)+'</div><h1>Hoe weten we dit?</h1><p class="lead">De bewijslaag achter dit verhaal. Alleen vanaf hier verlaat je bewust DNA Explorer.</p>'+s.sources.map((x,i)=>'<div class="source-card"><div class="eyebrow">Bron '+(i+1)+' · '+esc(x.kind)+'</div><h2>'+esc(x.title)+'</h2><div class="source-meta">'+esc(x.meta)+'</div><div class="small">'+esc(x.supports)+'</div>'+x.links.map((l,j)=>'<a class="source" '+(j?'style="margin-top:8px" ':'')+'href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">↗ '+esc(l.label)+'</a>').join("")+'</div>').join("")+'<div class="source-note">← Eén stap terug brengt je rechtstreeks terug naar het verhaal.</div></section>'}
function rememberExplorer(){try{sessionStorage.setItem("dnaExplorer24",JSON.stringify({path,tab,scrollY:window.scrollY}))}catch(e){}}
function restoreExplorer(){try{const s=JSON.parse(sessionStorage.getItem("dnaExplorer24")||"null");if(s&&Array.isArray(s.path)&&s.path.length){path=s.path;tab=s.tab||tab;return s.scrollY||0}}catch(e){}return 0}
const restoreY=restoreExplorer();
function render(){crumbs();let x=path[path.length-1];document.getElementById("view").innerHTML=(x.kind==="artist"||x.kind==="tab")?artist():(x.kind==="shelf"?shelf(x.id):(x.kind==="album"?album(x.id):(x.kind==="track"?track(x.id):(x.kind==="trackstory"?trackStory():(x.kind==="sources"?sources():(x.kind==="trail"?trail(x.id):(x.kind==="trailsources"?trailSources(x.id):(x.kind==="storysources"?storySources(x.id):(x.kind==="relationbundle"?relationBundle(x.id):node(x.id))))))))));scrollTo(0,0)}render();if(restoreY)requestAnimationFrame(()=>scrollTo(0,restoreY));
