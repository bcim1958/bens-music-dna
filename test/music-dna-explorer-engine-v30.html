function relationTheme(b){
  let f=b.families||[], types=(b.relations||[]).map(r=>r.type);
  if(f.includes("recording"))return "Gedeelde muziek";
  if(f.includes("live")&&f.includes("influence"))return "Van voorbeeld naar podium";
  if(types.includes("career-show-guidepost"))return "Podium & ambitie";
  if(types.includes("foundational-musical-influence"))return "Muzikale wortels";
  if(types.includes("guitar-influence"))return "Gitaar-DNA";
  if(f.includes("influence"))return "Invloeden";
  return "Andere verbindingen";
}

function track(id){if(id!=="rats")return "";return '<section class="card"><div class="eyebrow">Track · Prequelle · 2018</div><h1>Rats</h1><p class="lead">Track 2 · Ghost</p><div class="facts"><div class="fact"><span>Album</span><b>Prequelle</b></div><div class="fact"><span>Music DNA</span><b>◆ aanwezig</b></div></div><div class="section"><div class="eyebrow">In het kort</div><p>Rats is de eerste volledige song op Prequelle, na de korte opener Ashes. Tobias Forge schreef het nummer bewust als een grote, directe live-opener. Het pestbeeld werkt tegelijk als metafoor voor ideeën en gedrag die zich razendsnel verspreiden.</p></div><div class="section"><div class="eyebrow">Kies je verdieping</div><div class="doors"><button class="door" onclick="openTrackStory()"><span>ⓘ verhaal achter het nummer</span><strong>Waarom Rats meer is dan ratten →</strong><span>Over de pestmetafoor, publieke veroordeling en de gewenste stadionenergie.</span></button><button class="door" onclick="openNode(\'forge\')"><span>maker</span><strong>Tobias Forge →</strong><span>Naar de persoon achter Ghost.</span></button><button class="door" onclick="jump(path.length-2)"><span>albumcontext</span><strong>Prequelle →</strong><span>Terug naar het album en de volledige tracklijst.</span></button></div></div></section>'}
function openTrackStory(){path.push({kind:"trackstory",id:"rats-story",label:"Verhaal"});render()}
function trackStory(){return '<section class="card story"><div class="eyebrow">Nummerverhaal · Rats</div><h1>Waarom Rats meer is dan ratten</h1><p class="lead">De pest als beeld voor iets dat zich razendsnel door een samenleving verspreidt.</p><p>Bij Rats gebruikte Tobias Forge de builenpest niet simpelweg als historisch decor. Hij legde uit dat het nummer in wezen gaat over iets dat zich als een lopend vuur verspreidt en sneller schade aanricht dan mensen beseffen. De ratten functioneren daarbij als herkenbaar beeld voor besmetting en dreiging.</p><p>Forge verbond dat idee ook aan moderne publieke veroordeling. In interviews rond Prequelle sprak hij over de snelheid waarmee overtuigingen, beschuldigingen en groepsgedrag zich kunnen verspreiden, vooral online. Daarmee sluit Rats aan op het bredere thema van Prequelle: sterfelijkheid, rampspoed en overleven in onrustige tijden.</p><p>Muzikaal had Forge eveneens een heel concreet doel. Hij wilde een nummer dat onmiddellijk als grote opener kon werken. Een jeugdherinnering aan Ozzy Osbourne die I Don’t Know speelde tijdens het Moscow Music Peace Festival van 1989 diende als voorbeeld voor die energie: een nummer dat vanaf de eerste momenten een enorm publiek in beweging kan krijgen.</p><div class="take"><b>Kort samengevat</b><br>Rats koppelt een pestmetafoor aan moderne besmetting van ideeën en werd tegelijk bewust ontworpen als explosieve live-opener.</div><div class="section"><div class="eyebrow">Een spoor dat hier ontstaat</div><div class="doors">'+trailDoor("rats-moscow-1989")+'</div></div><button class="source" onclick="openSources()"><b>ⓘ Bronnen geraadpleegd · bronnenregister</b><br><span class="small">Hoe weten we dit? Bekijk de bewijslaag zonder DNA Explorer te verlaten.</span></button></section>'}
function openSources(){path.push({kind:"sources",id:"rats-sources",label:"Bronnen"});render()}
function sources(){return '<section class="card"><div class="eyebrow">Bronnenregister · Rats</div><h1>Hoe weten we dit?</h1><p class="lead">De bewijslaag achter het verhaal. Alleen als je zelf verder wilt lezen, ga je vanaf hier naar de oorspronkelijke publicatie.</p><div class="source-card"><div class="eyebrow">Bron 1 · interview</div><h2>Ghost Mastermind Tobias Forge Reports From Studio in First “Unmasked” U.S. Interview</h2><div class="source-meta">Revolver · Steve Appleford · 2 februari 2018</div><div class="small">Onderbouwt onder meer:</div><ul><li>de pest als bredere metafoor voor iets dat zich snel verspreidt;</li><li>de koppeling van Prequelle aan middeleeuwse én actuele maatschappelijke thema’s;</li><li>Forge’s vergelijking met snelle publieke veroordeling en online gedrag.</li></ul><a class="source" href="https://www.revolvermag.com/music/ghost-mastermind-tobias-forge-reports-studio-first-unmasked-us-interview/" target="_blank" rel="noopener noreferrer">↗ Originele publicatie · Revolver</a></div><div class="source-card"><div class="eyebrow">Bron 2 · interview</div><h2>Exclusive: Tobias Forge Talks Ghost’s New Song ‘Rats’ + New Album</h2><div class="source-meta">Loudwire · Brian Ives · 7 april 2018</div><div class="small">Onderbouwt onder meer:</div><ul><li>dat Rats bewust als grote, directe openingstrack werd ontworpen;</li><li>Forge’s jeugdherinnering aan Ozzy Osbourne met I Don’t Know op het Moscow Peace Festival;</li><li>de gewenste stadionenergie: een nummer dat een zeer groot publiek meteen in beweging kan krijgen.</li></ul><a class="source" href="https://loudwire.com/ghost-tobias-forge-ghost-new-song-rats-new-album/" target="_blank" rel="noopener noreferrer">↗ Originele publicatie · Loudwire</a></div><div class="source-note">← Eén stap terug brengt je rechtstreeks terug naar het Rats-verhaal.</div></section>'}
function trailDoor(id){let t=T.trails[id];if(!t)return "";return '<button class="door" onclick="openTrail(\''+id+'\')"><span>'+esc(t.door.relation)+'</span><strong>'+esc(t.door.title)+' →</strong><span>'+esc(t.door.summary)+'</span></button>'}
function openTrail(id){let t=T.trails[id];if(!t)return;path.push({kind:"trail",id,label:t.label});render()}
function openTrailSources(id){let t=T.trails[id];if(!t)return;path.push({kind:"trailsources",id,label:"Bronnen"});render()}
function trail(id){let t=T.trails[id];if(!t)return "";return '<section class="card story"><div class="eyebrow">'+esc(t.eyebrow)+'</div><h1>'+esc(t.title)+'</h1><p class="lead">'+esc(t.lead)+'</p>'+t.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="take"><b>'+esc(t.takeawayTitle)+'</b><br>'+esc(t.takeaway)+'</div><button class="source" onclick="openTrailSources(\''+id+'\')"><b>ⓘ Bronnen geraadpleegd · bronnenregister</b><br><span class="small">Bekijk waarop dit zijspoor rust zonder DNA Explorer te verlaten.</span></button></section>'}
function trailSources(id){let t=T.trails[id];if(!t)return "";return '<section class="card"><div class="eyebrow">Bronnenregister · '+esc(t.label)+'</div><h1>Hoe weten we dit?</h1><p class="lead">De bewijslaag achter dit zijspoor. Alleen vanaf hier verlaat je bewust DNA Explorer.</p>'+t.sources.map((s,i)=>'<div class="source-card"><div class="eyebrow">Bron '+(i+1)+' · '+esc(s.kind)+'</div><h2>'+esc(s.title)+'</h2><div class="source-meta">'+esc(s.meta)+'</div><div class="small">'+esc(s.supports)+'</div>'+s.links.map((l,j)=>'<a class="source" '+(j?'style="margin-top:8px" ':'')+'href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">↗ '+esc(l.label)+'</a>').join("")+'</div>').join("")+'<div class="source-note">← Eén stap terug brengt je rechtstreeks terug naar dit zijspoor.</div></section>'}
function shelf(id){const names={live:"Live",ep:"EP’s",single:"Singles",comp:"Compilaties"};return '<section class="card"><div class="eyebrow">Andere uitgaven</div><h1>'+names[id]+'</h1><p class="lead">Deze categorie staat bewust los van de studioalbums. De volledige inhoud volgt na de structuurproef.</p></section>'}
function story(n){let id=path[path.length-1].id,has=SS.stories[id];return '<section class="card story"><div class="eyebrow">'+esc(n.eyebrow)+'</div><h1>'+esc(n.name)+'</h1><div class="small">'+esc(n.publisher)+' · '+esc(n.readtime)+'</div><h2>'+esc(n.title)+'</h2>'+n.summary.map(p=>'<p>'+esc(p)+'</p>').join("")+'<div class="take"><b>Kort samengevat</b><br>'+esc(n.takeaway)+'</div>'+(has?'<button class="source" onclick="openStorySources(\''+id+'\')"><b>ⓘ Bronnen geraadpleegd · bronnenregister</b><br><span class="small">Hoe weten we dit? Bekijk de bewijslaag zonder DNA Explorer te verlaten.</span></button>':'')+'</section>'}
function openStorySources(id){let s=SS.stories[id];if(!s)return;path.push({kind:"storysources",id,label:"Bronnen"});render()}
function storySources(id){let s=SS.stories[id];if(!s)return "";return '<section class="card"><div class="eyebrow">Bronnenregister · '+esc(s.label)+'</div><h1>Hoe weten we dit?</h1><p class="lead">De bewijslaag achter dit verhaal. Alleen vanaf hier verlaat je bewust DNA Explorer.</p>'+s.sources.map((x,i)=>'<div class="source-card"><div class="eyebrow">Bron '+(i+1)+' · '+esc(x.kind)+'</div><h2>'+esc(x.title)+'</h2><div class="source-meta">'+esc(x.meta)+'</div><div class="small">'+esc(x.supports)+'</div>'+x.links.map((l,j)=>'<a class="source" '+(j?'style="margin-top:8px" ':'')+'href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">↗ '+esc(l.label)+'</a>').join("")+'</div>').join("")+'<div class="source-note">← Eén stap terug brengt je rechtstreeks terug naar het verhaal.</div></section>'}
function rememberExplorer(){try{sessionStorage.setItem("dnaExplorer24",JSON.stringify({path,tab,scrollY:window.scrollY}))}catch(e){}}
function restoreExplorer(){try{const s=JSON.parse(sessionStorage.getItem("dnaExplorer24")||"null");if(s&&Array.isArray(s.path)&&s.path.length){path=s.path;tab=s.tab||tab;return s.scrollY||0}}catch(e){}return 0}
const restoreY=restoreExplorer();
function explorerHome(){path=[{kind:"explorerhome",id:"explorerhome",label:"Explorer"}];render()}
function explorerEntryButton(e){let detail=e.mode==="search"?"Kies zelf een bekende artiest":(e.items.length?e.items.length+" beschikbare wereld"+(e.items.length===1?"":"en"):"Nog geen gekoppelde wereld");return '<button class="door" onclick="openExplorerEntry(\''+e.type+'\')"><span>Vertrekpunt</span><strong>'+esc(e.label)+' →</strong><span>'+esc(detail)+'</span></button>'}
function explorerContext(){return {todayArtistIds:["ghost","voivod"],weekArtistIds:["ghost","voivod","shiraz_lane"],latestWLabel:"Recente W-lijst",latestWArtistIds:["voivod","ghost"]}}
function explorerHomeView(){
  const fallback=[
    {type:"free",label:"Vrij kiezen",mode:"search",items:[]},
    {type:"today",label:"Vandaag",items:[{id:"ghost"},{id:"voivod"}]},
    {type:"week",label:"Deze week",items:[{id:"ghost"},{id:"voivod"},{id:"shiraz_lane"}]},
    {type:"w-list",label:"Recente W-lijst",items:[{id:"voivod"},{id:"ghost"}]},
    {type:"genre",label:"Genre",items:[]}
  ];
  let es=fallback,notice="";
  try{
    if(RR&&RR.api&&typeof RR.api.explorerEntrypoints==="function")es=RR.api.explorerEntrypoints(explorerContext());
    else notice="Registry-ingangen nog niet beschikbaar; veilige proefingangen actief.";
  }catch(err){
    notice="Registry-fout: "+((err&&err.name)?err.name+": ":"")+((err&&err.message)?err.message:String(err))+" · veilige proefingangen actief.";
  }
  return '<section class="card"><div class="eyebrow">DNA Explorer · wandelproef</div><h1>Waar wil je beginnen?</h1><p class="lead">Vijf opritten, daarna één en dezelfde muziekwereld. Geen vaste route.</p><p class="small">Registry geladen: '+esc(RRVER)+' · script: '+esc(RRLOAD)+' · fetch/eval: '+esc(RRFETCH)+'</p>'+(notice?'<p class="small">'+esc(notice)+'</p>':"")+'<div class="doors">'+es.map(explorerEntryButton).join("")+'</div></section>';
}
function openExplorerEntry(type){let e=RR.api.explorerEntrypoints(explorerContext()).find(x=>x.type===type);path.push({kind:"explorerentry",id:type,label:e.label});render()}
function explorerEntryView(type){let e=RR.api.explorerEntrypoints(explorerContext()).find(x=>x.type===type);let items=e.items;if(type==="free")items=[{id:"ghost",name:"Ghost",type:"artist"},{id:"voivod",name:"Voïvod",type:"artist"},{id:"shiraz_lane",name:"Shiraz Lane",type:"artist"}];return '<section class="card"><div class="eyebrow">'+esc(e.label)+'</div><h1>Kies een wereld</h1><div class="doors">'+items.map(x=>'<button class="door" onclick="openExplorerWorld(\''+x.id+'\')"><span>'+esc(x.type)+'</span><strong>'+esc(x.name)+' →</strong></button>').join("")+'</div></section>'}
function openExplorerWorld(id){let n=RR.api.explorerNode(id);if(!n)return;path.push({kind:"explorerworld",id,label:n.name});render()}
function explorerWorldView(id){let n=RR.api.explorerNode(id);if(!n)return '<section class="card"><h1>Wereld niet gevonden</h1></section>';let doors=n.links.map(x=>'<button class="door" onclick="openExplorerWorld(\''+x.id+'\')"><span>'+esc((x.families||[]).join(" · ")||x.type)+'</span><strong>'+esc(x.name)+' →</strong><span>'+x.relationCount+' onderbouwd verband'+(x.relationCount===1?"":"en")+'</span></button>').join("");return '<section class="card"><div class="eyebrow">'+esc(n.type)+' · vrije wandeling</div><h1>'+esc(n.name)+'</h1><p class="lead">Kies zelf welke deur je nu wilt openen.</p><div class="doors">'+(doors||'<div class="fact"><b>Nog geen deuren</b><span>Deze wereld kan naar de researchvoorraad.</span></div>')+'</div></section>'}
function render(){
  crumbs();
  const x=path[path.length-1];
  let html="";
  if(x.kind==="explorerhome") html=explorerHomeView();
  else if(x.kind==="explorerentry") html=explorerEntryView(x.id);
  else if(x.kind==="explorerworld") html=explorerWorldView(x.id);
  else if(x.kind==="artist"||x.kind==="tab") html=artist();
  else if(x.kind==="shelf") html=shelf(x.id);
  else if(x.kind==="album") html=album(x.id);
  else if(x.kind==="track") html=track(x.id);
  else if(x.kind==="trackstory") html=trackStory();
  else if(x.kind==="sources") html=sources();
  else if(x.kind==="trail") html=trail(x.id);
  else if(x.kind==="trailsources") html=trailSources(x.id);
  else if(x.kind==="storysources") html=storySources(x.id);
  else if(x.kind==="relationbundle") html=relationBundle(x.id);
  else html=node(x.id);
  document.getElementById("view").innerHTML=html;
  scrollTo(0,0);
}
explorerHome();
if(restoreY)requestAnimationFrame(()=>scrollTo(0,restoreY));
</script></body></html>
