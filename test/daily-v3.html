<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>Music DNA</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 54px) 20px 48px}.top{text-align:center;margin-bottom:28px}.logo{width:72px;height:72px;border-radius:17px}.brand,.eye{color:var(--g);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.brand{font-size:14px;margin-top:10px}.muted{color:var(--m)}.eye{font-size:12px}.circle{width:100px;height:100px;border:2px solid var(--g);border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;color:var(--g);font-size:38px;font-weight:850}h1{font-size:30px;line-height:1.08;margin:6px 0 8px}h3{font-size:20px;margin:0 0 5px}.intro{font-size:17px;line-height:1.45}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.meta{font-size:14px;color:#bbc7c1;margin-top:8px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.tag{font-size:13px;background:rgba(30,215,96,.1);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b}.back{background:none;border:0;color:var(--g);font-size:17px;padding:4px 0 14px}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{border:1px solid var(--l);background:rgba(255,255,255,.07);color:#fff;border-radius:17px;padding:16px 8px;font-size:16px;font-weight:700}.footer{text-align:center;color:#718078;font-size:12px;margin-top:26px}</style></head><body><main class="app"><div class="top"><img class="logo" src="apple-touch-icon.png?v=3" alt="Music DNA"><div class="brand">Ben's Music DNA</div><div class="muted" id="cycle">Ontdek-DNA</div></div><div id="screen"></div><div class="footer">3 per dag · 21 per week · Twijfel krijgt één kwartaalherkansing</div></main><script src="music-dna-data-v1.3.js"></script><script src="music-dna-candidates-w35-v1.js"></script><script src="music-dna-candidates-w36-v1.js"></script><script src="music-dna-w35-reserve-v1.js"></script><script src="music-dna-delivery-registry-v1.js"></script><script src="music-dna-weeks-v1.js"></script><script>(async function(){var S=document.getElementById('screen'),C=document.getElementById('cycle'),CFG=MUSIC_DNA_WEEKS.resolve(new Date()),WEEK=CFG.key,CAND=null,labels={raak:'❤️ Raak',goed:'👍 Goed',twijfel:'😐 Twijfel',nee:'👎 Niet'};function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function load(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src+'?v=20260908.1';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}function stateKey(d){return'bmd-week-'+WEEK+'-day'+d+'-v1'}function selectionKey(d){return'bmd-week-'+WEEK+'-day'+d+'-selection-v1'}function completed(d){var q=read(selectionKey(d),null),st=read(stateKey(d),{});return !!(q&&q.ids&&q.ids.length===3&&q.ids.every(function(id){return st[id]&&st[id].rating}))}function calendarDay(){var now=new Date();if(now<CFG.start)return 0;if(now>=CFG.end)return 7;return Math.min(7,Math.floor((now-CFG.start)/86400000)+1)}function targetDay(){var max=calendarDay();for(var d=1;d<=max;d++)if(!completed(d))return d;return max}function excluded(){var o={},m=MUSIC_DNA_LEARNING.read(),sig=m.signals||{};for(var id in sig)o[id]=1;for(var d=1;d<=7;d++){var q=read(selectionKey(d),null);if(q&&q.ids)q.ids.forEach(function(x){o[x]=1})}return Object.keys(o)}function selection(d){var q=read(selectionKey(d),null);if(q&&q.ids&&q.ids.length===3)return q;var a=MUSIC_DNA_SELECTOR.chooseBatch(CAND.tracks,{size:3,excludeIds:excluded()});if(!a||a.length!==3)throw new Error('voorraad');q={ids:a.map(function(x){return x.id}),createdAt:new Date().toISOString()};write(selectionKey(d),q);return q}function track(id){return CAND.tracks[id]||MUSIC_DNA_W36_CANDIDATES.tracks[id]||MUSIC_DNA_W35_CANDIDATES.tracks[id]||MUSIC_DNA_DB.tracks[id]}function country(x){return({'United States':'Verenigde Staten','United Kingdom':'Verenigd Koninkrijk','Sweden':'Zweden','Norway':'Noorwegen','Australia':'Australië','Ireland':'Ierland','Belgium':'België','Finland':'Finland','Iceland':'IJsland','Canada':'Canada'})[x]||x||'Onbekend'}function caughtUp(){C.textContent='Ontdek-DNA · '+CFG.display;S.innerHTML='';S.appendChild(el('div','circle','✓'));S.appendChild(el('div','eye','Vandaag voltooid'));S.appendChild(el('h1','','Je bent helemaal bij'));S.appendChild(el('div','intro','De gemiste dagen én de 3 ontdekkingen van vandaag zijn beoordeeld. Morgen staan de volgende 3 voor je klaar.'))}function renderDay(d){C.textContent='Ontdek-DNA · '+CFG.display+' · Dag '+d+' van 7';var q=selection(d),st=read(stateKey(d),{}),done=q.ids.filter(function(id){return st[id]&&st[id].rating}).length;S.innerHTML='';S.appendChild(el('div','circle',done===3?'✓':String(3-done)));S.appendChild(el('div','eye',d<calendarDay()?'Inhalen':'Vandaag'));S.appendChild(el('h1','',d<calendarDay()?'Je gemiste 3 ontdekkingen':'Jouw 3 ontdekkingen'));S.appendChild(el('div','intro',d<calendarDay()?'We halen W37 rustig op volgorde in.':'Drie nieuwe nummers voor je wekelijkse ontdekking.'));q.ids.forEach(function(id,i){var t=track(id),c=el('section','card'),r=st[id]&&st[id].rating;c.appendChild(el('div','eye',r?'✓ Beoordeeld':(i+1)+' van 3'));c.appendChild(el('h3','',t.identity.title));c.appendChild(el('div','muted',t.identity.artist));c.appendChild(el('div','meta',country(t.identity.country)+' · '+t.identity.releaseYear+' · '+t.identity.albumOrRelease));var tags=el('div','tags');((t.taxonomy&&t.taxonomy.allMusicStyles)||[]).slice(0,2).forEach(function(x){tags.appendChild(el('span','tag',x))});c.appendChild(tags);if(r)c.appendChild(el('div','meta',labels[r]));c.onclick=function(){detail(d,id)};S.appendChild(c)});if(done===3){var p=el('section','panel');p.appendChild(el('div','eye','Set voltooid'));p.appendChild(el('div','intro',d<calendarDay()?'Deze set is bijgewerkt. De volgende gemiste dag staat klaar.':'Je bent voor deze dag klaar.'));var b=el('button','btn',d<calendarDay()?'Ga naar de volgende set':'Klaar');b.onclick=function(){if(d<calendarDay())render();else caughtUp()};p.appendChild(b);S.appendChild(p)}}function detail(d,id){var t=track(id),st=read(stateKey(d),{});S.innerHTML='';var b=el('button','back','‹ Terug');b.onclick=function(){renderDay(d)};S.appendChild(b);S.appendChild(el('div','eye',country(t.identity.country)+' · '+t.identity.releaseYear));S.appendChild(el('h1','',t.identity.title));S.appendChild(el('h3','muted',t.identity.artist));var sp=el('button','btn','▶ Open in Spotify');sp.onclick=function(){location.href=t.spotifyUrl};S.appendChild(sp);var why=el('section','panel');why.appendChild(el('div','eye','Waarom voor jou?'));why.appendChild(el('div','intro',t.editorial.whyForYou));S.appendChild(why);var r=el('section','panel');r.appendChild(el('div','eye','Jouw oordeel'));var g=el('div','ratings');['raak','goed','twijfel','nee'].forEach(function(v){var x=el('button','rate',labels[v]);x.onclick=function(){st[id]={rating:v,ratedAt:new Date().toISOString()};write(stateKey(d),st);render()};g.appendChild(x)});r.appendChild(g);S.appendChild(r)}function render(){var cal=calendarDay();if(cal===0){C.textContent='Ontdek-DNA · '+CFG.display;S.innerHTML='<section class="panel"><div class="eye">Klaar voor de week</div><h1>'+CFG.display+' start zondag</h1></section>';return}var d=targetDay();if(d===7&&completed(7)){C.textContent='Ontdek-DNA · '+CFG.display;S.innerHTML='<section class="panel"><div class="eye">Week compleet</div><h1>21 beoordelingen klaar</h1><button class="btn" id="gift">🎁 Bekijk mijn cadeau</button></section>';document.getElementById('gift').onclick=function(){location.href='zaterdagcadeau.html?week='+encodeURIComponent(WEEK)};return}renderDay(d)}function fail(){S.innerHTML='<section class="panel"><div class="eye">Veilige wachtstand</div><h1>Deze week staat nog niet klaar</h1><div class="intro">Er is niets gewijzigd.</div></section>'}try{await load(CFG.candidateFile);CAND=window[CFG.candidateGlobal];if(!CAND||!CAND.tracks||Object.keys(CAND.tracks).length!==21)return fail();await load('music-dna-learning-v1.js');await load('music-dna-positive-bank-v1.js');await load('music-dna-selector-v1.js');render()}catch(e){fail()}})();</script></body></html>
