<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>Music DNA</title><style>:root{--g:#1ed760;--v:#a978ff;--t:#f5f8f6;--m:#aebbb5;--c:rgba(255,255,255,.065);--l:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 54px) 20px 48px}.top{text-align:center;margin-bottom:28px}.logo{width:72px;height:72px;border-radius:17px}.brand,.eye{color:var(--g);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.brand{font-size:14px;margin-top:10px}.muted{color:var(--m)}.eye{font-size:12px}.circle{width:100px;height:100px;border:2px solid var(--g);border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;color:var(--g);font-size:38px;font-weight:850}h1{font-size:30px;line-height:1.08;margin:6px 0 8px}h3{font-size:20px;margin:0 0 5px}.intro{font-size:17px;line-height:1.45}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:13px 0}.card{cursor:pointer}.reserve{border-color:rgba(169,120,255,.5);background:rgba(169,120,255,.08)}.reserve .eye{color:var(--v)}.stock{font-size:14px;margin:10px 0 16px;color:#c9d2ce}.meta{font-size:14px;color:#bbc7c1;margin-top:8px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.tag{font-size:13px;background:rgba(30,215,96,.1);border:1px solid rgba(30,215,96,.22);padding:7px 10px;border-radius:999px}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:va +WEEK+'-day'+d+'-reserve-selection-v1'}function officialCompleted(d){var q=read(selectionKey(d),null),st=read(stateKey(d),{});return !!(q&&q.ids&&q.ids.length===3&&q.ids.every(function(id){return st[id]&&st[id].rating}))}function reserveCompleted(d){var q=read(reserveSelectionKey(d),null);if(!q||!q.id)return true;var st=read(reserveStateKey(d),{});return !!(st[q.id]&&st[q.id].rating)}function calendarDay(){var now=new Date();if(now<CFG.start)return 0;if(now>=CFG.end)return 7;return Math.min(7,Math.floor((now-CFG.start)/86400000)+1)}function needFourth(){return MUSIC_DNA_POSITIVE_BANK.recommendedDailyCount(WEEK)===4}function dayResolved(d){if(!officialCompleted(d))return false;var rq=read(reserveSelectionKey(d),null);if(rq&&rq.id)return reserveCompleted(d);return !needFourth()}function targetDay(){var max=calendarDay();for(var d=1;d<=max;d++)if(!dayResolved(d))return d;return max}function excluded(){var o={},m=MUSIC_DNA_LEARNING.read(),sig=m.signals||{};for(var id in sig)o[id]=1;for(var d=1;d<=7;d++){var q=read(selectionKey(d),null);if(q&&q.ids)q.ids.forEach(function(x){o[x]=1});var rq=read(reserveSelectionKey(d),null);if(rq&&rq.id)o[rq.id]=1}return Object.keys(o)}function selection(d){var q=read(selectionKey(d),null);if(q&&q.ids&&q.ids.length===3)return q;var a=MUSIC_DNA_SELECTOR.chooseBatch(CAND.tracks,{size:3,excludeIds:excluded()});if(!a||a.length!==3)throw new Error('voorraad-officieel');q={ids:a.map(function(x){return x.id}),createdAt:new Date().toISOString(),meter:true};write(selectionKey(d),q);return q}function reserveSelection(d){var q=read(reserveSelectionKey(d),null);if(q&&q.id)return q;if(!needFourth())return null;var a=MUSIC_DNA_SELECTOR.chooseBatch(CAND.tracks,{size:1,excludeIds:excluded()});if(!a||a.length!==1)throw new Error('voorraad-slot4');q={id:a[0].id,createdAt:new Date().toISOString(),meter:false,purpose:'positive-reserve'};write(reserveSelectionKey(d),q);return q}function track(id){return CAND.tracks[id]||(window.MUSIC_DNA_W37_CANDIDATES&&MUSIC_DNA_W37_CANDIDATES.tracks[id])||MUSIC_DNA_W36_CANDIDATES.tracks[id]||MUSIC_DNA_W35_CANDIDATES.tracks[id]||MUSIC_DNA_DB.tracks[id]}function country(x){return({'United States':'Verenigde Staten','United Kingdom':'Verenigd Koninkrijk','Sweden':'Zweden','Norway':'Noorwegen','Australia':'Australië','Ireland':'Ierland','Belgium':'België','Finland':'Finland','Iceland':'IJsland','Canada':'Canada','Germany':'Duitsland','Netherlands':'Nederland'})[x]||x||'Onbekend'}function stockLine(){var inv=MUSIC_DNA_POSITIVE_BANK.inventory(WEEK);return'Positieve zaterdagvoorraad: '+inv.fresh+' / '+inv.targetReserve+(inv.healthy?' ✓':' · aanvullen')}function caughtUp(){C.textContent='Ontdek-DNA · '+CFG.display;S.innerHTML='';S.appendChild(el('div','circle','✓'));S.appendChild(el('div','eye','Vandaag voltooid'));S.appendChild(el('h1','','Je bent helemaal bij'));S.appendChild(el('div','intro','De drie officiële ontdekkingen zijn beoordeeld. Een eventuele vierde plek van vandaag is uitsluitend gebruikt om de positieve zaterdagvoorraad te versterken.'));S.appendChild(el('div','stock',stockLine()))}function cardFor(d,id,i,isReserve,st){var t=track(id),c=el('section','card'+(isReserve?' reserve':'')),r=st[id]&&st[id].rating;c.appendChild(el('div','eye',r?'✓ Beoordeeld':(isReserve?'Voorraadplek 4':(i+1)+' van 3')));c.appendChild(el('h3','',t.identity.title));c.appendChild(el('div','muted',t.identity.artist));c.appendChild(el('div','meta',country(t.identity.country)+' · '+t.identity.releaseYear+' · '+t.identity.albumOrRelease));var tags=el('div','tags');((t.taxonomy&&t.taxonomy.allMusicStyles)||[]).slice(0,2).forEach(function(x){tags.appendChild(el('span','tag',x))});c.appendChild(tags);if(isReserve)c.appendChild(el('div','meta','Deze beoordeling telt niet mee voor de Muziekmeter. RAAK/GOED vult alleen de zaterdagvoorraad aan.'));if(r)c.appendChild(el('div','meta',labels[r]));c.onclick=function(){detail(d,id,isReserve)};return c}function renderDay(d){C.textContent='Ontdek-DNA · '+CFG.display+' · Dag '+d+' van 7';var q=selection(d),st=read(stateKey(d),{}),done=q.ids.filter(function(id){return st[id]&&st[id].rating}).length,rq=read(reserveSelectionKey(d),null),rst={};if(!rq&&needFourth())rq=reserveSelection(d);if(rq&&rq.id)rst=read(reserveStateKey(d),{});var reserveDone=!rq||!!(rst[rq.id]&&rst[rq.id].rating);S.innerHTML='';var remaining=(3-done)+(rq&&!reserveDone?1:0);S.appendChild(el('div','circle',remaining===0?'✓':String(remaining)));S.appendChild(el('div','eye',d<calendarDay()?'Inhalen':'Vandaag'));S.appendChild(el('h1','',rq?'Jouw 4 ontdekkingen':'Jouw 3 ontdekkingen'));S.appendChild(el('div','intro','Posities 1, 2 en 3 vormen de vaste Muziekmeter. Positie 4 verschijnt alleen wanneer de positieve voorraad aan het begin van deze dag onder 21 staat.'));S.appendChild(el('div','stock',stockLine()));q.ids.forEach(function(id,i){S.appendChild(cardFor(d,id,i,false,st))});if(rq)S.appendChild(cardFor(d,rq.id,3,true,rst));if(done===3&&reserveDone){var p=el('section','panel');p.appendChild(el('div','eye','Dag voltooid'));p.appendChild(el('div','intro',needFourth()?'De voorraad staat nog onder 21; morgen begint opnieuw met vier plekken.':'De positieve voorraad is op peil. Morgen zijn er drie officiële ontdekkingen.'));var b=el('button','btn',d<calendarDay()?'Ga naar de volgende set':'Klaar');b.onclick=function(){if(d<calendarDay())render();else caughtUp()};p.appendChild(b);S.appendChild(p)}}function detail(d,id,isReserve){var t=track(id),key=isReserve?reserveStateKey(d):stateKey(d),st=read(key,{});S.innerHTML='';var b=el('button','back','‹ Terug');b.onclick=function(){renderDay(d)};S.appendChild(b);S.appendChild(el('div','eye',(isReserve?'Voorraadplek 4 · ':'')+country(t.identity.country)+' · '+t.identity.releaseYear));S.appendChild(el('h1','',t.identity.title));S.appendChild(el('h3','muted',t.identity.artist));var sp=el('button','btn','▶ Open in Spotify');sp.onclick=function(){location.href=t.spotifyUrl};S.appendChild(sp);var why=el('section','panel');why.appendChild(el('div','eye',isReserve?'Waarom als voorraadkans?':'Waarom voor jou?'));why.appendChild(el('div','intro',t.editorial.whyForYou));S.appendChild(why);if(isReserve){var note=el('section','panel reserve');note.appendChild(el('div','eye','Buiten de Muziekmeter'));note.appendChild(el('div','intro','Dit is plek 4. Alleen RAAK of GOED vult de positieve zaterdagvoorraad aan; deze beoordeling verandert de 21 officiële weekmetingen niet.'));S.appendChild(note)}var r=el('section','panel');r.appendChild(el('div','eye','Jouw oordeel'));var g=el('div','ratings');['raak','goed','twijfel','nee'].forEach(function(v){var x=el('button','rate',labels[v]);x.onclick=function(){st[id]={rating:v,ratedAt:new Date().toISOString(),meter:!isReserve,slot:isReserve?4:null};write(key,st);if(window.MUSIC_DNA_LEARNING&&MUSIC_DNA_LEARNING.resyncStoredRatings)MUSIC_DNA_LEARNING.resyncStoredRatings();if(window.MUSIC_DNA_POSITIVE_BANK&&MUSIC_DNA_POSITIVE_BANK.sync)MUSIC_DNA_POSITIVE_BANK.sync();render()};g.appendChild(x)});r.appendChild(g);S.appendChild(r)}function allOfficialComplete(){for(var d=1;d<=7;d++)if(!officialCompleted(d))return false;return true}function render(){var cal=calendarDay();if(cal===0){C.textContent='Ontdek-DNA · '+CFG.display;S.innerHTML='<section class="panel"><div class="eye">Klaar voor de week</div><h1>'+CFG.display+' start zondag</h1></section>';return}var d=targetDay();if(d===7&&allOfficialComplete()&&dayResolved(7)){C.textContent='Ontdek-DNA · '+CFG.display;S.innerHTML='<section class="panel"><div class="eye">Week compleet</div><h1>21 Muziekmeter-beoordelingen klaar</h1><div class="stock">'+stockLine()+'</div><button class="btn" id="gift">🎁 Bekijk mijn cadeau</button></section>';document.getElementById('gift').onclick=function(){location.href='zaterdagcadeau.html?week='+encodeURIComponent(WEEK)};return}renderDay(d)}function fail(msg){S.innerHTML='<section class="panel"><div class="eye">Veilige wachtstand</div><h1>Deze week staat nog niet klaar</h1><div class="intro">Er is niets gewijzigd.'+(msg?' '+msg:'')+'</div></section>'}try{if(!CFG){var ws=MUSIC_DNA_WEEKS.status?MUSIC_DNA_WEEKS.status(new Date()):null;C.textContent='Ontdek-DNA';S.innerHTML='<section class="panel"><div class="eye">Veilige wachtstand</div><h1>De volgende week staat nog niet klaar</h1><div class="intro">Je bestaande beoordelingen en historie blijven bewaard. Music DNA opent pas een nieuwe week wanneer de gecontroleerde kandidaten daarvoor klaarstaan.</div></section>';return}await load(CFG.candidateFile);CAND=window[CFG.candidateGlobal];if(!CAND||!CAND.tracks||Object.keys(CAND.tracks).length<21)return fail();await load('music-dna-learning-v1.js');await load('music-dna-positive-bank-v1.js');await load('music-dna-selector-v1.js');render()}catch(e){fail()}})();</script></body></html>
