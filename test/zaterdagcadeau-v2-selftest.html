<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · zaterdagcadeau v2 self-test</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07110d;color:#f5f8f6;max-width:760px;margin:0 auto;padding:28px}h1{color:#20df68}.ok{color:#20df68}.bad{color:#ff7770}pre{white-space:pre-wrap;background:#0d1b15;padding:16px;border-radius:14px;line-height:1.5}</style></head><body><h1>Zaterdagcadeau v2 · geïsoleerde self-test</h1><p>Deze pagina gebruikt geen Music-DNA-localStorage en maakt geen Spotify-playlists aan.</p><pre id="out">Test wordt uitgevoerd…</pre><script>(function(){const lines=[];function assert(name,cond){if(!cond)throw new Error(name);lines.push('✓ '+name)}function saturdayStart(end){const x=new Date(end.getFullYear(),end.getMonth(),end.getDate());x.setDate(x.getDate()-1);return x}function selectedWeekIds(store,week){let ids=[];for(let d=1;d<=7;d++){const s=store['bmd-week-'+week+'-day'+d+'-selection-v1'],st=store['bmd-week-'+week+'-day'+d+'-v1']||{};if(!s||!Array.isArray(s.ids)||s.ids.length!==3)return null;for(const id of s.ids){if(!st[id]||!st[id].rating)return null;ids.push(id)}}return ids}function spotifyId(url){const m=String(url||'').match(/track\/([A-Za-z0-9]+)/);return m?m[1]:''}function validateGift(g,lookup){if(!g||!g.complete||!Array.isArray(g.ids)||g.ids.length!==21)return{ok:false,reason:'reserve'};const t=g.ids.map(id=>({id,track:lookup[id]}));if(t.some(x=>!x.track))return{ok:false,reason:'data'};if(t.some(x=>!spotifyId(x.track.spotifyUrl)))return{ok:false,reason:'data'};return{ok:true}}function deliveryAction(old,existing,uris){if(old&&(old.status==='complete'||(!old.status&&old.url))&&old.url)return'open';if(old&&old.id){if(existing===null)return'reauth';if(existing.length===21&&existing.every((x,i)=>x===uris[i]))return'complete-existing';if(existing.length!==0)return'block-partial';return'fill-existing'}return'create'}try{const sat=saturdayStart(new Date(2026,8,6));assert('W36 ontgrendelt op zaterdag 5 september 2026',sat.getFullYear()===2026&&sat.getMonth()===8&&sat.getDate()===5);assert('28 augustus blijft vóór de ontgrendeling',new Date(2026,7,28)<sat);assert('5 september 00:00 is ontgrendeld',!(new Date(2026,8,5)<sat));let store={};assert('ontbrekende dagselecties blokkeren het cadeau',selectedWeekIds(store,'2026-W36')===null);for(let d=1;d<=7;d++){const ids=[1,2,3].map(i=>'2026-W36-'+String((d-1)*3+i).padStart(2,'0'));store['bmd-week-2026-W36-day'+d+'-selection-v1']={ids};store['bmd-week-2026-W36-day'+d+'-v1']={};ids.forEach(id=>store['bmd-week-2026-W36-day'+d+'-v1'][id]={rating:'goed'})}assert('alle 21 beoordelingen worden geaccepteerd',selectedWeekIds(store,'2026-W36').length===21);delete store['bmd-week-2026-W36-day7-v1']['2026-W36-21'];assert('één ontbrekende beoordeling blokkeert het cadeau',selectedWeekIds(store,'2026-W36')===null);const lookup={},ids=[];for(let i=1;i<=21;i++){const id='x'+i;ids.push(id);lookup[id]={spotifyUrl:'https://open.spotify.com/track/AbCdEf'+i}}const gift={complete:true,ids,tracks:ids.map(trackId=>({trackId,rating:'goed'}))};assert('een volledig cadeau met 21 Spotify-tracks wordt geaccepteerd',validateGift(gift,lookup).ok);lookup.x7.spotifyUrl='';assert('een ontbrekende Spotify-id blokkeert veilige bezorging',!validateGift(gift,lookup).ok);const uris=ids.map((_,i)=>'spotify:track:'+i);assert('een reeds bezorgd cadeau wordt heropend, niet gedupliceerd',deliveryAction({status:'complete',id:'p',url:'u'},[],uris)==='open');assert('een aangemaakte maar lege playlist wordt hergebruikt',deliveryAction({status:'created',id:'p',url:'u'},[],uris)==='fill-existing');assert('een reeds gevulde playlist wordt als compleet herkend',deliveryAction({status:'created',id:'p',url:'u'},uris,uris)==='complete-existing');assert('een gedeeltelijk gevulde playlist wordt geblokkeerd in plaats van gedupliceerd',deliveryAction({status:'created',id:'p',url:'u'},uris.slice(0,5),uris)==='block-partial');document.getElementById('out').className='ok';lines.push('','ALLE TESTS GESLAAGD');document.getElementById('out').textContent=lines.join('\n')}catch(e){document.getElementById('out').className='bad';lines.push('✗ '+e.message);document.getElementById('out').textContent=lines.join('\n')}})();</script></body></html>
