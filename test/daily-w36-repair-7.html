<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Music DNA"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=7"><title>Music DNA</title><style>:root{--g:#1ed760;--t:#f5f8f6;--m:#aebbb5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17382b 0,#0b1713 34%,#070b0a 75%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding:76px 20px 48px}.top,.notice{text-align:center}.brand-logo{width:76px;height:76px;border-radius:17px}.brand-name,.eye{color:var(--g);font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.brand-name{margin-top:14px}.muted{color:var(--m);font-size:18px}.day-status{width:104px;height:104px;border:2px solid var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:80px auto 28px;font-size:42px;font-weight:850}h1{font-size:31px;line-height:1.08}.intro{font-size:17px;line-height:1.48}.btn{width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;margin:10px 0;background:var(--g);color:#07100b}.btn.secondary{background:#d8e1dc}.giftbox{font-size:96px}.giftlist{text-align:left;font-size:14px;line-height:1.55;background:rgba(0,0,0,.24);border-radius:16px;padding:14px}.footer{text-align:center;color:#718078;font-size:12px;margin-top:28px}.ok{font-size:72px}</style></head><body><main class="app"><div class="top"><img class="brand-logo" src="apple-touch-icon.png?v=7"><div class="brand-name">Ben's Music DNA</div><div class="muted" id="cycleLabel">Ontdek-DNA · 2026 · W36</div></div><div id="screen"></div><div class="footer">3 per dag · 21 per week · alleen +1/+2 naar zaterdag</div></main><script src="music-dna-data-v1.3.js?v=7"></script><script src="music-dna-candidates-w35-v1.js?v=7"></script><script src="music-dna-candidates-w36-v1.js?v=7"></script><script src="music-dna-delivery-registry-v1.js?v=7"></script><script src="music-dna-w35-reserve-v1.js?v=7"></script><script src="music-dna-learning-v1.js?v=7"></script><script src="music-dna-positive-bank-v1.js?v=2"></script><script>(function(){var screen=document.getElementById('screen'),WEEK='2026-W36',DISPLAY='2026 · W36',GIFT_KEY='bmd-gift-'+WEEK+'-v1',FINAL_KEY='bmd-gift-'+WEEK+'-final-v1';function read(k,f){try{var x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}function n(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function actualRatings(){var out={};for(var d=1;d<=7;d++){var st=read('bmd-week-'+WEEK+'-day'+d+'-v1',{});for(var id in st)if(st[id]&&st[id].rating&&/^2026-W36-/.test(id))out[id]=st[id]}return out}function csvCell(v){v=v==null?'':String(v);return /[\",\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v}function spotifyId(url){var m=String(url||'').match(/open\.spotify\.com\/track\/([A-Za-z0-9]+)/);return m?m[1]:''}function makeCsv(gift){var rows=[['position','artist','title','Spotify Track URI','spotify_url','rating','source_week']];gift.tracks.forEach(function(x,i){var sid=spotifyId(x.spotifyUrl);rows.push([i+1,x.artist,x.title,sid?'spotify:track:'+sid:'',x.spotifyUrl||'',x.rating||'',/^2026-W36-/.test(x.trackId)?'2026-W36':'2026-W35'])});return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}function downloadCsv(gift){var blob=new Blob([makeCsv(gift)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ben_Ontdek_DNA_2026-W36_Cadeau_21.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1200)}function showGift(){document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY+' · Cadeau';screen.innerHTML='';var ratings=actualRatings(),ids=Object.keys(ratings),w=n('section','notice'),positive=ids.filter(function(id){return ratings[id].rating==='raak'||ratings[id].rating==='goed'});w.appendChild(n('div','eye','Herstel bevestigd'));w.appendChild(n('div','giftbox','🎁'));w.appendChild(n('h1','',ids.length+'/21 W36-beoordelingen bewezen'));w.appendChild(n('div','intro',positive.length+' positieve W36-nummers zijn gevonden. De beoordelingen blijven ongewijzigd.'));var b=n('button','btn','Verder met mijn W36-cadeau');b.onclick=function(){if(MUSIC_DNA_LEARNING.restoreReserve)MUSIC_DNA_LEARNING.restoreReserve();if(MUSIC_DNA_LEARNING.hydrateExistingDelivery)MUSIC_DNA_LEARNING.hydrateExistingDelivery();var gift=MUSIC_DNA_POSITIVE_BANK.buildSaturdayPlaylist(WEEK,ids),inv=MUSIC_DNA_POSITIVE_BANK.inventory();if(!gift.complete){screen.innerHTML='';var z=n('section','notice');z.appendChild(n('div','eye','Herstelbuild 7 actief'));z.appendChild(n('h1','','Cadeauvoorraad nog niet compleet'));z.appendChild(n('div','intro','Bezorgbaar: '+gift.size+'/21 · positieve bank: '+inv.total+' · exact bezorgbaar: '+inv.deliverable+' · geblokkeerd: '+inv.blocked+'.'));screen.appendChild(z);return}write(GIFT_KEY,gift);renderGift(gift)};w.appendChild(b);screen.appendChild(w)}function renderGift(gift){screen.innerHTML='';document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY+' · Cadeau';var w=n('section','notice');w.appendChild(n('div','eye','Herstelbuild 7 actief'));w.appendChild(n('h1','','Jouw 21 nummers'));var list=n('div','giftlist');gift.tracks.forEach(function(x,i){list.appendChild(n('div','',String(i+1)+'. '+x.artist+' — '+x.title+' · '+(x.rating==='raak'?'❤️':'👍')))});w.appendChild(list);w.appendChild(n('div','intro','Alle 21 Spotify-identiteiten zijn exact aanwezig. Nu kan dit cadeau definitief worden vastgelegd.'));var b=n('button','btn','✅ Leg W36-cadeau definitief vast');b.onclick=function(){var ok=MUSIC_DNA_POSITIVE_BANK.commitSaturdayPlaylist(gift);if(!ok){alert('Veilige blokkade: W36 kon niet definitief worden vastgelegd.');return}var final={weekKey:WEEK,ids:gift.ids.slice(),tracks:gift.tracks,committedAt:new Date().toISOString(),spotifyExportReady:true};write(FINAL_KEY,final);renderFinal(gift)};w.appendChild(b);screen.appendChild(w)}function renderFinal(gift){screen.innerHTML='';document.getElementById('cycleLabel').textContent='Ontdek-DNA · '+DISPLAY+' · Definitief';var w=n('section','notice');w.appendChild(n('div','eye','W36 cadeau vastgelegd'));w.appendChild(n('div','ok','✅'));w.appendChild(n('h1','','21/21 definitief bewaard'));w.appendChild(n('div','intro','Exact deze 21 nummers staan nu in de W36-cadeaugeschiedenis. Je beoordelingen zijn niet gewijzigd. Het Spotify-importbestand bevat dezelfde 21 exacte track-ID’s in dezelfde volgorde.'));var b=n('button','btn','⬇️ Maak Spotify-importbestand');b.onclick=function(){downloadCsv(gift)};w.appendChild(b);var c=n('button','btn secondary','Bekijk mijn 21 nummers');c.onclick=function(){renderGift(gift)};w.appendChild(c);screen.appendChild(w)}function render(){var final=read(FINAL_KEY,null),gift=read(GIFT_KEY,null);if(final&&gift&&gift.complete&&gift.tracks&&gift.tracks.length===21){renderFinal(gift);return}if(gift&&gift.complete&&gift.tracks&&gift.tracks.length===21){renderGift(gift);return}var count=Object.keys(actualRatings()).length,w=n('section','notice');w.appendChild(n('div','day-status',count===21?'✓':String(count)));w.appendChild(n('div','eye','Herstelbuild 7 actief'));w.appendChild(n('h1','',count+' beoordelingen bevestigd'));w.appendChild(n('div','intro',DISPLAY+' is aantoonbaar compleet. De positieve oogst is klaar voor het zaterdagcadeau.'));var b=n('button','btn','🎁 Controleer mijn '+DISPLAY+'-cadeau');b.onclick=showGift;w.appendChild(b);screen.appendChild(w)}render()})();</script></body></html>
