<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100d"><title>Music DNA · Deep UX v5</title><style>:root{--bg:#07100d;--panel:#101916;--card:#141e1a;--line:#29332f;--text:#f6f8f7;--muted:#9ba9a2;--green:#78b95a;--orange:#f3a449;--red:#e45c64;--gold:#d7ad58}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173128 0,#09120f 35%,#050807 75%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 17px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.7px}.dna{color:var(--gold);font-size:23px}.tiny{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px}.back{border:0;background:none;color:#d8e0dc;padding:4px 0 16px;font-size:15px}.title{font-size:29px;line-height:1.08;margin:5px 0 8px}.lead{color:var(--muted);line-height:1.48;margin-bottom:18px}.card{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:19px;padding:15px;margin:10px 0}.hero{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0d1512;margin:10px 0 17px}.art{height:230px;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#625335,#1d1d18 45%,#090d0b 78%);font-size:31px;font-weight:900;letter-spacing:1px}.hero .copy{padding:15px}.row{display:flex;gap:9px}.discover{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px}.discover .cover{height:125px;border-radius:11px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;background:linear-gradient(145deg,#3b2b24,#111715)}.discover:nth-child(2) .cover{background:linear-gradient(145deg,#742f2f,#151716)}.discover:nth-child(3) .cover{background:linear-gradient(145deg,#34383c,#111716)}.discover p{font-size:11px;color:var(--muted);margin:5px 0}.btn{border:0;border-radius:999px;background:var(--orange);color:#15100a;padding:13px 17px;font-weight:850;font-size:14px;width:100%;margin-top:12px}.ghostbtn{background:transparent;color:#dbe3df;border:1px solid var(--line)}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}.rate{border:1px solid var(--line);border-radius:15px;background:#121b18;color:white;padding:13px 3px;font-size:12px}.rate span{display:block;font-size:25px;margin-bottom:5px}.list .item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.list .item:last-child{border:0}.thumb{width:55px;height:55px;border-radius:10px;background:#2b302d;display:grid;place-items:center;font-weight:800;font-size:10px}.grow{flex:1}.choice{font-size:12px;margin-top:4px}.heart{color:var(--red)}.good{color:var(--green)}.maybe{color:var(--gold)}.thermo{height:10px;background:#27302c;border-radius:99px;overflow:hidden;margin:11px 0}.thermo i{display:block;width:86%;height:100%;background:linear-gradient(90deg,var(--orange),var(--green));border-radius:99px}.metric{display:flex;justify-content:space-between;align-items:end}.metric strong{font-size:31px;color:var(--green)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--line);background:#121a17;color:#dce4df;border-radius:999px;padding:8px 10px;font-size:12px}.linkcard{display:flex;align-items:center;gap:12px}.ico{font-size:24px;width:35px;text-align:center}.section{margin:22px 0 8px;font-weight:800}.tabs{display:flex;gap:15px;border-bottom:1px solid var(--line);margin:8px 0 14px;overflow:auto}.tabs span{padding:10px 0;font-size:13px;color:var(--muted);white-space:nowrap}.tabs .on{color:var(--orange);border-bottom:2px solid var(--orange)}.news{padding:13px 0;border-bottom:1px solid var(--line)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:#09100e;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 4px}.nav button{border:0;background:none;color:#89968f;font-size:10px;min-width:65px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav .on{color:var(--orange)}.done{border-color:#36533e;background:rgba(73,120,79,.12)}.gift{border-color:#6a4d2c;background:linear-gradient(145deg,rgba(153,91,35,.18),rgba(255,255,255,.03))}.crumb{font-size:11px;color:#7f8e86;margin-bottom:10px}.hint{text-align:center;color:#78867f;font-size:11px;margin:18px 0}.play{font-size:42px;color:var(--orange);text-align:center;margin:12px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat .card{margin:0}.search{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:#111916;color:white;font-size:16px}</style></head><body><main class="app"><header class="top"><div><span class="dna">⌬</span> <span class="brand">MUSIC DNA</span></div><span class="tiny">prototype v5</span></header><div id="s"></div></main><nav class="nav"><button class="on" data-root="today"><b>⌂</b>Vandaag</button><button data-root="mine"><b>♡</b>Mijn Muziek</button><button data-root="actual"><b>▤</b>Actueel</button><button data-root="gift"><b>♧</b>Cadeau</button><button data-root="search"><b>⌕</b>Zoeken</button></nav><script>const S=document.querySelector('#s');let page='today',stack=[],rated=false;function E(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}function clear(back=true){S.innerHTML='';if(back&&stack.length){let b=E('button','back','‹ Terug');b.addEventListener('click',()=>render(stack.pop(),false));S.append(b)}}function go(p){stack.push(page);render(p)}function H(k,t,d){S.append(E('div','tiny',k),E('h1','title',t));if(d)S.append(E('div','lead',d))}function button(txt,fn,cls='btn'){let b=E('button',cls,txt);b.addEventListener('click',fn);return b}function render(p,push=true){page=p;window.scrollTo(0,0);({today,track,completed,rest,why,artist,album,reviews,live,setlist,newtrack,mine,actual,gift,search}[p]||today)()}function today(){clear(false);H('Dinsdag · Music DNA','Vandaag voor jou','Drie ontdekkingen. Music DNA brengt de muziek; jij bepaalt wat raakt.');let r=E('div','row');[['THE WARNING','Automatic Sun'],['ROYAL REPUBLIC','Fireman & Dancer'],['DEAD POET SOCIETY','HURT']].forEach((x,i)=>{let d=E('div','discover'),c=E('div','cover',x[0]);d.append(c,E('p','',x[1]));d.addEventListener('click',()=>go('track'));r.append(d)});S.append(r,E('div','hint','Tik op een ontdekking om te beginnen.'))}function track(){clear();H('The Warning · 2024','Automatic Sun','Eerst muziek. Daarna jij.');let h=E('div','hero');h.append(E('div','art','THE WARNING'));let cp=E('div','copy');cp.append(E('div','play','▶'),E('div','tiny','Wat vind jij van dit nummer?'));let rr=E('div','ratings');[['❤️','Raak'],['👍','Goed'],['😐','Twijfel'],['👎','Nee']].forEach(x=>{let b=E('button','rate');b.innerHTML='<span>'+x[0]+'</span>'+x[1];b.addEventListener('click',()=>{rated=true;go('completed')});rr.append(b)});cp.append(rr);h.append(cp);S.append(h)}function completed(){clear();H('3 van 3 beoordeeld','Jouw drie zijn compleet','Music DNA heeft vandaag weer iets van je geleerd.');let l=E('div','card list done');[['THE WARNING','Automatic Sun','❤️ Raak','heart'],['ROYAL REPUBLIC','Fireman & Dancer','👍 Goed','good'],['DEAD POET SOCIETY','HURT','😐 Twijfel','maybe']].forEach(x=>{let i=E('div','item');i.append(E('div','thumb',x[0].split(' ')[0]),E('div','grow',x[0]+' · '+x[1]),E('div','choice '+x[3],x[2]));l.append(i)});S.append(l);let c=E('div','card');c.append(E('div','tiny','Eén ding viel op'),E('h2','','❤️ The Warning raakte je.'),E('div','lead','Dat versterkt een interessante lijn in jouw smaak.'));c.append(button('Ontdek waarom →',()=>go('why')));S.append(c,button('Mijn dag is klaar',()=>go('rest'),'btn ghostbtn'))}function rest(){clear();H('Voor de rest van de dag','Jouw muziekwereld','Je hoeft niets meer. Maar als iets je nieuwsgierig maakt, ligt de rest klaar.');let c=E('div','card');c.append(E('div','tiny','Van vandaag'),E('h2','','❤️ The Warning bleef hangen'),E('div','lead','Wil je weten waarom dit zo goed aansluit?'));c.append(button('Waarom past dit bij mij? →',()=>go('why')));S.append(c);[['♡','Mijn Muziek','Jouw verzameling, geschiedenis en profiel','mine'],['▤','Actueel','Nieuws, recensies, concerten en setlists','actual'],['♧','Weekcadeau','Wat deze week voor jou ontstaat','gift'],['⌕','Zoeken','Neem zelf het initiatief','search']].forEach(x=>{let q=E('div','card linkcard');q.append(E('div','ico',x[0]),E('div','grow',x[1]+'\n'));q.querySelector('.grow').append(E('div','lead',x[2]));q.addEventListener('click',()=>go(x[3]));S.append(q)})}function why(){clear();H('Automatic Sun · ❤️ Raak','Waarom past dit bij mij?','Jouw oordeel staat voorop. Dit is wat Music DNA in de verbinding met jouw profiel ziet.');let c=E('div','card');let m=E('div','metric');m.append(E('div','','Mijn Smaak'),E('strong','','86%'));c.append(m,E('div','thermo'));c.lastChild.append(E('i'));c.append(E('div','lead','Sterke aansluiting bij jouw huidige Music DNA.'));S.append(c);[['⚡','Energie & intensiteit','Sterke match'],['🎙','Vrouwelijke rockvocalen','Sterke match'],['🎸','Moderne hardrock','Sterke match'],['〽','Melodische diepte','Nieuwe interessante lijn']].forEach(x=>{let q=E('div','card linkcard');q.append(E('div','ico',x[0]),E('div','grow',x[1]+' · '+x[2]));S.append(q)});S.append(button('Meer over The Warning →',()=>go('artist')))}function artist(){clear();H('Artiest','The Warning','Nu jij hier zelf bent aangekomen, mag de wereld groter worden.');let h=E('div','hero');h.append(E('div','art','THE WARNING'));let cp=E('div','copy');cp.append(E('div','lead','Mexicaanse rockband rond drie zussen. In jouw Music DNA vooral relevant door energie, melodie en moderne hardrock.'));h.append(cp);S.append(h);let tabs=E('div','tabs');['Overzicht','Albums','Nummers','Verhaal','Actueel','Live'].forEach((x,i)=>tabs.append(E('span',i?'':'on',x)));S.append(tabs);[['▣','Keep Me Fed','Album · 2024','album'],['📝','Recensies','Wat schreven anderen?','reviews'],['♬','Live','Concerten & setlists','live'],['🧬','Waarom voor jou','Terug naar de DNA-verbinding','why']].forEach(x=>{let q=E('div','card linkcard');q.append(E('div','ico',x[0]),E('div','grow',x[1]+' · '+x[2]));q.addEventListener('click',()=>go(x[3]));S.append(q)})}function album(){clear();H('The Warning · album','Keep Me Fed','Van artiest naar album. Eén natuurlijke verdieping verder.');let h=E('div','hero');h.append(E('div','art','KEEP ME FED'));let cp=E('div','copy');cp.append(E('h2','','Tracklist'));['Automatic Sun ❤️','S!CK','MORE','Qué Más Quieres','Burnout'].forEach((x,i)=>{let n=E('div','news',(i+1)+'  '+x);if(i===1)n.addEventListener('click',()=>go('newtrack'));cp.append(n)});h.append(cp);S.append(h,button('Lees recensies →',()=>go('reviews')))}function reviews(){clear();H('Keep Me Fed / The Warning','Recensies','Eerst had jij je eigen oordeel. Nu pas komt de mening van anderen.');[['Albumreview','Energie en samenspel krijgen veel aandacht.'],['Interview','De band vertelt over het ontstaan van het album.'],['Concertrecensie','Hoe de nummers live overeind blijven.']].forEach(x=>{let c=E('div','card');c.append(E('div','tiny',x[0]),E('h2','',x[1]),E('div','lead','Bron · datum · korte neutrale samenvatting.'));S.append(c)});S.append(button('En live? →',()=>go('live'),'btn ghostbtn'))}function live(){clear();H('The Warning','Live','Van nieuwsgierigheid naar de plek waar de muziek gebeurt.');[['Amsterdam','AFAS Live · binnenkort'],['Utrecht','TivoliVredenburg · archief'],['Recent','Laatste gespeelde setlist']].forEach((x,i)=>{let c=E('div','card');c.append(E('h2','',x[0]),E('div','lead',x[1]));if(i===2)c.addEventListener('click',()=>go('setlist'));S.append(c)});S.append(button('Bekijk recente setlist →',()=>go('setlist')))}function setlist(){clear();H('Recent concert','Setlist','Je kwam hier via The Warning. Eén onbekend nummer kan alweer een nieuwe deur zijn.');['S!CK','CHOKE','MORE','MONEY','EVOLVE','Narcisista'].forEach((x,i)=>{let c=E('div','news',(i+1)+'. '+x+(i===5?'  ·  nog niet door jou beoordeeld':''));if(i===5)c.addEventListener('click',()=>go('newtrack'));S.append(c)});S.append(E('div','hint','Tik op Narcisista om verder te ontdekken.'))}function newtrack(){clear();H('Nieuwe muzikale zijweg','Narcisista','Je begon vandaag bij Automatic Sun. Je nieuwsgierigheid bracht je hier.');let h=E('div','hero');h.append(E('div','art','NARCISISTA'));let cp=E('div','copy');cp.append(E('div','play','▶'),E('div','lead','Luister wanneer je wilt. Dit is geen vierde dagelijkse opdracht.'));h.append(cp);S.append(h,button('Bewaar voor later',()=>go('mine'),'btn ghostbtn'))}function mine(){clear();H('Jouw muzikale verhaal','Mijn Muziek','Wat door de tijd heen van jou is geworden.');[['❤️','Mijn verzameling','Raak & Goed'],['🧬','Mijn profiel','Smaak, lijnen en ontwikkeling'],['◷','Mijn geschiedenis','Van KISS 1975 tot vandaag'],['☆','Mijn artiesten','Artiesten die zijn blijven hangen']].forEach(x=>{let c=E('div','card linkcard');c.append(E('div','ico',x[0]),E('div','grow',x[1]+' · '+x[2]));S.append(c)})}function actual(){clear();H('Jouw muziekwereld nu','Actueel','Geen algemene nieuwsfeed: alleen wat rondom jouw muziek relevant kan zijn.');[['Ghost','Nieuw interview'],['Iron Maiden','Tour & recente setlists'],['KISS · Alive!','Nieuwe jubileumrecensie'],['The Warning','Live-aankondiging']].forEach(x=>{let c=E('div','card');c.append(E('h2','',x[0]),E('div','lead',x[1]));S.append(c)})}function gift(){clear();H('Zaterdag','Jouw weekcadeau','De dagelijkse keuzes komen hier één keer per week samen.');let c=E('div','card gift');c.append(E('div','tiny','Deze week'),E('h1','title','🎁 Jouw cadeau'),E('div','lead','21 ontdekkingen beoordeeld. Wat raakte, wat bleef en welke nieuwe lijnen Music DNA zag.'));c.append(button('Open mijn cadeau',()=>{}));S.append(c)}function search(){clear();H('Wanneer jij het initiatief neemt','Zoeken','Alles is vindbaar zonder dat alles voortdurend zichtbaar hoeft te zijn.');let i=E('input','search');i.placeholder='Artiest, nummer, album…';S.append(i);[['The Warning','Artiest'],['Automatic Sun','Nummer'],['Keep Me Fed','Album']].forEach(x=>{let c=E('div','card');c.append(E('h2','',x[0]),E('div','lead',x[1]));c.addEventListener('click',()=>go(x[1]==='Artiest'?'artist':x[1]==='Album'?'album':'track'));S.append(c)})}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{stack=[];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.root,false)}));render('today');</script></body></html>
