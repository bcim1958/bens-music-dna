<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music DNA · film spine v1</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;background:#000;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}.origin{position:absolute;left:50%;top:48%;width:min(54vw,760px);aspect-ratio:16/10;transform:translate(-50%,-50%) scale(.82);opacity:0;border-radius:50%;background:radial-gradient(ellipse at center,#000 0 18%,rgba(4,5,7,.98) 19% 25%,rgba(245,248,255,.95) 29%,rgba(190,205,225,.45) 38%,rgba(100,120,150,.13) 52%,transparent 69%);filter:blur(1px);mix-blend-mode:screen;animation:origin 90s linear both}.origin:before,.origin:after{content:"";position:absolute;inset:16% 5%;border:2px solid rgba(235,245,255,.48);border-radius:50%;filter:blur(6px);transform:rotate(-18deg);box-shadow:0 0 30px rgba(225,238,255,.42),0 0 70px rgba(180,205,240,.18)}.origin:after{inset:21% 10%;transform:rotate(16deg);opacity:.55}.rail{position:absolute;right:0;top:0;height:100%;width:31%;background:linear-gradient(90deg,transparent,rgba(2,7,5,.72) 14%,rgba(2,8,6,.93));border-left:1px solid rgba(120,180,145,.08);opacity:0;transform:translateX(20%);animation:rail 90s linear both}.pulse{position:absolute;inset:14% 10%;display:grid;place-items:center}.card{position:absolute;width:72%;max-width:300px;aspect-ratio:.82;background:rgba(9,15,12,.82);border:1px solid rgba(150,190,165,.22);border-radius:24px;box-shadow:0 22px 60px #000;opacity:0;filter:blur(10px);transform:scale(.92)}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px 20px 8px 8px;display:block}.rating{font-size:clamp(28px,3vw,48px);text-align:center;padding:14px}.c1{animation:p1 90s linear both}.c2{animation:p2 90s linear both}.gift{position:absolute;inset:18% 8%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;opacity:0;filter:blur(8px);animation:gift 90s linear both}.gift img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.finale{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:finale 90s linear both}.finale img{width:min(42vw,430px);filter:drop-shadow(0 0 35px rgba(30,215,96,.25))}.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 48% 48%,transparent 0,transparent 45%,rgba(0,0,0,.3) 72%,rgba(0,0,0,.9) 100%)}.controls{position:fixed;right:16px;bottom:14px;z-index:30}.controls button{background:#07100c;color:#fff;border:1px solid #41584b;border-radius:999px;padding:9px 14px}@keyframes origin{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}3%{opacity:.88}7%{opacity:1;transform:translate(-50%,-50%) scale(1)}14%{opacity:.32}20%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}@keyframes rail{0%,17%{opacity:0;transform:translateX(20%)}20%,61%{opacity:1;transform:none}66%,100%{opacity:0;transform:translateX(30%)}}@keyframes p1{0%,21%{opacity:0;filter:blur(12px);transform:scale(.9)}24%,29%{opacity:1;filter:blur(0);transform:scale(1)}32%,100%{opacity:0;filter:blur(12px);transform:scale(.95)}}@keyframes p2{0%,32%{opacity:0;filter:blur(12px);transform:scale(.9)}35%,40%{opacity:1;filter:blur(0);transform:scale(1)}43%,100%{opacity:0;filter:blur(12px);transform:scale(.95)}}@keyframes gift{0%,49%{opacity:0;filter:blur(10px);transform:scale(.96)}53%,61%{opacity:.95;filter:blur(0);transform:scale(1)}64%,100%{opacity:0;filter:blur(8px);transform:scale(1.02)}}@keyframes finale{0%,92%{opacity:0;transform:scale(.94);filter:blur(8px)}96%,100%{opacity:1;transform:scale(1);filter:blur(0)}} </style></head><body><div class="stage"><canvas id="c"></canvas><div class="origin"></div><aside class="rail"><div class="pulse"><div class="card c1"><img id="a"><div class="rating">❤️</div></div><div class="card c2"><img id="b"><div class="rating">👍</div></div><div class="gift" id="gift"></div></div></aside><div class="finale"><img src="icon.svg" alt="Music DNA"></div><div class="veil"></div></div><div class="controls"><button onclick="location.reload()">↻ opnieuw</button></div><script src="music-dna-candidates-w36-v1.js"></script><script>(async()=>{const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tracks=Object.values(MUSIC_DNA_W36_CANDIDATES.tracks),imgs=[];let W,H,D;function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);async function art(t){try{let r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(t.spotifyUrl)),j=await r.json(),im=new Image();im.crossOrigin='anonymous';im.src=j.thumbnail_url;await im.decode();return im}catch(e){return null}}for(const t of tracks){let im=await art(t);if(im)imgs.push(im)}if(!imgs.length)return;document.getElementById('a').src=imgs[0].src;document.getElementById('b').src=imgs[1%imgs.length].src;for(let i=0;i<21;i++){let im=document.createElement('img');im.src=imgs[i%imgs.length].src;document.getElementById('gift').appendChild(im)}const N=520,P=[];for(let i=0;i<N;i++){let ang=Math.random()*Math.PI*2,r=.04+Math.pow(Math.random(),.62)*.58,u=(i/2|0)/Math.ceil(N/2),side=i%2?1:-1,turn=u*Math.PI*6.1;P.push({im:imgs[i%imgs.length],ang,r,sx:.5+Math.cos(ang)*r,sy:.48+Math.sin(ang)*r*.58,tx:.5+side*.16*Math.sin(turn),ty:.08+.84*u,delay:Math.random()*.18,rot:(Math.random()-.5)*.6})}const start=performance.now(),dur=90000,cl=x=>Math.max(0,Math.min(1,x)),sm=x=>x*x*(3-2*x);function draw(now){let t=cl((now-start)/dur),arrival=sm(cl((t-.045)/.19)),order=sm(cl((t-.49)/.29)),abstract=sm(cl((t-.73)/.16)),rotate=sm(cl((t-.86)/.08));ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.48,H*.48,0,W*.48,H*.48,Math.max(W,H)*.7);bg.addColorStop(0,'#07100d');bg.addColorStop(.55,'#020403');bg.addColorStop(1,'#000');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.rotate(rotate*Math.PI/2);ctx.translate(-W/2,-H/2);for(let i=0;i<N;i++){let p=P[i],loc=sm(cl((arrival-p.delay)/(1-p.delay))),ord=sm(cl((order-p.delay*.2)/(1-p.delay*.2)));if(loc<.01)continue;let sx=.5+Math.cos(p.ang)*p.r*(.08+.92*loc),sy=.48+Math.sin(p.ang)*p.r*.58*(.08+.92*loc),x=(sx+(p.tx-sx)*ord)*W,y=(sy+(p.ty-sy)*ord)*H,depth=.25+.75*loc,s=Math.min(W,H)*(.009+.019*depth)*(1-.25*ord);ctx.save();ctx.globalAlpha=loc*(1-.38*abstract);ctx.translate(x,y);ctx.rotate(p.rot*(1-ord));ctx.filter='blur('+((1-loc)*9)+'px) brightness('+(0.35+.7*loc)+')';if(abstract){ctx.shadowBlur=18*abstract;ctx.shadowColor=i%3===0?'#ff851b':i%3===1?'#e33cff':'#36a9ff'}ctx.drawImage(p.im,-s/2,-s/2,s,s);ctx.restore()}ctx.restore();if(abstract){ctx.save();ctx.globalCompositeOperation='screen';let g=ctx.createLinearGradient(W*.25,0,W*.75,0);g.addColorStop(0,'#ff861c');g.addColorStop(.5,'#e12fff');g.addColorStop(1,'#2aaaff');ctx.strokeStyle=g;ctx.globalAlpha=.18+.55*abstract;ctx.lineWidth=2+5*abstract;for(let side of [-1,1]){ctx.beginPath();for(let j=0;j<220;j++){let u=j/219,x=W*(.5+side*.16*Math.sin(u*Math.PI*6.1)),y=H*(.08+.84*u);j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}for(let side of [-1,1]){ctx.beginPath();for(let j=0;j<220;j++){let u=j/219,x=W*(.08+.84*u),amp=.07+.10*Math.sin(u*Math.PI*10)**2,y=H*(.5+side*amp*Math.sin(u*Math.PI*18));j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}ctx.restore()}if(t<.96)requestAnimationFrame(draw)}requestAnimationFrame(draw)})();</script></body></html>
